<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="fichePrestaTitre">Prestataire - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:520px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
.profil{background:#fff;border-radius:16px;padding:20px;text-align:center;margin-top:14px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.avatar{width:90px;height:90px;border-radius:50%;background:#f59e0b;color:#fff;font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profil h1{font-size:22px} .profil p{color:#64748b;font-size:13px;margin:4px 0}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#dcfce7;color:#166534;margin-top:6px}
.badge-purple{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#ede9fe;color:#6d28d9;margin-top:6px}
.badge-orange{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#fef3c7;color:#92400e;margin-top:6px}
.badgeQuartier{display:inline-block;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;margin-top:8px}
.badgeQuartier.vert{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.badgeQuartier.orange{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.badgeQuartier.gris{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.stat{background:#fff;border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:16px;display:block} .stat small{color:#64748b;font-size:11px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.btn{width:100%;background:#f59e0b;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;margin-top:10px}
.btn-dark{background:#0f172a;color:#fff}
.btn-mine{background:#e2e8f0;color:#64748b;cursor:not-allowed}
.btn-orange{background:#fffbeb;border:2px solid #f59e0b;color:#92400e}
.btn-green{background:#16a34a;color:#fff}
.avis{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;font-size:13px}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:24px;text-align:center;color:#64748b}
.info-escrow{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;color:#92400e;margin-top:12px;text-align:left}
.galerie{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.galerie img{width:100%;height:110px;object-fit:cover;border-radius:10px;background:#e2e8f0}
.galerie a{color:#1e40af;font-size:13px;word-break:break-all}
.galerie-hotel{position:relative;border-radius:14px;overflow:hidden;margin-top:10px}
.galerie-hotel img{width:100%;height:220px;object-fit:cover;display:block;background:#e2e8f0}
.galerie-hotel .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.qty{display:flex;align-items:center;gap:10px;margin-top:10px}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid #e2e8f0;background:#fff;font-size:20px;font-weight:800;cursor:pointer}
.qty b{font-size:16px;min-width:20px;text-align:center}
.qty span{font-size:13px;color:#64748b}
.input-resa{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;margin-top:8px}
.total-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.6}
.total-box b{font-size:16px}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="history.back()">← <span data-i18n="retour">Retour</span></div>
<div id="contenu">Chargement du prestataire...</div>
<div id="annonces"></div>
<div id="avis"></div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = sb;
const params = new URLSearchParams(location.search);
let prestaId = params.get('id') || params.get('prestataire') || localStorage.getItem('fiche_prestataire_id') || '';
let moiId = '';
let annoncesGlobales = [];
let profilGlobal = null;
let quantites = {};
let photosHotel = [];
let idxPhotoHotel = 0;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function estValideAnnonce(a){
  const s = String(a.status || '').toLowerCase().trim();
  if(!s) return true;
  return ['valide','valid','publie','publié','publiee','actif','active'].includes(s);
}
function badgeQuartierHTML(p){
  const quartier = p.quartier || '';
  const verifie = p.quartier_verifie === true || String(p.verification_quartier||'').toLowerCase()==='valide' || String(p.verification_quartier||'').toLowerCase()==='verifie';
  const enAttente = String(p.verification_quartier||'').toLowerCase()==='demande_envoyee' || String(p.verification_quartier||'').toLowerCase()==='en_attente';
  if(!quartier) return '';
  if(verifie) return `<div><span class="badgeQuartier vert">✅ Vérifié à ${esc(quartier)}</span></div><p style="font-size:11px">Ce prestataire a prouvé qu'il est vraiment de ${esc(quartier)}. Tu peux lui faire confiance, il est proche de toi.</p>`;
  if(enAttente) return `<div><span class="badgeQuartier orange">⏳ Vérification en cours à ${esc(quartier)}</span></div>`;
  return `<div><span class="badgeQuartier gris">📍 ${esc(quartier)} (non vérifié)</span></div>`;
}
function parsePhotos(val){
  if(!val) return [];
  if(Array.isArray(val)) return val.filter(Boolean);
  try{ const j = JSON.parse(val); if(Array.isArray(j)) return j.filter(Boolean); }catch(e){}
  return String(val).split(',').map(s=>s.trim()).filter(Boolean);
}
function toutesPhotosAnnonce(a){
  let arr = [];
  arr = arr.concat(parsePhotos(a.photos));
  arr = arr.concat(parsePhotos(a.photo_urls));
  if(a.photo_url) arr.push(a.photo_url);
  return [...new Set(arr.filter(Boolean))];
}
function changerQuantite(id, delta){
  quantites[id] = Math.max(0, (quantites[id]||1) + delta);
  const el = document.getElementById('qty-'+id);
  if(el) el.textContent = quantites[id];
  const tot = document.getElementById('total-'+id);
  const a = annoncesGlobales.find(x=>String(x.id)===String(id));
  if(tot && a){ const prix = Number(a.prix_indicatif||0); tot.textContent = 'Total : ' + (prix*quantites[id]).toLocaleString() + ' FCFA'; }
}
function photoSuivante(){
  if(!photosHotel.length) return;
  idxPhotoHotel = (idxPhotoHotel+1)%photosHotel.length;
  const img = document.getElementById('imgHotelPrincipale');
  if(img) img.src = photosHotel[idxPhotoHotel];
  const c = document.getElementById('compteurHotel');
  if(c) c.textContent = (idxPhotoHotel+1)+' / '+photosHotel.length;
}
function photoPrecedente(){
  if(!photosHotel.length) return;
  idxPhotoHotel = (idxPhotoHotel-1+photosHotel.length)%photosHotel.length;
  const img = document.getElementById('imgHotelPrincipale');
  if(img) img.src = photosHotel[idxPhotoHotel];
  const c = document.getElementById('compteurHotel');
  if(c) c.textContent = (idxPhotoHotel+1)+' / '+photosHotel.length;
}
function majTotalHotel(){
  const a = annoncesGlobales[0];
  if(!a) return;
  const nuits = Number(document.getElementById('nuitsHotel')?.value||1);
  const chambres = Number(document.getElementById('chambresHotel')?.value||1);
  const prix = Number(a.prix_indicatif||0);
  const total = prix * nuits * chambres;
  const el = document.getElementById('totalHotel');
  if(el) el.innerHTML = `💰 <b>${total.toLocaleString()} FCFA</b><br><small>${prix.toLocaleString()} FCFA / nuit × ${nuits} nuit(s) × ${chambres} chambre(s)</small>`;
}
async function charger(){
  const {data:{user}} = await sb.auth.getUser();
  moiId = user?.id || '';
  if(!prestaId && moiId) prestaId = moiId;
  if(!prestaId){ document.getElementById('contenu').innerHTML='Prestataire introuvable. <a href="index.html">Retour</a>'; return; }
  const {data: p, error} = await sb.from('profiles').select('id, nom, prenom, nom_entreprise, type_compte, type_fournisseur, photo_profil_url, photo_profil, description_profil, categorie_prestataire, quartier, verification_quartier, quartier_verifie, ville, pays, statut_validation, travaille_distance, portfolio_url, annees_experience, disponible_aujourd_hui, photos_avant_apres, langues, lieux_connus, vehicule, disponible_maintenant, verifie').eq('id', prestaId).maybeSingle();
  if(error || !p){ document.getElementById('contenu').innerHTML='Prestataire introuvable. <a href="index.html">Retour Accueil</a>'; return; }
  profilGlobal = p;
  const statut = String(p.statut_validation || '').toLowerCase();
  if(statut && statut!=='valide' && statut!=='valid'){
    document.getElementById('contenu').innerHTML = `<div class="empty"><b>Profil en cours de vérification</b><br>Ce prestataire n'est pas encore validé par Rocyinter.<br><br><button class="btn btn-dark" onclick="location.href='index.html'">Voir d'autres services</button></div>`;
    document.getElementById('annonces').innerHTML = '';
    document.getElementById('avis').innerHTML = '';
    return;
  }
  const photo = p.photo_profil_url || p.photo_profil || '';
  const description = p.description_profil || '';
  const categorie = p.categorie_prestataire || '';
  const nomAff = p.nom_entreprise || p.nom || 'Prestataire';
  const typeC = String(p.type_compte || p.type_fournisseur || '').toLowerCase();
  const labelType = typeC==='entreprise' ? '🏢 Entreprise' : typeC==='professionnel' ? '👨‍🔧 Professionnel' : typeC==='livreur' ? '🛵 Livreur' : typeC==='client' ? '🛒 Client' : '💼 Fournisseur';
  const initiale = (nomAff||'R').charAt(0).toUpperCase();
  const lieu = [p.pays, p.ville, p.quartier].filter(Boolean).join(' - ');
  let annoncesBrutes = [];
  const r1 = await sb.from('annonces').select('id, titre, categorie, univers, description, prix_fixe, prix_indicatif, photo_url, photos, photo_urls, localite, ville, quartier, status, chambres_restantes').eq('prestataire_id', prestaId).order('created_at',{ascending:false});
  annoncesBrutes = r1.data || [];
  const annonces = (annoncesBrutes||[]).filter(estValideAnnonce);
  annoncesGlobales = annonces;
  annonces.forEach(a=>{ quantites[a.id]=1; });
  const {data: avis} = await sb.from('avis').select('note, commentaire, created_at').eq('prestataire_id', prestaId).order('created_at',{ascending:false});
  let moyenne = 0; if(avis && avis.length) moyenne = (avis.reduce((a,b)=>a+Number(b.note||0),0)/avis.length).toFixed(1);
  const cestMoi = moiId && String(moiId)===String(prestaId);
  const estVerifieQuartier = p.quartier_verifie === true || String(p.verification_quartier||'').toLowerCase()==='valide';
  const btnVerifier = (cestMoi && !estVerifieQuartier) ? `<button class="btn btn-orange" onclick="location.href='verification.html'">📍 Faire vérifier mon quartier</button>` : '';
  const premierUnivers = String(annonces[0]?.univers||'').toLowerCase();
  const isManger = premierUnivers==='manger';
  const isSejour = premierUnivers==='sejour';
  let btnPrincipal = '';
  if(cestMoi) btnPrincipal = `<button class="btn btn-mine" disabled>C'est ton profil</button>`;
  else if(isManger) btnPrincipal = `<button class="btn" onclick="document.getElementById('annonces').scrollIntoView({behavior:'smooth'})">🍽️ Voir le menu en bas ↓</button>`;
  else if(isSejour) btnPrincipal = `<button class="btn btn-green" onclick="document.getElementById('annonces').scrollIntoView({behavior:'smooth'})">📅 Réserver en bas ↓</button>`;
  else btnPrincipal = `<button class="btn" onclick="contacter('${esc(annonces && annonces[0] ? annonces[0].id : '')}')">💬 Discuter avec ${esc(nomAff)}</button>`;
  let complements = '';
  if(p.travaille_distance === true) complements += `<span class="badge-purple">💻 Travaille à distance</span> `;
  if(p.disponible_aujourd_hui === true) complements += `<span class="badge">🟢 Disponible aujourd'hui</span> `;
  if(p.disponible_maintenant === true) complements += `<span class="badge">🟢 Disponible maintenant</span> `;
  if(p.vehicule) complements += `<span class="badge-orange">🛵 / 🚗 ${esc(p.vehicule)}</span> `;
  if(p.annees_experience) complements += `<p>⭐ ${esc(p.annees_experience)} ans d'expérience</p>`;
  if(p.langues) complements += `<p>🗣️ <b>Langues parlées :</b> ${esc(p.langues)}</p>`;
  if(p.lieux_connus) complements += `<p>📍 <b>Lieux connus :</b> ${esc(p.lieux_connus)}</p>`;
  if(p.portfolio_url) complements += `<p>📁 <b>Portfolio :</b> <a href="${esc(p.portfolio_url)}" target="_blank" rel="noopener">${esc(p.portfolio_url)}</a></p>`;
  const photosAvantApres = parsePhotos(p.photos_avant_apres);
  let galerieHTML = '';
  if(isSejour && annonces.length){
    photosHotel = [];
    annonces.forEach(a=>{ photosHotel = photosHotel.concat(toutesPhotosAnnonce(a)); });
    if(photo) photosHotel.unshift(photo);
    photosHotel = [...new Set(photosHotel.filter(Boolean))];
    if(photosHotel.length){
      galerieHTML = `<div class="card"><h3>📸 Photos de l'hôtel</h3><div class="galerie-hotel"><img id="imgHotelPrincipale" src="${esc(photosHotel[0])}" onerror="this.remove()"><button class="nav" style="left:8px" onclick="photoPrecedente()">‹</button><button class="nav" style="right:8px" onclick="photoSuivante()">›</button><div id="compteurHotel" style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;padding:4px 10px;border-radius:99px;font-size:12px">1 / ${photosHotel.length}</div></div><div class="galerie">${photosHotel.map((u,i)=>`<img src="${esc(u)}" onclick="idxPhotoHotel=${i};document.getElementById('imgHotelPrincipale').src='${esc(u)}';document.getElementById('compteurHotel').textContent='${i+1} / ${photosHotel.length}'" onerror="this.remove()" style="cursor:pointer">`).join('')}</div></div>`;
    }
  } else if(photosAvantApres.length){
    galerieHTML = `<div class="card"><h3>📸 Photos avant / après - Anciens évènements / Travaux</h3><p>Preuves de ses anciens travaux. Regarde avant de commander.</p><div class="galerie">${photosAvantApres.map(u=>`<img src="${esc(u)}" onerror="this.remove()">`).join('')}</div></div>`;
  }
  document.getElementById('contenu').innerHTML = `
    <div class="profil">
      <div class="avatar">${photo ? `<img src="${esc(photo)}" onerror="this.remove()">` : esc(initiale)}</div>
      <h1>🏢 ${esc(nomAff)}</h1>
      <p>🌍 ${esc(lieu)}</p>
      <p>${labelType} • ${esc(categorie)}</p>
      ${p.nom_entreprise && p.nom ? `<p style="font-size:12px">Contact : ${esc(p.nom)} ${esc(p.prenom||'')}</p>` : ''}
      <span class="badge">✅ Profil vérifié Rocyinter</span>
      ${badgeQuartierHTML(p)}
      <div style="margin-top:8px;text-align:left">${complements}</div>
      <p style="margin-top:10px;text-align:left">${esc(description)}</p>
      ${btnPrincipal}
      ${btnVerifier}
      <button class="btn btn-dark" onclick="location.href='index.html'">Voir d'autres services</button>
      <div class="info-escrow">🔒 Ne paie jamais en dehors de Rocyinter. Discute ici, paie via Escrow après acceptation dans le Chat, l'argent est bloqué jusqu'à la fin de la mission. Le bouton Payer s'affiche dans le Chat, pas ici.</div>
    </div>
    <div class="stats">
      <div class="stat"><b>${avis?.length||0}</b><small>Avis</small></div>
      <div class="stat"><b>${moyenne||'—'} ⭐</b><small>Note moyenne</small></div>
      <div class="stat"><b>${annonces?.length||0}</b><small>${isManger ? 'Plats' : isSejour ? 'Offres' : 'Annonces'}</small></div>
    </div>
    ${galerieHTML}`;
  let titreSection = '📋 Ses services';
  if(isManger) titreSection = '🍽️ Son menu - Choisis tes plats';
  if(isSejour) titreSection = '🏨 Réserver - Son hôtel';
  let htmlAnnonces = `<h3 style="margin:10px 0">${titreSection}</h3>`;
  if(!annonces.length){ htmlAnnonces += '<p style="color:#64748b;font-size:13px">Aucune annonce validée pour l’instant.</p>'; }
  else if(isManger){
    htmlAnnonces += annonces.map(a=>{
      const prix = Number(a.prix_indicatif||0);
      const prixTxt = prix>0 ? prix.toLocaleString()+' FCFA' : 'Prix à discuter';
      const btnCmd = cestMoi ? `<button class="btn btn-mine" disabled>C'est ton plat</button>` : `<button class="btn btn-green" onclick="commanderPlat('${esc(a.id)}')">🛒 Commander ce plat →</button><button class="btn btn-dark" onclick="contacter('${esc(a.id)}')">💬 Discuter</button>`;
      return `<div class="card">${a.photo_url ? `<img src="${esc(a.photo_url)}" style="width:100%;height:170px;object-fit:cover;border-radius:12px;margin-bottom:10px" onerror="this.remove()">` : ''}<h3>🍽️ ${esc(a.titre)}</h3><p>${esc(a.description)}<br><b style="color:#111;font-size:15px">${esc(prixTxt)}</b></p><div class="qty"><button type="button" onclick="changerQuantite('${esc(a.id)}',-1)">−</button><b id="qty-${esc(a.id)}">1</b><button type="button" onclick="changerQuantite('${esc(a.id)}',1)">+</button><span>plat(s) • <b id="total-${esc(a.id)}" style="color:#111">Total : ${prix.toLocaleString()} FCFA</b></span></div>${btnCmd}</div>`;
    }).join('');
  } else if(isSejour){
    const a = annonces[0];
    const prix = Number(a.prix_indicatif||0);
    const prixTxt = prix>0 ? prix.toLocaleString()+' FCFA / nuit' : 'Prix à discuter';
    const btnResa = cestMoi ? `<button class="btn btn-mine" disabled>C'est ton hôtel</button>` : `<button class="btn btn-green" onclick="reserverHotel('${esc(a.id)}')">📅 Réserver cet hôtel →</button><button class="btn btn-dark" onclick="contacter('${esc(a.id)}')">💬 Discuter</button>`;
    htmlAnnonces += `<div class="card"><h3>🏨 ${esc(a.titre)}</h3><p>${esc(a.description)}<br><b style="color:#111;font-size:15px">${esc(prixTxt)}</b>${a.chambres_restantes!=null ? `<br>🛏️ ${esc(a.chambres_restantes)} chambre(s) restante(s)` : ''}</p><label style="margin-top:8px">📅 Date d'arrivée</label><input class="input-resa" id="dateArrivee" type="date"><label style="margin-top:8px">🌙 Nombre de nuits</label><input class="input-resa" id="nuitsHotel" type="number" min="1" value="1" oninput="majTotalHotel()"><label style="margin-top:8px">🛏️ Nombre de chambres</label><input class="input-resa" id="chambresHotel" type="number" min="1" value="1" oninput="majTotalHotel()"><div class="total-box" id="totalHotel">💰 <b>${prix.toLocaleString()} FCFA</b><br><small>${prix.toLocaleString()} FCFA / nuit × 1 nuit × 1 chambre</small></div>${btnResa}<p style="font-size:12px">Après ta réservation, tu discutes dans le Chat. Le prestataire accepte, puis le bouton 💳 Payer s'affiche dans le Chat.</p></div>`;
    if(annonces.length>1){
      htmlAnnonces += `<h3 style="margin:10px 0">Autres offres</h3>` + annonces.slice(1).map(x=>{
        const px = Number(x.prix_indicatif||0);
        return `<div class="card">${x.photo_url ? `<img src="${esc(x.photo_url)}" style="width:100%;height:140px;object-fit:cover;border-radius:12px;margin-bottom:10px" onerror="this.remove()">` : ''}<h3>${esc(x.titre)}</h3><p>${esc(x.description)}<br><b>${px.toLocaleString()} FCFA</b></p><button class="btn btn-green" onclick="reserverHotel('${esc(x.id)}')">📅 Réserver →</button></div>`;
      }).join('');
    }
  } else {
    htmlAnnonces += annonces.map(a=>{
      const prixTxt = (a.prix_indicatif > 0) ? (a.prix_fixe ? Number(a.prix_indicatif).toLocaleString()+' FCFA' : 'À partir de '+Number(a.prix_indicatif).toLocaleString()+' FCFA') : 'Prix à discuter';
      const btnAnnonce = cestMoi ? `<button class="btn btn-mine" disabled>C'est ton annonce</button>` : `<button class="btn" onclick="contacter('${esc(a.id)}')">Discuter pour cette annonce</button>`;
      return `<div class="card">${a.photo_url ? `<img src="${esc(a.photo_url)}" style="width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px" onerror="this.remove()">` : ''}<h3>${esc(a.titre)}</h3><p>${esc(a.categorie)} • ${esc(a.univers||'')} • ${esc([a.localite,a.ville].filter(Boolean).join(' - '))}<br>${esc(prixTxt)}<br>${esc(a.description)}</p>${btnAnnonce}</div>`;
    }).join('');
  }
  document.getElementById('annonces').innerHTML = htmlAnnonces;
  document.getElementById('avis').innerHTML = `<h3 style="margin:14px 0 10px">⭐ Avis clients (${avis?.length||0})</h3>` + (avis && avis.length ? avis.map(a=>`<div class="avis">${'⭐'.repeat(Math.min(5,Number(a.note||5)))}<br>${esc(a.commentaire)}</div>`).join('') : '<p style="color:#64748b;font-size:13px">Aucun avis pour l’instant. Sois le premier à commander.</p>');
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
async function commanderPlat(annonceId){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ alert('Connecte-toi pour commander.'); location.href='connexion.html'; return; }
  if(String(prestaId)===String(user.id)){ alert("C'est ton plat."); return; }
  const q = quantites[annonceId]||1;
  if(q<=0){ alert('Choisis au moins 1 plat avec +'); return; }
  localStorage.setItem('chat_prestataire', prestaId);
  localStorage.setItem('chat_annonce', annonceId);
  localStorage.setItem('commande_quantite', String(q));
  localStorage.setItem('commande_type', 'plat');
  location.href='chat.html';
}
async function reserverHotel(annonceId){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ alert('Connecte-toi pour réserver.'); location.href='connexion.html'; return; }
  if(String(prestaId)===String(user.id)){ alert("C'est ton hôtel."); return; }
  const date = document.getElementById('dateArrivee')?.value || '';
  const nuits = Number(document.getElementById('nuitsHotel')?.value||1);
  const chambres = Number(document.getElementById('chambresHotel')?.value||1);
  if(!date){ alert('Choisis ta date d\'arrivée.'); document.getElementById('dateArrivee')?.focus(); return; }
  localStorage.setItem('chat_prestataire', prestaId);
  localStorage.setItem('chat_annonce', annonceId);
  localStorage.setItem('commande_type', 'sejour');
  localStorage.setItem('commande_date', date);
  localStorage.setItem('commande_nuits', String(nuits));
  localStorage.setItem('commande_chambres', String(chambres));
  location.href='chat.html';
}
async function contacter(annonceId){
  const {data:{user}} = await sb.auth.getUser();
  const uid = user?.id;
  const t = window.rocyT || (k=>k);
  if(!uid){ alert(t('connectePourCommander')); location.href='connexion.html'; return; }
  const {data: profil} = await sb.from('profiles').select('type_compte').eq('id', uid).maybeSingle();
  const type = String(profil?.type_compte || '').toLowerCase();
  if(type==='admin'){ alert('Admin : tu ne peux pas chatter, tu gères dans Admin.'); return; }
  if(String(prestaId)===String(uid)){ alert("C'est ton profil. Tu ne peux pas te parler à toi-même."); return; }
  localStorage.setItem('chat_prestataire', prestaId);
  if(annonceId) localStorage.setItem('chat_annonce', annonceId);
  location.href='chat.html';
}
