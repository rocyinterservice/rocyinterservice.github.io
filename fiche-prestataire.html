<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="fichePrestaTitre">Prestataire - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:520px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
.profil{background:#fff;border-radius:16px;padding:20px;text-align:center;margin-top:14px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.avatar{width:90px;height:90px;border-radius:50%;background:#f59e0b;color:#fff;font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profil h1{font-size:22px} .profil p{color:#64748b;font-size:13px;margin:4px 0}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#dcfce7;color:#166534;margin-top:6px}
.badgeQuartier{display:inline-block;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;margin-top:8px}
.badgeQuartier.vert{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.badgeQuartier.orange{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.badgeQuartier.gris{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.stat{background:#fff;border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:16px;display:block} .stat small{color:#64748b;font-size:11px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.btn{width:100%;background:#f59e0b;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;margin-top:10px}
.btn-dark{background:#0f172a;color:#fff}
.btn-mine{background:#e2e8f0;color:#64748b;cursor:not-allowed}
.btn-orange{background:#fffbeb;border:2px solid #f59e0b;color:#92400e}
.avis{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;font-size:13px}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:24px;text-align:center;color:#64748b}
.info-escrow{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;color:#92400e;margin-top:12px;text-align:left}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="history.back()">← <span data-i18n="retour">Retour</span></div>
<div id="contenu">Chargement du prestataire...</div>
<div id="annonces"></div>
<div id="avis"></div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = sb;
const prestaId = localStorage.getItem('fiche_prestataire_id');
let moiId = '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!prestaId){ document.getElementById('contenu').innerHTML='Prestataire introuvable. <a href="index.html">Retour</a>'; }
function estValideAnnonce(a){
  const s = String(a.status || a.statut || '').toLowerCase().trim();
  if(!s) return true;
  return s==='valide' || s==='valid' || s==='publie' || s==='publié' || s==='publiee' || s==='actif' || s==='active';
}
// NOUVEAU : Badge vérification par quartier
function badgeQuartierHTML(p){
  const quartier = p.quartier || p.localite || '';
  const verifie = p.quartier_verifie === true || String(p.verification_quartier||'').toLowerCase()==='valide' || String(p.verification_quartier||'').toLowerCase()==='verifie';
  const enAttente = String(p.verification_quartier||'').toLowerCase()==='demande_envoyee' || String(p.verification_quartier||'').toLowerCase()==='en_attente';
  if(!quartier) return '';
  if(verifie) return `<div><span class="badgeQuartier vert">✅ Vérifié à ${esc(quartier)}</span></div><p style="font-size:11px">Ce prestataire a prouvé qu'il est vraiment de ${esc(quartier)}. Tu peux lui faire confiance, il est proche de toi.</p>`;
  if(enAttente) return `<div><span class="badgeQuartier orange">⏳ Vérification en cours à ${esc(quartier)}</span></div>`;
  return `<div><span class="badgeQuartier gris">📍 ${esc(quartier)} (non vérifié)</span></div>`;
}
async function charger(){
  if(!prestaId) return;
  const {data:{user}} = await sb.auth.getUser();
  moiId = user?.id || '';
  const t = window.rocyT || (k=>k);
  const {data: p} = await sb.from('profiles').select('id, nom, photo_url, photo_profil, photo, description_profil, description, categorie_prestataire, categorie, localite, quartier, verification_quartier, quartier_verifie, ville, pays, statut_validation, statut').eq('id', prestaId).maybeSingle();
  if(!p){ document.getElementById('contenu').innerHTML='Prestataire introuvable. <a href="index.html">Retour Accueil</a>'; return; }
  const statut = String(p.statut_validation || p.statut || '').toLowerCase();
  if(statut && statut!=='valide' && statut!=='valid'){
    document.getElementById('contenu').innerHTML = `<div class="empty"><b>Profil en cours de vérification</b><br>Ce prestataire n'est pas encore validé par Rocyinter.<br><br><button class="btn btn-dark" onclick="location.href='index.html'">Voir d'autres services</button></div>`;
    document.getElementById('annonces').innerHTML = '';
    document.getElementById('avis').innerHTML = '';
    return;
  }
  const photo = p.photo_url || p.photo_profil || p.photo || '';
  const description = p.description_profil || p.description || '';
  const categorie = p.categorie_prestataire || p.categorie || '';
  const initiale = (p.nom||'R').charAt(0).toUpperCase();
  const lieu = [p.localite, p.ville, p.pays].filter(Boolean).join(' - ');
  const {data: annoncesBrutes} = await sb.from('annonces').select('id, titre, categorie, description, prix_fixe, prix_indicatif, prix, localite, ville, status, statut').eq('prestataire_id', prestaId).order('created_at',{ascending:false});
  const annonces = (annoncesBrutes||[]).filter(estValideAnnonce);
  const {data: avis} = await sb.from('avis').select('note, commentaire, created_at').eq('prestataire_id', prestaId).order('created_at',{ascending:false});
  let moyenne = 0; if(avis && avis.length) moyenne = (avis.reduce((a,b)=>a+Number(b.note||0),0)/avis.length).toFixed(1);
  const cestMoi = moiId && String(moiId)===String(prestaId);
  const estVerifieQuartier = p.quartier_verifie === true || String(p.verification_quartier||'').toLowerCase()==='valide';
  const btnVerifier = (cestMoi && !estVerifieQuartier) ? `<button class="btn btn-orange" onclick="location.href='verification.html'">📍 Faire vérifier mon quartier</button>` : '';
  const btnPrincipal = cestMoi
    ? `<button class="btn btn-mine" disabled>C'est ton profil</button>`
    : `<button class="btn" onclick="contacter('${esc(annonces && annonces[0] ? annonces[0].id : '')}')">💬 Discuter avec ${esc(p.nom)}</button>`;
  document.getElementById('contenu').innerHTML = `
    <div class="profil">
      <div class="avatar">${photo ? `<img src="${esc(photo)}" onerror="this.remove()">` : esc(initiale)}</div>
      <h1>${esc(p.nom)}</h1>
      <p>📍 ${esc(lieu)}</p>
      <p>${esc(categorie)}</p>
      <span class="badge">✅ Profil vérifié Rocyinter</span>
      ${badgeQuartierHTML(p)}
      <p style="margin-top:10px;text-align:left">${esc(description)}</p>
      ${btnPrincipal}
      ${btnVerifier}
      <button class="btn btn-dark" onclick="location.href='index.html'">Voir d'autres services</button>
      <div class="info-escrow">🔒 Ne paie jamais en dehors de Rocyinter. Discute ici, paie via Escrow, l'argent est bloqué jusqu'à la fin de la mission.</div>
    </div>
    <div class="stats">
      <div class="stat"><b>${avis?.length||0}</b><small>Avis</small></div>
      <div class="stat"><b>${moyenne||'—'} ⭐</b><small>Note moyenne</small></div>
      <div class="stat"><b>${annonces?.length||0}</b><small>Annonces</small></div>
    </div>`;
  document.getElementById('annonces').innerHTML = `<h3 style="margin:10px 0">📋 Ses services</h3>` + (annonces && annonces.length ? annonces.map(a=>{
    const prixTxt = a.prix_fixe ? Number(a.prix_indicatif||a.prix||0).toLocaleString()+' FCFA' : ((a.prix_indicatif||a.prix||0)>0 ? 'À partir de '+Number(a.prix_indicatif||a.prix||0).toLocaleString()+' FCFA' : 'Prix à discuter');
    const btnAnnonce = cestMoi ? `<button class="btn btn-mine" disabled>C'est ton annonce</button>` : `<button class="btn" onclick="contacter('${esc(a.id)}')">Discuter pour cette annonce</button>`;
    return `<div class="card"><h3>${esc(a.titre)}</h3><p>${esc(a.categorie)} • ${esc([a.localite,a.ville].filter(Boolean).join(' - '))}<br>${esc(prixTxt)}<br>${esc(a.description)}</p>${btnAnnonce}</div>`;
  }).join('') : '<p style="color:#64748b;font-size:13px">Aucune annonce validée pour l’instant.</p>');
  document.getElementById('avis').innerHTML = `<h3 style="margin:14px 0 10px">⭐ Avis clients (${avis?.length||0})</h3>` + (avis && avis.length ? avis.map(a=>`<div class="avis">${'⭐'.repeat(Math.min(5,Number(a.note||5)))}<br>${esc(a.commentaire)}</div>`).join('') : '<p style="color:#64748b;font-size:13px">Aucun avis pour l’instant. Sois le premier à commander.</p>');
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
async function contacter(annonceId){
  const {data:{user}} = await sb.auth.getUser();
  const uid = user?.id;
  const t = window.rocyT || (k=>k);
  if(!uid){ alert(t('connectePourCommander')); location.href='connexion.html'; return; }
  const {data: profil} = await sb.from('profiles').select('type_compte, role').eq('id', uid).maybeSingle();
  const type = String(profil?.type_compte || profil?.role || '').toLowerCase();
  if(type==='admin'){ alert('Admin : tu ne peux pas chatter, tu gères dans Admin.'); return; }
  if(String(prestaId)===String(uid)){ alert("C'est ton profil. Tu ne peux pas te parler à toi-même."); return; }
  localStorage.setItem('chat_prestataire', prestaId);
  if(annonceId) localStorage.setItem('chat_annonce', annonceId);
  location.href='chat.html';
}
charger();
</script>
</body>
</html>
