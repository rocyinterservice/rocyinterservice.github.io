<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notifications - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="rocy-layout.js"></script>
<script src="app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:520px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 12px} h1 span{color:#f59e0b}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer}
.card.non-lu{border:2px solid #0f172a}
.card b{font-size:14px} .card p{font-size:13px;color:#64748b;line-height:1.6;margin-top:4px}
.card.non-lu p{color:#111;font-weight:700}
.card small{font-size:11px;color:#94a3b8}
.btn{width:100%;background:#0f172a;color:#fff;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-sec{width:100%;background:#f1f5f9;border:none;padding:11px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:8px}
</style></head>
<body><div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>🔔 <span>Notifications</span></h1>
<div id="liste">Chargement...</div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = sb;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONES = { message:'💬', paiement:'💰', commande:'🛒', validation:'✅', litige:'⚠️', info:'🔔', avis:'⭐' };
let uid = '';
let notifs = [];
// Pour chaque notif, on retrouve QUI a envoyé
// Le lien contient souvent chat.html?conversation_id=xxx
// On récupère la conversation -> l'autre personne -> son nom
function extraireConvId(lien){
  try{
    if(!lien) return null;
    const m = String(lien).match(/conversation_id=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }catch(e){ return null; }
}
async function charger(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ location.href='connexion.html'; return; }
  uid = user.id;
  const {data, error} = await sb.from('notifications').select('id, user_id, titre, message, type, lien, lu, created_at').eq('user_id', uid).order('created_at',{ascending:false}).limit(50);
  if(error){ document.getElementById('liste').innerHTML = `<div class="card"><p>Erreur : ${esc(error.message)}</p></div>`; return; }
  notifs = data || [];
  if(!notifs.length){
    document.getElementById('liste').innerHTML = `<div class="card"><p><b>👋 Bienvenue sur Rocyinter</b><br>Tu recevras ici : nouveau message, proposition de prix, paiement reçu, validation, litige.</p></div>`;
    return;
  }
  // 1. Pour chaque notif avec conversation, on récupère l'autre personne
  const convIds = [...new Set(notifs.map(n=>extraireConvId(n.lien)).filter(Boolean))];
  let nomsParConv = {};
  if(convIds.length){
    const {data: convs} = await sb.from('conversations').select('id, client_id, prestataire_id').in('id', convIds);
    const autreIds = [];
    (convs||[]).forEach(cv=>{
      const autre = String(cv.client_id)===String(uid) ? cv.prestataire_id : cv.client_id;
      if(autre) autreIds.push(autre);
      nomsParConv[cv.id] = autre;
    });
    if(autreIds.length){
      const {data: profs} = await sb.from('profiles').select('id, nom, nom_entreprise').in('id', [...new Set(autreIds)]);
      const noms = {};
      (profs||[]).forEach(p=> noms[p.id] = p.nom_entreprise || p.nom || 'Utilisateur');
      Object.keys(nomsParConv).forEach(convId=>{
        nomsParConv[convId] = noms[nomsParConv[convId]] || 'Utilisateur';
      });
    }
  }
  document.getElementById('liste').innerHTML = notifs.map((n,i)=>{
    const date = new Date(n.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const convId = extraireConvId(n.lien);
    const nomExpediteur = convId && nomsParConv[convId] ? nomsParConv[convId] : (n.type==='info' || n.type==='litige' ? 'Rocyinter' : '');
    const isNonLu = !n.lu;
    // Pour chacun : Nom + Titre + Message + Heure, en gras si nouveau, pas besoin d'écrire "Non lu"
    return `<div class="card ${isNonLu?'non-lu':''}" onclick="ouvrirNotif(${i})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b style="${isNonLu ? 'font-weight:900;' : ''}">${ICONES[n.type]||'🔔'} ${nomExpediteur ? esc(nomExpediteur) + ' • ' : ''}${esc(n.titre)}</b>
        <span style="font-size:11px;color:#94a3b8;white-space:nowrap;margin-left:8px">${esc(date)}</span>
      </div>
      <p>${esc(n.message)}</p>
      ${isNonLu ? `<span style="display:inline-block;margin-top:6px;background:#f59e0b;color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px">● Nouveau</span>` : ''}
    </div>`;
  }).join('') + `<button class="btn-sec" onclick="toutLire()">Tout marquer comme lu</button>`;
}
async function ouvrirNotif(i){
  const n = notifs[i]; if(!n) return;
  await sb.from('notifications').update({lu:true}).eq('id', n.id).eq('user_id', uid);
  if(n.lien && n.lien !== '' && n.lien !== 'null') location.href = n.lien;
  else charger();
}
async function toutLire(){
  if(!uid) return;
  await sb.from('notifications').update({lu:true}).eq('user_id', uid).eq('lu', false);
  charger();
}
async function initTempsReel(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user) return;
  sb.channel('notifs-' + user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},()=>charger()).subscribe();
}
initTempsReel();
charger();
</script></body></html>
