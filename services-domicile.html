<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domicile - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:560px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:13px;margin-bottom:12px}
.filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.filtres button{white-space:nowrap;background:#fff;border:1px solid #e2e8f0;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.filtres button.active{background:#0f172a;color:#fff}
input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:10px 0}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.btn{width:100%;background:#f59e0b;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>🏠 Services à <span>Domicile</span></h1>
<p class="sub">Vrais plombiers, électriciens, ménage, peinture... validés par Rocyinter.</p>

<div class="filtres" id="filtres">
  <button class="active" onclick="setCat('')">Tous</button>
  <button onclick="setCat('Ménage / Repassage')">Ménage</button>
  <button onclick="setCat('Plomberie')">Plomberie</button>
  <button onclick="setCat('Électricité')">Électricité</button>
  <button onclick="setCat('Climatisation')">Clim</button>
  <button onclick="setCat('Menuiserie')">Menuiserie</button>
  <button onclick="setCat('Peinture')">Peinture</button>
  <button onclick="setCat('Jardinage')">Jardinage</button>
</div>

<input id="search" placeholder="🔍 Chercher : Calavi, Godomey, Plombier..." oninput="charger()">
<div id="liste">Chargement...</div>
</div>

<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let catActuelle = '';

function setCat(c){
  catActuelle = c;
  const btns = document.querySelectorAll('.filtres button');
  btns.forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  charger();
}

async function charger(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let query = supabase.from('annonces').select('*, profiles(nom, whatsapp)').eq('univers','domicile').eq('status','valide').order('created_at',{ascending:false});
  if(catActuelle) query = query.eq('categorie', catActuelle);
  const {data} = await query;
  const box = document.getElementById('liste');
  let list = data||[];
  if(q) list = list.filter(a=>(a.titre+' '+a.ville+' '+a.localite+' '+a.categorie+' '+(a.profiles?.nom||'')).toLowerCase().includes(q));
  if(!list.length){
    box.innerHTML=`<p style="text-align:center;color:#64748b;padding:20px">Aucun service domicile validé pour l'instant.<br><button class="btn" onclick="location.href='creer-annonce.html'">Devenir prestataire domicile</button></p>`;
    return;
  }
  box.innerHTML = list.map(a=>`<div class="card"><h3>${a.titre}</h3><p>👤 ${a.profiles?.nom} • ${a.categorie}<br>📍 ${a.localite} - ${a.ville} • ${a.pays}<br>${a.prix_fixe ? Number(a.prix_indicatif).toLocaleString()+' FCFA - Prix fixe' : '💬 Prix à discuter'}<br>${a.description ? a.description.substring(0,120)+'...' : ''}</p><button class="btn" onclick="voirPresta('${a.prestataire_id}')">Voir le prestataire</button><button class="btn btn-dark" onclick="discuter('${a.prestataire_id}','${a.id}')">💬 Discuter</button></div>`).join('');
}

function voirPresta(id){ localStorage.setItem('fiche_prestataire_id', id); location.href='fiche-prestataire.html'; }
function discuter(prestaId, annonceId){
  const uid = localStorage.getItem('rocy_user_id');
  if(!uid){ location.href='connexion.html'; return; }
  localStorage.setItem('chat_prestataire', prestaId);
  localStorage.setItem('chat_annonce', annonceId);
  location.href='chat.html';
}
charger();
</script>
</body>
</html>
