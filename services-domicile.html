*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}

.back{color:#64748b;font-size:13px;cursor:pointer}

.filters label{font-size:12px;font-weight:700;color:#475569}

.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}

.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.badge{display:inline-block;background:#dbeafe;color:#1e40af;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.price{font-weight:800;margin-top:6px;color:#111}
.btn{width:100%;background:#f59e0b;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.btn-gris{background:#f1f5f9;color:#111}
.bandeau-role{padding:12px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;line-height:1.5;margin-bottom:12px}

.bandeau-presta{background:#dbeafe;color:#1e40af}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:24px;text-align:center;color:#64748b}

<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
let supabaseClient = null;
try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){}
let catActuelle = '';
let toutesAnnonces = [];

function afficherBandeauRole(){
  const box = document.getElementById('bandeauRole');
  if(!box) return;
  const uid = localStorage.getItem('rocy_user_id');
  const type = localStorage.getItem('rocy_user_type') || localStorage.getItem('rocy_role') || '';
  const t = window.rocyT || (k=>k);
  if(!uid) box.innerHTML = `<div class="bandeau-role bandeau-visiteur">👁️ ${t('bandeauVisiteur')}</div>`;
  else if(type==='prestataire' || type==='livreur') box.innerHTML = `<div class="bandeau-role bandeau-presta">🛠️ ${t('bandeauPresta')}</div>`;
  else if(type==='admin') box.innerHTML = `<div class="bandeau-role bandeau-presta">🛡️ ${t('bandeauAdmin')}</div>`;
  else box.innerHTML = `<div class="bandeau-role bandeau-client">🛒 ${t('bandeauClient')}</div>`;
}

function setCat(c){
  catActuelle = c;
  document.querySelectorAll('#filtres button').forEach(b=> b.classList.toggle('active', b.dataset.cat === c));
  afficher();
}

function construireFiltres(){
  const cats = [...new Set(toutesAnnonces.map(a=>a.categorie).filter(Boolean))].sort();
  const box = document.getElementById('filtres');
  const t = window.rocyT || (k=>k);
  box.innerHTML = `<button class="active" data-cat="" onclick="setCat('')">${t('tous')}</button>` + cats.map(c=>`<button data-cat="${c}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('');
  document.querySelectorAll('#filtres button').forEach(b=> b.classList.toggle('active', b.dataset.cat === catActuelle));
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}

function prixTexte(a){
  const prixVal = a.prix_indicatif || a.prix || a.montant || 0;
  const t = window.rocyT || (k=>k);
  if(a.prix_fixe) return (window.rocyFormatPrix ? window.rocyFormatPrix(prixVal) : prixVal+' FCFA') + ' - ' + t('prixFixe');
  if(prixVal>0) return t('aPartir') + ' ' + (window.rocyFormatPrix ? window.rocyFormatPrix(prixVal) : prixVal+' FCFA');
  return t('prixDiscuter');
}

function afficher(){
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const pays = document.getElementById('filtrePays') ? document.getElementById('filtrePays').value : '';
  const loc = (document.getElementById('filtreLocalite').value || '').trim().toLowerCase();
  const box = document.getElementById('liste');
  const t = window.rocyT || (k=>k);
  let list = toutesAnnonces;
  list = list.filter(a => (a.univers||'domicile') === 'domicile');
  if(pays) list = list.filter(a => (a.pays||'') === pays);
  if(loc) list = list.filter(a => (a.localite||'').toLowerCase().includes(loc) || (a.ville||'').toLowerCase().includes(loc));
  if(catActuelle) list = list.filter(a=> a.categorie === catActuelle);
  if(q) list = list.filter(a=>(a.titre+' '+a.ville+' '+a.localite+' '+a.categorie+' '+(a.profiles?.nom||'')+' '+(a.description||'')).toLowerCase().includes(q));
  if(!list.length){
    box.innerHTML = `<div class="empty"><b>${t('aucuneTitre')}</b><br>${t('aucuneSous')}<br><br><button class="btn" onclick="rocyProposerService()">${t('proposerTitre')}</button></div>`;
    return;
  }
  box.innerHTML = list.map(a=>{
    const img = a.photo_url || a.image_url || a.photo || 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=800&q=80';
    const nom = a.prestataire_nom || a.nom_prestataire || a.profiles?.nom || a.nom || 'Prestataire';
    const lieu = [a.localite, a.ville, a.pays].filter(Boolean).join(' - ');
    const prestaId = a.prestataire_id || a.user_id || a.profiles_id || '';
    return `<div class="card">
      <img src="${img}" onclick="voirPresta('${prestaId}')" style="cursor:pointer" onerror="this.src='https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=800&q=80'">
      <span class="badge">${a.categorie||''}</span>
      <h3 style="margin-top:8px">${a.titre||''}</h3>
      <p>👤 ${nom}<br>📍 ${lieu}</p>
      <p>${(a.description||'').slice(0,110)}...</p>
      <div class="price">${prixTexte(a)}</div>
      <button class="btn btn-gris" onclick="voirPresta('${prestaId}')">${t('voirPresta')}</button>
      <button class="btn btn-dark" onclick="discuter('${prestaId}','${a.id}')">💬 ${t('discuter')}</button>
    </div>`;
  }).join('');
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}

async function charger(){
  const box = document.getElementById('liste');
  const t = window.rocyT || (k=>k);
  if(!supabaseClient){ box.innerHTML = `<div class="empty"><b>${t('pasConnexion')}</b><br><button class="btn" onclick="charger()">${t('reessayer')}</button></div>`; return; }
  try{
    const {data, error} = await supabaseClient.from('annonces').select('*, profiles(nom, whatsapp)').eq('univers','domicile').eq('status','valide').order('created_at',{ascending:false});
    if(error) throw error;
    toutesAnnonces = data || [];
    construireFiltres();
    afficher();
  }catch(e){
    console.log('ROCY domicile erreur:', e);
    box.innerHTML = `<div class="empty"><b>${t('erreurConnexion')}</b><br><button class="btn" onclick="charger()">${t('reessayer')}</button></div>`;
  }
}
function voirPresta(id){ localStorage.setItem('fiche_prestataire_id', id); location.href='fiche-prestataire.html'; }
function discuter(prestaId, annonceId){
  const t = window.rocyT || (k=>k);
  if(!localStorage.getItem('rocy_user_id')){ alert(t('connectePourCommander')); location.href='connexion.html'; return; }
  localStorage.setItem('chat_prestataire', prestaId);
  localStorage.setItem('chat_annonce', annonceId);
  location.href='chat.html';
}
afficherBandeauRole();
charger();
</script>
