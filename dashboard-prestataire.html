<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="dashboardPrestaTitre">Mon Dashboard - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.top{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:16px 0 4px}
p.sub{color:#64748b;font-size:13px;margin-bottom:14px}
.badge-type{display:inline-block;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;margin:6px 0}
.badge-type.pro{background:#e0e7ff;color:#3730a3}
.badge-type.entreprise{background:#fef3c7;color:#92400e}
.badge-type.livreur{background:#dcfce7;color:#166534}
.banner{padding:12px;border-radius:12px;font-size:13px;margin-bottom:14px;line-height:1.5}
.banner.attente{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.banner.valide{background:#dcfce7;color:#166534}
.banner.rejete{background:#fee2e2;color:#991b1b}
.bandeau-abo{padding:12px;border-radius:12px;font-size:13px;line-height:1.6;font-weight:600;text-align:center;margin-bottom:12px}
.abo-ok{background:#dcfce7;color:#166534} .abo-offert{background:#dbeafe;color:#1e40af} .abo-expire{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.stat b{font-size:18px;display:block}
.stat small{color:#64748b;font-size:11px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px}
.card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.badge.attente{background:#fef3c7;color:#92400e}
.badge.valide{background:#dcfce7;color:#166534}
.badge.rejete{background:#fee2e2;color:#991b1b}
.badge.paye{background:#dbeafe;color:#1e40af}
.badge.cours{background:#e0e7ff;color:#3730a3}
.badge.litige{background:#fee2e2;color:#991b1b}
.btn{width:100%;background:#f59e0b;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.section h2{font-size:17px;margin:18px 0 10px}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:20px;text-align:center;color:#64748b;font-size:13px}
.profilBox{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;gap:12px;align-items:center}
.profilBox img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#f1f5f9}
.profilBox .info{flex:1}
.profilBox .info b{font-size:15px}
.profilBox .info span{font-size:12px;color:#64748b;display:block;margin-top:2px}
</style>
</head>
<body>
<div class="top">
<h1><span data-i18n="bonjour">Bonjour</span> <span id="nomUser">Prestataire</span> 👋</h1>
<div id="badgeType"></div>
<p class="sub" id="infoUser">Chargement...</p>
<div class="profilBox" id="profilBox">
  <img id="photoProfil" src="" alt="" onerror="this.style.display='none'">
  <div class="info">
    <b id="profilNom">Mon Profil</b>
    <span id="profilQuartier">📍 Quartier : ...</span>
    <span id="profilBadge">⏳ Vérification...</span>
  </div>
</div>
<button class="btn btn-dark" onclick="location.href='profil.html'">👤 Mon Profil</button>
<button class="btn btn-green" id="btnVerif" onclick="location.href='verification.html'" style="display:none">📍 Faire vérifier mon quartier → Obtenir le badge ✅</button>
<button class="btn" style="background:#eff6ff;color:#1e40af" id="btnVerifAttente" onclick="location.href='verification.html'" style="display:none">⏳ Vérification en attente - Voir le statut</button>
<div id="bannerStatut"></div>
<div id="bandeauAbo"></div>
<div class="stats">
  <div class="stat"><b id="nbAnnonces">0</b><small data-i18n="annonces">Annonces</small></div>
  <div class="stat"><b id="nbCommandes">0</b><small data-i18n="commandes">Commandes</small></div>
  <div class="stat"><b id="totalGagne">0 F</b><small data-i18n="aRecevoir">À recevoir*</small></div>
</div>
<p style="font-size:11px;color:#64748b;margin:-10px 0 14px" data-i18n="totalAide">* Seulement les commandes payées / en cours / validées. Les commandes en attente ne comptent pas.</p>
<button class="btn" id="btnCreer" onclick="location.href='creer-annonce.html'">➕ <span data-i18n="creerAnnonce">Créer une nouvelle annonce</span></button>
<button class="btn btn-dark" onclick="location.href='abonnement.html'">💳 <span data-i18n="voirAbonnement">Voir / Renouveler mon abonnement</span></button>
<div class="section"><h2>📋 <span data-i18n="mesAnnonces">Mes annonces</span></h2><div id="listeAnnonces"></div></div>
<div class="section"><h2>💰 <span data-i18n="mesCommandes">Mes commandes</span></h2><div id="listeCommandes"></div></div>
<div class="section"><h2>💬 <span data-i18n="mesConversations">Mes conversations</span></h2><div id="listeConvs"></div></div>
<button class="btn btn-dark" style="margin-top:16px" onclick="deconnecter()" data-i18n="deconnexion">Déconnexion</button>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const sb = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = sb;
let uid = null;
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n || 0).toLocaleString('fr-FR'); }
async function getUtilisateurSecurise(){
  for(let i=0;i<5;i++){
    const {data:{user}, error} = await sb.auth.getUser();
    if(user) return user;
    await new Promise(r=>setTimeout(r,300));
  }
  const {data:{user}} = await sb.auth.getUser();
  return user || null;
}
async function deconnecter(){
  await sb.auth.signOut();
  const langue = localStorage.getItem('rocy_langue');
  localStorage.clear();
  if(langue) localStorage.setItem('rocy_langue', langue);
  location.href='index.html';
}
function verifierAbonnement(p){
  const auj=new Date(); const fin=p.abonnement_fin?new Date(p.abonnement_fin):null;
  const actif=p.abonnement_actif===true||p.abonnement_statut==='actif';
  const offert=p.abonnement_offert===true||p.premier_mois_offert===true;
  if(fin&&fin>=auj) return {ok:true,type:'paye',fin};
  if(!fin&&(actif||offert)) return {ok:true,type:'offert',fin:null};
  if(actif&&!fin) return {ok:true,type:'offert',fin:null};
  return {ok:false,type:'expire',fin:null};
}
function badgeCommande(s){
  if(s==='en_attente') return '<span class="badge attente">⏳ En attente</span>';
  if(s==='paye') return '<span class="badge paye">💳 Payé - Bloqué</span>';
  if(s==='en_cours') return '<span class="badge cours">🔧 En cours</span>';
  if(s==='valide') return '<span class="badge valide">✅ Validé</span>';
  if(s==='libere') return '<span class="badge valide">💰 Libéré</span>';
  if(s==='litige') return '<span class="badge litige">⚠️ Litige</span>';
  return `<span class="badge attente">${esc(s)}</span>`;
}
function texteCommission(c){
  if(c.univers==='domicile') return `Commission 8% : ${fmt(c.commission)} FCFA`;
  if(c.univers==='pro') return `Commission 5 000 FCFA fixe`;
  if(c.univers==='manger' || c.univers==='sejour') return `Commission 12% : ${fmt(c.commission)} FCFA`;
  if(c.univers==='livreur') return `Commission 20% (Livreur 80%) : ${fmt(c.commission)} FCFA`;
  if(c.univers==='immobilier'){
    const t = String(c.titre||'').toLowerCase();
    if(t.includes('parcelle') || t.includes('vente') || t.includes('terrain')) return `Commission Parcelle 10 000 + 2% plafonné 200 000 : ${fmt(c.commission)} FCFA`;
    return `Commission Location 50% d'un mois : ${fmt(c.commission)} FCFA`;
  }
  return `Commission : ${fmt(c.commission)} FCFA`;
}
function badgeAnnonce(a){
  const s = String(a.status || '').toLowerCase();
  if(s==='valide') return '<span class="badge valide">✅ Validée - Visible</span>';
  if(s==='rejete' || s==='refuse') return '<span class="badge rejete">❌ Rejetée</span>';
  return '<span class="badge attente">⏳ En attente</span>';
}
function nomAffiche(profil){ return profil.nom_entreprise || profil.nom || 'Prestataire'; }
function badgeTypeFournisseur(profil){
  const type = String(profil.type_compte || profil.type_fournisseur || '').toLowerCase();
  const nomEnt = profil.nom_entreprise;
  if(nomEnt || type === 'entreprise') return '<span class="badge-type entreprise">🏢 Entreprise</span>';
  if(type === 'livreur') return '<span class="badge-type livreur">🛵 Livreur</span>';
  return '<span class="badge-type pro">👨‍🔧 Professionnel</span>';
}
async function charger(){
  const user = await getUtilisateurSecurise();
  if(!user){ location.href='connexion.html'; return; }
  uid = user.id;
  const {data: profil, error: errProfil} = await sb.from('profiles')
    .select('id, nom, nom_entreprise, type_compte, type_fournisseur, quartier, ville, pays, quartier_verifie, verification_quartier, photo_profil_url, statut_validation, abonnement_actif, abonnement_statut, abonnement_fin, abonnement_offert, premier_mois_offert')
    .eq('id', uid).maybeSingle();
  if(errProfil){
    document.getElementById('infoUser').textContent = 'Erreur chargement profil : ' + errProfil.message;
    document.getElementById('bannerStatut').innerHTML = '<div class="banner attente">⚠️ Erreur : '+esc(errProfil.message)+'</div>';
    return;
  }
  if(!profil){
    document.getElementById('infoUser').textContent = 'Aucun profil trouvé pour ce compte. Va dans ton profil pour le compléter, ou contacte le support.';
    document.getElementById('bannerStatut').innerHTML = '<div class="banner attente">⚠️ Ton compte existe mais ton profil est introuvable dans la table profiles. ID : '+uid+'</div>';
    return;
  }
  let roleReel = String(profil.type_compte || profil.type_fournisseur || '').toLowerCase().trim();
  if(!roleReel && profil.nom_entreprise) roleReel = 'entreprise';
  const ROLES_FOURNISSEUR = ['prestataire','livreur','fournisseur','professionnel','entreprise','pro'];
  if(roleReel === 'client'){ location.href='dashboard-client.html'; return; }
  if(roleReel === 'admin'){ location.href='admin.html'; return; }
  if(!ROLES_FOURNISSEUR.includes(roleReel)){
    document.getElementById('infoUser').textContent = 'Rôle inconnu : ' + (roleReel || 'vide') + ' - Contacte le support.';
    document.getElementById('bannerStatut').innerHTML = '<div class="banner attente">⚠️ Ton rôle est "'+esc(roleReel || 'vide')+'". Il doit être prestataire, entreprise ou livreur pour voir ce dashboard.</div>';
    return;
  }
  document.getElementById('nomUser').textContent = nomAffiche(profil);
  document.getElementById('badgeType').innerHTML = badgeTypeFournisseur(profil);
  if(profil.nom_entreprise && profil.nom){
    document.getElementById('infoUser').textContent = `Contact : ${profil.nom} • ${profil.quartier || ''} - ${profil.ville || ''} • ${profil.pays || ''}`;
  } else {
    document.getElementById('infoUser').textContent = `${profil.quartier || ''} - ${profil.ville || ''} • ${profil.pays || ''}`;
  }
  const quartier = profil.quartier || '';
  const photo = profil.photo_profil_url || '';
  document.getElementById('profilNom').textContent = nomAffiche(profil);
  document.getElementById('profilQuartier').textContent = '📍 Quartier : ' + (quartier || 'Non rempli');
  const badgeEl = document.getElementById('profilBadge');
  const btnVerif = document.getElementById('btnVerif');
  const btnAttente = document.getElementById('btnVerifAttente');
  const stQ = profil.verification_quartier || 'non_envoye';
  if(profil.quartier_verifie === true || stQ === 'valide' || stQ === 'verifie'){
    badgeEl.textContent = '✅ Vérifié à ' + quartier;
    badgeEl.style.color = '#166534';
    btnVerif.style.display='none'; btnAttente.style.display='none';
  } else if(stQ === 'en_attente' || stQ === 'demande_envoyee'){
    badgeEl.textContent = '⏳ Vérification en attente pour ' + quartier;
    badgeEl.style.color = '#1e40af';
    btnVerif.style.display='none'; btnAttente.style.display='block';
  } else if(stQ === 'refuse' || stQ === 'rejete'){
    badgeEl.textContent = '❌ Vérification refusée - Renvoie tes photos';
    badgeEl.style.color = '#991b1b';
    btnVerif.style.display='block'; btnAttente.style.display='none';
  } else {
    badgeEl.textContent = '❌ Non vérifié - Les clients te feront moins confiance';
    badgeEl.style.color = '#991b1b';
    btnVerif.style.display='block'; btnAttente.style.display='none';
  }
  if(photo){ const img=document.getElementById('photoProfil'); img.src=photo; img.style.display='block'; }
  const statut = String(profil?.statut_validation || 'en_attente').toLowerCase();
  const banner = document.getElementById('bannerStatut');
  const t = window.rocyT || (k=>k);
  if(statut==='valide'){
    banner.innerHTML = `<div class="banner valide">✅ <b>${esc(t('compteValide'))}</b> - ${esc(t('compteValideSous'))}</div>`;
  } else if(statut==='rejete' || statut==='refuse'){
    banner.innerHTML = `<div class="banner rejete">❌ <b>${esc(t('compteRefuse'))}</b> - ${esc(t('compteRefuseSous'))}</div>`;
  } else {
    banner.innerHTML = `<div class="banner attente">⏳ <b>${esc(t('compteAttente'))}</b> - ${esc(t('compteAttenteSous'))}</div>`;
  }
  const resAbo = verifierAbonnement(profil||{});
  const boxAbo = document.getElementById('bandeauAbo');
  const btnCreer = document.getElementById('btnCreer');
  if(resAbo.ok && resAbo.type==='offert'){
    boxAbo.innerHTML = `<div class="bandeau-abo abo-offert">🎁 1er mois offert - Tu peux publier. Commissions dues dès la 1ère mission.</div>`;
    btnCreer.disabled=false;
  } else if(resAbo.ok){
    boxAbo.innerHTML = `<div class="bandeau-abo abo-ok">✅ Abonnement à jour jusqu'au ${esc(resAbo.fin.toLocaleDateString('fr-FR'))} - Tu peux publier.</div>`;
    btnCreer.disabled=false;
  } else {
    boxAbo.innerHTML = `<div class="bandeau-abo abo-expire">⛔ Abonnement expiré. Tu ne peux pas publier de nouvelle annonce tant que tu ne renouvelles pas.<br><button class="btn btn-dark" onclick="location.href='abonnement.html'">Renouveler maintenant →</button></div>`;
    btnCreer.disabled=true; btnCreer.textContent='⛔ Publier bloqué - Abonnement expiré';
  }
  const {data: annonces} = await sb.from('annonces')
    .select('id, titre, categorie, univers, quartier, localite, ville, prix_indicatif, prix_fixe, photo_url, status, created_at')
    .eq('prestataire_id', uid).order('created_at',{ascending:false});
  const boxA = document.getElementById('listeAnnonces');
  document.getElementById('nbAnnonces').textContent = annonces?.length || 0;
  if(!annonces || annonces.length===0){
    boxA.innerHTML = `<div class="empty">Aucune annonce. Crée ta première annonce pour commencer à gagner.</div>`;
  } else {
    boxA.innerHTML = annonces.map(a=>{
      const lieu = a.quartier || a.localite || '';
      const prixTxt = a.prix_fixe ? fmt(a.prix_indicatif||0)+' FCFA - Prix fixe' : 'Prix à discuter';
      return `<div class="card">${badgeAnnonce(a)}<h3 style="margin-top:8px">${esc(a.titre)}</h3><p>${esc(a.categorie)} • ${esc(lieu)} - ${esc(a.ville)}<br>${prixTxt}</p><button class="btn btn-dark" onclick="location.href='creer-annonce.html'">✏️ Modifier / Voir</button></div>`;
    }).join('');
  }
  const {data: cmds} = await sb.from('commandes')
    .select('id, titre, client_id, conversation_id, annonce_id, status, univers, commission, montant_total, montant_prestataire, localite, ville, litige_raison, created_at')
    .eq('prestataire_id', uid).order('created_at',{ascending:false});
  const boxC = document.getElementById('listeCommandes');
  document.getElementById('nbCommandes').textContent = cmds?.length || 0;
  let total = 0;
  (cmds||[]).forEach(c=>{ if(['paye','en_cours','valide','libere'].includes(c.status)) total += Number(c.montant_prestataire||0); });
  document.getElementById('totalGagne').textContent = fmt(total) + ' F';
  if(!cmds || cmds.length===0){
    boxC.innerHTML = `<div class="empty">Aucune commande pour l'instant. Quand un client te parlera dans le chat et créera une commande, elle apparaîtra ici.</div>`;
  } else {
    const clientIds = [...new Set(cmds.map(c=>c.client_id).filter(Boolean))];
    let nomsClients = {};
    if(clientIds.length){
      const {data: profs} = await sb.from('profiles').select('id,nom').in('id', clientIds);
      (profs||[]).forEach(p=> nomsClients[p.id]=p.nom);
    }
    boxC.innerHTML = cmds.map(c=>{
      let action = '';
      if(c.status==='paye') action = `<button class="btn btn-green" onclick="changerStatut('${esc(c.id)}','en_cours')">🔧 Commencer le service</button>`;
      if(c.status==='en_cours') action = `<button class="btn btn-green" onclick="changerStatut('${esc(c.id)}','en_cours_termine')">✅ Marquer comme terminé (client valide)</button><p style="color:#64748b">Le client doit valider pour libérer l'argent.</p>`;
      if(c.status==='litige') action = `<p style="color:#991b1b">⚠️ Litige : ${esc(c.litige_raison || 'En cours')} - Argent bloqué, Admin tranche.</p>`;
      if(c.status==='valide') action = `<p style="color:#166534">⏳ Validé par le client - Libération dans 48h / lundi.</p>`;
      if(c.status==='libere') action = `<p style="color:#166534">💰 Argent libéré - Vérifie ton Mobile Money / compte.</p>`;
      return `<div class="card">${badgeCommande(c.status)}<h3 style="margin-top:8px">${esc(c.titre)}</h3><p>Client : ${esc(nomsClients[c.client_id] || 'Client')}<br>Total : ${fmt(c.montant_total)} FCFA • ${esc(texteCommission(c))} • Tu reçois : <b>${fmt(c.montant_prestataire)} FCFA</b><br>📍 ${esc(c.localite||'')} - ${esc(c.ville||'')}<br><span style="color:#16a34a">🔒 Escrow : argent bloqué chez Rocyinter jusqu'à validation client</span></p>${action}<button class="btn btn-dark" onclick="voirConversation('${esc(c.conversation_id)}','${esc(c.annonce_id)}')">Ouvrir le chat</button></div>`;
    }).join('');
  }
  const {data: convsBrutes} = await sb.from('conversations')
    .select('id, client_id, prestataire_id, annonce_id, created_at, annonces(titre)')
    .eq('prestataire_id', uid).order('created_at',{ascending:false});
  const convs = (convsBrutes||[]).filter(cv => String(cv.client_id)!==String(cv.prestataire_id));
  const boxV = document.getElementById('listeConvs');
  if(!convs || convs.length===0){
    boxV.innerHTML = `<div class="empty">Aucune conversation pour l'instant.</div>`;
  } else {
    boxV.innerHTML = convs.map(cv=>`<div class="card"><b>${esc(cv.annonces?.titre || 'Discussion')}</b><p>Conversation • ${esc(new Date(cv.created_at).toLocaleDateString('fr-FR'))}</p><button class="btn btn-green" onclick="voirConversation('${esc(cv.id)}','${esc(cv.annonce_id)}')">Répondre</button></div>`).join('');
  }
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
async function changerStatut(id, action){
  const user = await getUtilisateurSecurise();
  if(!user) return;
  if(action==='en_cours'){
    const {error} = await sb.from('commandes').update({status:'en_cours'}).eq('id', id).eq('prestataire_id', user.id).eq('status','paye');
    if(error) alert('Erreur : ' + error.message);
  } else if(action==='en_cours_termine'){
    const {data: cmd} = await sb.from('commandes').select('id, titre, conversation_id').eq('id', id).eq('prestataire_id', user.id).single();
    if(!cmd){ alert('Commande introuvable.'); return; }
    if(cmd?.conversation_id){
      await sb.from('messages').insert([{conversation_id: cmd.conversation_id, sender_id: user.id, contenu: `✅ J'ai terminé le service "${cmd.titre}". Peux-tu valider pour que l'argent soit libéré ?`, type: 'texte'}]);
    }
    alert('✅ Client prévenu dans le chat. Il doit valider pour libérer l’argent.');
  }
  charger();
}
async function voirConversation(convId, annonceId){
  if(!convId || convId==='null' || convId==='undefined'){ alert('Conversation introuvable.'); return; }
  const user = await getUtilisateurSecurise();
  if(!user) return;
  const {data} = await sb.from('conversations').select('id, client_id, prestataire_id').eq('id', convId).eq('prestataire_id', user.id).single();
  if(!data){ alert('Conversation introuvable.'); return; }
  if(String(data.client_id)===String(data.prestataire_id)){ alert('Conversation invalide.'); return; }
  location.href = 'chat.html?conversation=' + encodeURIComponent(convId) + '&annonce=' + encodeURIComponent(annonceId || '');
}
charger();
</script>
</body>
</html>
