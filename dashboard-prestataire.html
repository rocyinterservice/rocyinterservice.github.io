<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="dashboardPrestaTitre">Mon Dashboard - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.top{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:16px 0 4px}
p.sub{color:#64748b;font-size:13px;margin-bottom:14px}
.banner{padding:12px;border-radius:12px;font-size:13px;margin-bottom:14px;line-height:1.5}
.banner.attente{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.banner.valide{background:#dcfce7;color:#166534}
.banner.rejete{background:#fee2e2;color:#991b1b}
.bandeau-abo{padding:12px;border-radius:12px;font-size:13px;line-height:1.6;font-weight:600;text-align:center;margin-bottom:12px}
.abo-ok{background:#dcfce7;color:#166534} .abo-offert{background:#dbeafe;color:#1e40af} .abo-expire{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.stat b{font-size:18px;display:block}
.stat small{color:#64748b;font-size:11px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px}
.card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.badge.attente{background:#fef3c7;color:#92400e}
.badge.valide{background:#dcfce7;color:#166534}
.badge.rejete{background:#fee2e2;color:#991b1b}
.badge.paye{background:#dbeafe;color:#1e40af}
.badge.cours{background:#e0e7ff;color:#3730a3}
.badge.litige{background:#fee2e2;color:#991b1b}
.btn{width:100%;background:#f59e0b;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.section h2{font-size:17px;margin:18px 0 10px}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:20px;text-align:center;color:#64748b;font-size:13px}
</style>
</head>
<body>
<div class="top">
<h1><span data-i18n="bonjour">Bonjour</span> <span id="nomUser">Prestataire</span> 👋</h1>
<p class="sub" id="infoUser">Chargement...</p>
<div id="bannerStatut"></div>
<div id="bandeauAbo"></div>
<div class="stats">
  <div class="stat"><b id="nbAnnonces">0</b><small data-i18n="annonces">Annonces</small></div>
  <div class="stat"><b id="nbCommandes">0</b><small data-i18n="commandes">Commandes</small></div>
  <div class="stat"><b id="totalGagne">0 F</b><small data-i18n="aRecevoir">À recevoir*</small></div>
</div>
<p style="font-size:11px;color:#64748b;margin:-10px 0 14px" data-i18n="totalAide">* Seulement les commandes payées / en cours / validées. Les commandes en attente ne comptent pas.</p>
<button class="btn" id="btnCreer" onclick="location.href='creer-annonce.html'">➕ <span data-i18n="creerAnnonce">Créer une nouvelle annonce</span></button>
<button class="btn btn-dark" onclick="location.href='abonnement.html'">💳 <span data-i18n="voirAbonnement">Voir / Renouveler mon abonnement</span></button>
<button class="btn" style="background:#f1f5f9;color:#111" onclick="location.href='mes-activites.html'">🛠️ <span data-i18n="mesActivites">Mes Activités</span></button>
<div class="section"><h2>📋 <span data-i18n="mesAnnonces">Mes annonces</span></h2><div id="listeAnnonces"></div></div>
<div class="section"><h2>💰 <span data-i18n="mesCommandes">Mes commandes</span></h2><div id="listeCommandes"></div></div>
<div class="section"><h2>💬 <span data-i18n="mesConversations">Mes conversations</span></h2><div id="listeConvs"></div></div>
<button class="btn btn-dark" style="margin-top:16px" onclick="deconnecter()" data-i18n="deconnexion">Déconnexion</button>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const uid = localStorage.getItem('rocy_user_id');
const roleUser = localStorage.getItem('rocy_user_type') || localStorage.getItem('rocy_role') || '';
const nom = localStorage.getItem('rocy_user_nom') || 'Prestataire';
if(!uid){ location.href='connexion.html'; }
if(roleUser==='client'){ location.href='dashboard-client.html'; }
if(roleUser==='admin'){ location.href='admin.html'; }
document.getElementById('nomUser').textContent = nom;
document.getElementById('infoUser').textContent = `${localStorage.getItem('rocy_user_localite') || ''} - ${localStorage.getItem('rocy_user_ville') || ''} • ${localStorage.getItem('rocy_user_pays') || ''}`;
function deconnecter(){
  const langue = localStorage.getItem('rocy_langue');
  localStorage.clear();
  if(langue) localStorage.setItem('rocy_langue', langue);
  location.href='index.html';
}
function verifierAbonnement(p){
  const auj=new Date(); const fin=p.abonnement_fin?new Date(p.abonnement_fin):null;
  const actif=p.abonnement_actif===true||p.abonnement_statut==='actif';
  const offert=p.abonnement_offert===true||p.premier_mois_offert===true;
  if(fin&&fin>=auj) return {ok:true,type:'paye',fin};
  if(!fin&&(actif||offert)) return {ok:true,type:'offert',fin:null};
  if(actif&&!fin) return {ok:true,type:'offert',fin:null};
  return {ok:false,type:'expire',fin:null};
}
function badgeCommande(s){
  if(s==='en_attente') return '<span class="badge attente">⏳ En attente</span>';
  if(s==='paye') return '<span class="badge paye">💳 Payé - Bloqué</span>';
  if(s==='en_cours') return '<span class="badge cours">🔧 En cours</span>';
  if(s==='valide') return '<span class="badge valide">✅ Validé</span>';
  if(s==='libere') return '<span class="badge valide">💰 Libéré</span>';
  if(s==='litige') return '<span class="badge litige">⚠️ Litige</span>';
  return `<span class="badge attente">${s}</span>`;
}
function texteCommission(c){
  if(c.univers==='domicile') return `Commission 8% : ${Number(c.commission).toLocaleString()} FCFA`;
  if(c.univers==='pro') return `Commission 5 000 FCFA fixe`;
  if(c.univers==='manger' || c.univers==='sejour') return `Commission 12% : ${Number(c.commission).toLocaleString()} FCFA`;
  if(c.univers==='livreur') return `Commission 20% (Livreur 80%) : ${Number(c.commission).toLocaleString()} FCFA`;
  if(c.univers==='immobilier'){
    const t = String(c.titre||'').toLowerCase();
    if(t.includes('parcelle') || t.includes('vente') || t.includes('terrain')) return `Commission Parcelle 10 000 + 2% plafonné 200 000 : ${Number(c.commission).toLocaleString()} FCFA`;
    return `Commission Location 50% d'un mois : ${Number(c.commission).toLocaleString()} FCFA`;
  }
  return `Commission : ${Number(c.commission||0).toLocaleString()} FCFA`;
}
function badgeAnnonce(a){
  const s = String(a.status || a.statut || '').toLowerCase();
  if(s==='valide' || s==='valid' || s==='publie' || s==='publié' || s==='actif') return '<span class="badge valide">✅ Validée - Visible</span>';
  if(s==='rejete' || s==='refuse' || s==='refusé' || s==='rejeté') return '<span class="badge rejete">❌ Rejetée</span>';
  return '<span class="badge attente">⏳ En attente</span>';
}
async function charger(){
  const {data: profil} = await supabase.from('profiles').select('*').eq('id', uid).maybeSingle();
  const statut = String(profil?.statut_validation || profil?.status_prestataire || profil?.statut || 'en_attente').toLowerCase();
  const banner = document.getElementById('bannerStatut');
  const t = window.rocyT || (k=>k);
  if(statut==='valide' || statut==='valid'){
    banner.innerHTML = `<div class="banner valide">✅ <b>${t('compteValide')}</b> - ${t('compteValideSous')}</div>`;
  } else if(statut==='rejete' || statut==='refuse' || statut==='refusé'){
    banner.innerHTML = `<div class="banner rejete">❌ <b>${t('compteRefuse')}</b> - ${t('compteRefuseSous')}</div>`;
  } else {
    banner.innerHTML = `<div class="banner attente">⏳ <b>${t('compteAttente')}</b> - ${t('compteAttenteSous')}</div>`;
  }
  const resAbo = verifierAbonnement(profil||{});
  const boxAbo = document.getElementById('bandeauAbo');
  const btnCreer = document.getElementById('btnCreer');
  if(resAbo.ok && resAbo.type==='offert'){
    boxAbo.innerHTML = `<div class="bandeau-abo abo-offert">🎁 1er mois offert - Tu peux publier. Commissions dues dès la 1ère mission.</div>`;
    btnCreer.disabled=false;
  } else if(resAbo.ok){
    boxAbo.innerHTML = `<div class="bandeau-abo abo-ok">✅ Abonnement à jour jusqu'au ${resAbo.fin.toLocaleDateString('fr-FR')} - Tu peux publier.</div>`;
    btnCreer.disabled=false;
  } else {
    boxAbo.innerHTML = `<div class="bandeau-abo abo-expire">⛔ Abonnement expiré. Tu ne peux pas publier de nouvelle annonce tant que tu ne renouvelles pas.<br><button class="btn btn-dark" onclick="location.href='abonnement.html'">Renouveler maintenant →</button></div>`;
    btnCreer.disabled=true; btnCreer.textContent='⛔ Publier bloqué - Abonnement expiré';
  }
  const {data: annonces} = await supabase.from('annonces').select('*').eq('prestataire_id', uid).order('created_at',{ascending:false});
  const boxA = document.getElementById('listeAnnonces');
  document.getElementById('nbAnnonces').textContent = annonces?.length || 0;
  if(!annonces || annonces.length===0){
    boxA.innerHTML = `<div class="empty">Aucune annonce. Crée ta première annonce pour commencer à gagner.</div>`;
  } else {
    boxA.innerHTML = annonces.map(a=>{
      return `<div class="card">${badgeAnnonce(a)}<h3 style="margin-top:8px">${a.titre}</h3><p>${a.categorie} • ${a.localite} - ${a.ville}<br>${a.prix_fixe ? Number(a.prix_indicatif||a.prix||0).toLocaleString()+' FCFA - Prix fixe' : 'Prix à discuter'}</p><button class="btn btn-dark" onclick="location.href='creer-annonce.html'">✏️ Modifier / Voir</button></div>`;
    }).join('');
  }
  const {data: cmds} = await supabase.from('commandes').select('*').eq('prestataire_id', uid).order('created_at',{ascending:false});
  const boxC = document.getElementById('listeCommandes');
  document.getElementById('nbCommandes').textContent = cmds?.length || 0;
  let total = 0;
  (cmds||[]).forEach(c=>{ if(['paye','en_cours','valide','libere'].includes(c.status)) total += Number(c.montant_prestataire||0); });
  document.getElementById('totalGagne').textContent = total.toLocaleString() + ' F';
  if(!cmds || cmds.length===0){
    boxC.innerHTML = `<div class="empty">Aucune commande pour l'instant. Quand un client te parlera dans le chat et créera une commande, elle apparaîtra ici.</div>`;
  } else {
    const clientIds = [...new Set(cmds.map(c=>c.client_id).filter(Boolean))];
    let nomsClients = {};
    if(clientIds.length){
      const {data: profs} = await supabase.from('profiles').select('id,nom').in('id', clientIds);
      (profs||[]).forEach(p=> nomsClients[p.id]=p.nom);
    }
    boxC.innerHTML = cmds.map(c=>{
      let action = '';
      if(c.status==='paye') action = `<button class="btn btn-green" onclick="changerStatut('${c.id}','en_cours')">🔧 Commencer le service</button>`;
      if(c.status==='en_cours') action = `<button class="btn btn-green" onclick="changerStatut('${c.id}','en_cours_termine')">✅ Marquer comme terminé (client valide)</button><p style="color:#64748b">Le client doit valider pour libérer l'argent.</p>`;
      if(c.status==='litige') action = `<p style="color:#991b1b">⚠️ Litige : ${c.litige_raison || 'En cours'} - Argent bloqué, Admin tranche.</p>`;
      if(c.status==='valide') action = `<p style="color:#166534">⏳ Validé par le client - Libération dans 48h / lundi.</p>`;
      if(c.status==='libere') action = `<p style="color:#166534">💰 Argent libéré - Vérifie ton Mobile Money / compte.</p>`;
      return `<div class="card">${badgeCommande(c.status)}<h3 style="margin-top:8px">${c.titre}</h3><p>Client : ${nomsClients[c.client_id] || 'Client'}<br>Total : ${Number(c.montant_total).toLocaleString()} FCFA • ${texteCommission(c)} • Tu reçois : <b>${Number(c.montant_prestataire).toLocaleString()} FCFA</b><br>📍 ${c.localite||''} - ${c.ville||''}<br><span style="color:#16a34a">🔒 Escrow : argent bloqué chez Rocyinter jusqu'à validation client</span></p>${action}<button class="btn btn-dark" onclick="voirConversation('${c.conversation_id}','${c.annonce_id}')">Ouvrir le chat</button></div>`;
    }).join('');
  }
  const {data: convsBrutes} = await supabase.from('conversations').select('*, annonces(titre)').eq('prestataire_id', uid).order('created_at',{ascending:false});
  const convs = (convsBrutes||[]).filter(cv => String(cv.client_id)!==String(cv.prestataire_id));
  const boxV = document.getElementById('listeConvs');
  if(!convs || convs.length===0){
    boxV.innerHTML = `<div class="empty">Aucune conversation pour l'instant.</div>`;
  } else {
    boxV.innerHTML = convs.map(cv=>`<div class="card"><b>${cv.annonces?.titre || 'Discussion'}</b><p>Conversation • ${new Date(cv.created_at).toLocaleDateString('fr-FR')}</p><button class="btn btn-green" onclick="voirConversation('${cv.id}','${cv.annonce_id}')">Répondre</button></div>`).join('');
  }
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
async function changerStatut(id, action){
  if(action==='en_cours'){
    // CORRIGÉ : seul le vrai prestataire, seulement si paye
    const {error} = await supabase.from('commandes').update({status:'en_cours'}).eq('id', id).eq('prestataire_id', uid).eq('status','paye');
    if(error) alert('Erreur : ' + error.message);
  } else if(action==='en_cours_termine'){
    const {data: cmd} = await supabase.from('commandes').select('*').eq('id', id).eq('prestataire_id', uid).single();
    if(!cmd){ alert('Commande introuvable.'); return; }
    if(cmd?.conversation_id){
      await supabase.from('messages').insert([{conversation_id: cmd.conversation_id, sender_id: uid, contenu: `✅ J'ai terminé le service "${cmd.titre}". Peux-tu valider pour que l'argent soit libéré ?`, type: 'texte'}]);
    }
    alert('✅ Client prévenu dans le chat. Il doit valider pour libérer l’argent.');
  }
  charger();
}
async function voirConversation(convId, annonceId){
  if(!convId || convId==='null' || convId==='undefined'){ alert('Conversation introuvable.'); return; }
  const {data} = await supabase.from('conversations').select('*').eq('id', convId).eq('prestataire_id', uid).single();
  if(!data){ alert('Conversation introuvable.'); return; }
  if(String(data.client_id)===String(data.prestataire_id)){ alert('Conversation invalide.'); return; }
  localStorage.setItem('chat_prestataire', uid);
  localStorage.setItem('chat_annonce', annonceId);
  location.href='chat.html';
}
charger();
</script>
</body>
</html>
