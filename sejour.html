<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="sejourTitre">Séjour - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.top{max-width:560px;margin:0 auto;padding:16px}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:13px;margin-bottom:12px;line-height:1.5}
.filters{background:#fff;padding:14px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);display:grid;gap:10px;margin-bottom:12px}
.filters label{font-size:12px;font-weight:700;color:#475569}
.filters select,.filters input{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff}
.filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.filtres button{white-space:nowrap;background:#fff;border:1px solid #e2e8f0;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.filtres button.active{background:#0f172a;color:#fff}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card img{width:100%;height:170px;object-fit:cover;background:#e2e8f0}
.card-body{padding:14px}
.card-body h3{font-size:15px} .card-body p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.btn{width:100%;background:#f59e0b;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.btn-gris{background:#f1f5f9;color:#111}
.btn-mine{background:#e2e8f0;color:#64748b;cursor:not-allowed}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#dcfce7;color:#166534}
.badge-cat{display:inline-block;background:#dbeafe;color:#1e40af;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.price{font-weight:800;margin-top:6px;color:#111}
.bandeau-role{padding:12px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;line-height:1.5;margin-bottom:12px}
.bandeau-visiteur{background:#fef3c7;color:#92400e}
.bandeau-client{background:#dcfce7;color:#166534}
.bandeau-presta{background:#dbeafe;color:#1e40af}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:24px;text-align:center;color:#64748b}
.link-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:14px;margin-bottom:12px;font-size:13px;line-height:1.5;color:#92400e}
.info-commission{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;color:#92400e;margin-bottom:12px}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="location.href='index.html'">← <span data-i18n="accueil">Accueil</span></div>
<h1>✈️ <span data-i18n="sejourTitre">Séjour</span></h1>
<p class="sub" data-i18n="sejourSous">Hôtels, locations courtes, guides, transports... validés par Rocyinter.</p>
<div class="info-commission">💰 Commission Séjour : 12% par nuit réservée. Ne paie jamais en dehors de Rocyinter.</div>
<div id="bandeauRole"></div>
<div class="link-box">🏠 <span data-i18n="sejourVersImmo">Pour une location longue, voir :</span> <a href="immobilier.html" style="font-weight:800;color:#92400e" data-i18n="immobilierTitre">Immobilier</a></div>
<div class="filters">
  <div><label data-i18n="pays">PAYS</label><select id="filtrePays" onchange="charger()"><option value="">🌍 Tous les pays</option></select></div>
  <div><label data-i18n="ville">VILLE / LOCALITÉ</label><input id="filtreLocalite" placeholder="Ex: Cotonou, Ouidah, Grand-Popo..." oninput="afficher()"></div>
  <div><label data-i18n="rechercher">RECHERCHER UN SÉJOUR</label><input id="search" placeholder="Ex: Hôtel, Guide, Transport..." oninput="afficher()"></div>
</div>
<div class="filtres" id="filtres"><button class="active" data-cat="" onclick="setCat('')" data-i18n="tous">Tous</button></div>
<div id="liste"><span data-i18n="chargement">Chargement...</span></div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
let sb = null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); window.supabaseClient = sb; }catch(e){}
let catActuelle = ''; let toutesAnnonces = []; let moiId=''; let monRole='';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function remplirPays(){ const sel=document.getElementById('filtrePays'); if(window.ROCY_PAYS&&window.ROCY_PAYS.length){ sel.innerHTML='<option value="">🌍 Tous les pays</option>'+window.ROCY_PAYS.map(p=>`<option value="${esc(p.nom)}">${esc(p.drapeau)} ${esc(p.nom)}</option>`).join(''); } }
async function afficherBandeauRole(){
  const box = document.getElementById('bandeauRole'); if(!box) return;
  const {data:{user}} = await sb.auth.getUser(); moiId = user?.id || '';
  if(user){ const {data:p}=await sb.from('profiles').select('type_compte, role').eq('id',user.id).maybeSingle(); monRole=String(p?.type_compte||p?.role||'').toLowerCase(); }
  const t = window.rocyT || (k=>k);
  if(!moiId) box.innerHTML = `<div class="bandeau-role bandeau-visiteur">👁️ ${esc(t('bandeauVisiteur'))}</div>`;
  else if(monRole==='prestataire' || monRole==='livreur') box.innerHTML = `<div class="bandeau-role bandeau-presta">🛠️ ${esc(t('bandeauPresta'))}</div>`;
  else if(monRole==='admin') box.innerHTML = `<div class="bandeau-role bandeau-presta">🛡️ ${esc(t('bandeauAdmin'))}</div>`;
  else box.innerHTML = `<div class="bandeau-role bandeau-client">🛒 ${esc(t('bandeauClient'))}</div>`;
}
function setCat(c){ catActuelle = c; document.querySelectorAll('#filtres button').forEach(b=> b.classList.toggle('active', b.dataset.cat === c)); afficher(); }
function construireFiltres(){
  const cats = [...new Set(toutesAnnonces.map(a=>a.categorie).filter(Boolean))].sort();
  const box = document.getElementById('filtres'); const t = window.rocyT || (k=>k);
  box.innerHTML = `<button class="active" data-cat="" onclick="setCat('')">${esc(t('tous'))}</button>` + cats.map(c=>`<button data-cat="${esc(c)}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join('');
  document.querySelectorAll('#filtres button').forEach(b=> b.classList.toggle('active', b.dataset.cat === catActuelle));
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
function prixTexte(a){
  const prixVal = a.prix_indicatif || a.prix || a.montant || 0; const t = window.rocyT || (k=>k);
  if(a.prix_fixe) return (window.rocyFormatPrix ? window.rocyFormatPrix(prixVal) : prixVal+' FCFA') + ' - ' + t('prixFixe');
  if(prixVal>0) return t('aPartir') + ' ' + (window.rocyFormatPrix ? window.rocyFormatPrix(prixVal) : prixVal+' FCFA');
  return t('prixDiscuter');
}
function estValide(a){
  const s = String(a.status || a.statut || '').toLowerCase().trim();
  if(!s) return true;
  return s==='valide' || s==='valid' || s==='publie' || s==='publié' || s==='publiee' || s==='actif' || s==='active';
}
function afficher(){
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const pays = document.getElementById('filtrePays') ? document.getElementById('filtrePays').value : '';
  const loc = (document.getElementById('filtreLocalite').value || '').trim().toLowerCase();
  const box = document.getElementById('liste'); const t = window.rocyT || (k=>k);
  let list = toutesAnnonces.filter(a => (a.univers||'sejour') === 'sejour' && estValide(a));
  if(pays) list = list.filter(a => (a.pays||'') === pays);
  if(loc) list = list.filter(a => (a.localite||'').toLowerCase().includes(loc) || (a.ville||'').toLowerCase().includes(loc));
  if(catActuelle) list = list.filter(a=> a.categorie === catActuelle);
  if(q) list = list.filter(a=>((a.titre||'')+' '+(a.ville||'')+' '+(a.localite||'')+' '+(a.categorie||'')+' '+(a.profiles?.nom||'')+' '+(a.description||'')).toLowerCase().includes(q));
  if(!list.length){ box.innerHTML = `<div class="empty"><b>${esc(t('aucuneTitre'))}</b><br>${esc(t('aucuneSous'))}<br><br><button class="btn" onclick="rocyProposerService()">${esc(t('proposerTitre'))}</button></div>`; return; }
  box.innerHTML = list.map(a=>{
    const img = a.photo_url || a.image_url || a.photo || 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800&q=80';
    const nom = a.profiles?.nom || 'Prestataire';
    const lieu = [a.localite, a.ville, a.pays].filter(Boolean).join(' - ');
    const prestaId = a.prestataire_id || a.user_id || '';
    const cestMoi = prestaId && moiId && String(prestaId)===String(moiId);
    const btnChat = cestMoi ? `<button class="btn btn-mine" disabled>C'est ton annonce</button>` : `<button class="btn btn-dark" onclick="discuter('${esc(prestaId)}','${esc(a.id)}')">💬 ${esc(t('discuter'))}</button>`;
    return `<div class="card"><img src="${esc(img)}" onclick="voirPresta('${esc(prestaId)}')" style="cursor:pointer" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800&q=80'"><div class="card-body"><span class="badge">✅ ${esc(t('verifie'))}</span> <span class="badge-cat">${esc(a.categorie)}</span><h3 style="margin-top:8px">${esc(a.titre)}</h3><p>👤 ${esc(nom)}<br>📍 ${esc(lieu)}</p><p>${esc((a.description||'').slice(0,120))}...</p><div class="price">${esc(prixTexte(a))}</div><button class="btn btn-gris" onclick="voirPresta('${esc(prestaId)}')">${esc(t('voirPresta'))}</button>${btnChat}</div></div>`;
  }).join('');
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
async function charger(){
  const box = document.getElementById('liste'); const t = window.rocyT || (k=>k);
  if(!sb){ box.innerHTML = `<div class="empty"><b>${esc(t('pasConnexion'))}</b><br><button class="btn" onclick="charger()">${esc(t('reessayer'))}</button></div>`; return; }
  try{
    const {data, error} = await sb.from('annonces').select('id, titre, categorie, univers, description, prix_fixe, prix_indicatif, prix, montant, photo_url, image_url, photo, localite, ville, pays, status, statut, prestataire_id, user_id, profiles(nom)').eq('univers','sejour').order('created_at',{ascending:false});
    if(error) throw error;
    toutesAnnonces = (data || []).filter(estValide); construireFiltres(); afficher();
  }catch(e){ console.log('ROCY sejour erreur:', e); box.innerHTML = `<div class="empty"><b>${esc(t('erreurConnexion'))}</b><br><button class="btn" onclick="charger()">${esc(t('reessayer'))}</button></div>`; }
}
function voirPresta(id){ if(!id) return; localStorage.setItem('fiche_prestataire_id', id); location.href='fiche-prestataire.html'; }
async function discuter(prestaId, annonceId){
  const {data:{user}} = await sb.auth.getUser(); const uid = user?.id; const t = window.rocyT || (k=>k);
  if(!uid){ alert(t('connectePourCommander')); location.href='connexion.html'; return; }
  if(monRole==='admin'){ alert('Admin : tu ne peux pas chatter, tu gères dans Admin.'); return; }
  if(!prestaId){ alert('Annonce sans prestataire.'); return; }
  if(String(prestaId)===String(uid)){ alert("C'est ton annonce. Tu ne peux pas te parler à toi-même."); return; }
  localStorage.setItem('chat_prestataire', prestaId); localStorage.setItem('chat_annonce', annonceId); location.href='chat.html';
}
remplirPays();
afficherBandeauRole();
charger();
if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
</script>
</body>
</html>
