<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Séjour - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:560px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:13px;margin-bottom:12px}
.filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.filtres button{white-space:nowrap;background:#fff;border:1px solid #e2e8f0;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.filtres button.active{background:#0f172a;color:#fff}
input,select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;background:#fff}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card img{width:100%;height:170px;object-fit:cover;background:#e2e8f0}
.card-body{padding:14px}
.card-body h3{font-size:15px} .card-body p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.btn{width:100%;background:#f59e0b;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#dcfce7;color:#166534}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>✈️ <span>Séjour</span></h1>
<p class="sub">Vrais hôtels, locations, guides, transports... validés par Rocyinter.</p>

<div class="filtres">
  <button class="active" onclick="setCat('')">Tous</button>
  <button onclick="setCat('Hôtel / Hébergement')">Hôtel</button>
  <button onclick="setCat('Location appartement')">Location</button>
  <button onclick="setCat('Guide touristique')">Guide</button>
  <button onclick="setCat('Transport / Chauffeur')">Transport</button>
  <button onclick="setCat('Location voiture')">Voiture</button>
</div>

<select id="filtrePays" onchange="charger()">
  <option value="">Tous les pays</option>
  <option value="Bénin">🇧🇯 Bénin</option>
  <option value="Togo">🇹🇬 Togo</option>
  <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
  <option value="Sénégal">🇸🇳 Sénégal</option>
  <option value="Cameroun">🇨🇲 Cameroun</option>
  <option value="Nigeria">🇳🇬 Nigeria</option>
  <option value="Ghana">🇬🇭 Ghana</option>
  <option value="France">🇫🇷 France</option>
  <option value="Canada">🇨🇦 Canada</option>
</select>

<input id="search" placeholder="🔍 Chercher : Cotonou, Ouidah, Hôtel..." oninput="charger()">
<div id="liste">Chargement...</div>
</div>

<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let catActuelle = '';

function setCat(c){
  catActuelle = c;
  document.querySelectorAll('.filtres button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  charger();
}

async function charger(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const pays = document.getElementById('filtrePays').value;
  let query = supabase.from('annonces').select('*, profiles(nom, whatsapp)').eq('univers','sejour').eq('status','valide').order('created_at',{ascending:false});
  if(catActuelle) query = query.eq('categorie', catActuelle);
  if(pays) query = query.eq('pays', pays);
  const {data} = await query;
  const box = document.getElementById('liste');
  let list = data||[];
  if(q) list = list.filter(a=>(a.titre+' '+a.ville+' '+a.localite+' '+a.categorie+' '+(a.profiles?.nom||'')).toLowerCase().includes(q));
  if(!list.length){
    box.innerHTML=`<p style="text-align:center;color:#64748b;padding:20px;background:#fff;border-radius:16px">Aucun séjour validé pour l'instant.<br><br><button class="btn" onclick="location.href='creer-annonce.html'">Proposer un hébergement / séjour</button></p>`;
    return;
  }
  box.innerHTML = list.map(a=>{
    const img = a.photo_url || 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800&q=80';
    return `<div class="card"><img src="${img}"><div class="card-body"><span class="badge">✅ Vérifié</span> <span style="font-size:11px;color:#94a3b8">${a.categorie}</span><h3 style="margin-top:8px">${a.titre}</h3><p>👤 ${a.profiles?.nom}<br>📍 ${a.localite} - ${a.ville} • ${a.pays}<br>${a.prix_fixe ? '<b>'+Number(a.prix_indicatif).toLocaleString()+' FCFA</b> - Prix fixe' : (a.prix_indicatif>0 ? 'À partir de '+Number(a.prix_indicatif).toLocaleString()+' FCFA' : '💬 Prix à discuter')}<br>${a.description ? a.description.substring(0,120)+'...' : ''}</p><button class="btn" onclick="voirPresta('${a.prestataire_id}')">Voir le prestataire</button><button class="btn btn-dark" onclick="discuter('${a.prestataire_id}','${a.id}')">💬 Discuter</button></div></div>`;
  }).join('');
}

function voirPresta(id){ localStorage.setItem('fiche_prestataire_id', id); location.href='fiche-prestataire.html'; }
function discuter(prestaId, annonceId){
  const uid = localStorage.getItem('rocy_user_id');
  if(!uid){ location.href='connexion.html'; return; }
  localStorage.setItem('chat_prestataire', prestaId);
  localStorage.setItem('chat_annonce', annonceId);
  location.href='chat.html';
}
charger();
</script>
</body>
</html>
