<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Connexion - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.top{max-width:480px;margin:0 auto;padding:16px}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:24px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:14px;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06);display:grid;gap:14px}
label{font-size:12px;font-weight:700;color:#475569;display:block;margin-bottom:4px}
input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px}
.btn{background:#f59e0b;color:#000;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;width:100%}
.btn:disabled{opacity:.6}
.msg{text-align:center;font-size:13px;padding:10px;border-radius:10px;display:none}
.msg.ok{display:block;background:#dcfce7;color:#166534}
.msg.err{display:block;background:#fee2e2;color:#991b1b}
small{color:#94a3b8;font-size:12px;text-align:center;display:block;margin-top:10px}
.pwdWrap{position:relative}
.pwdWrap input{padding-right:46px}
.eyeBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;cursor:pointer;font-size:19px}
</style></head>
<body><div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>Bon retour <span>chez Rocyinter</span></h1>
<p class="sub">Connecte-toi avec ton Email + Mot de passe.</p>
<div class="card">
<div><label>VOTRE EMAIL *</label><input id="emailInput" type="email" placeholder="Ex: jean@gmail.com"></div>
<div><label>VOTRE MOT DE PASSE *</label><div class="pwdWrap"><input id="password" type="password" placeholder="Votre mot de passe"><button type="button" class="eyeBtn" onclick="togglePwd('password', this)">👁️</button></div></div>
<div style="text-align:right;font-size:13px"><a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a></div>
<div id="msg" class="msg"></div>
<button class="btn" id="btnCo" type="button" onclick="connecter()">Se connecter →</button>
<small>Pas de compte ? <a href="inscription.html">Créez-en un ici</a></small>
</div></div>
<script>
const ADMIN_EMAIL='rocyinter@gmail.com';
const supabase=window.supabase.createClient("https://gdwgjsloivrpxxvggxyz.supabase.co","sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF");
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.style.display='block';}
function togglePwd(id,btn){const i=document.getElementById(id);const s=i.type==='password';i.type=s?'text':'password';btn.textContent=s?'🙈':'👁️';}
async function connecter(){
  const email=document.getElementById('emailInput').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('btnCo');
  if(!email||!email.includes('@')||!password){showMsg('Remplis Email + Mot de passe',false);return;}
  btn.disabled=true;btn.textContent='Vérification...';
  try{
    // SÉCURITÉ : Supabase vérifie le mot de passe haché, jamais nous
    const {data,error}=await supabase.auth.signInWithPassword({email,password});
    if(error||!data.user){showMsg('Email ou mot de passe incorrect.',false);btn.disabled=false;btn.textContent='Se connecter →';return;}
    const uid=data.user.id;
    // Profil via RLS : on ne peut lire que son propre profil, ou Admin
    const {data:prof,error:perr}=await supabase.from('profiles').select('id,nom,full_name,email,type,type_compte,role,pays,ville,localite').eq('id',uid).single();
    if(perr||!prof){showMsg('Profil introuvable. Réinscris-toi.',false);btn.disabled=false;btn.textContent='Se connecter →';return;}
    let typeFinal=prof.type||prof.type_compte||prof.role||'client';
    if(String(prof.email||'').toLowerCase()===ADMIN_EMAIL) typeFinal='admin';
    // On ne stocke que l'affichage, la preuve c'est le token Supabase
    localStorage.setItem('rocy_user_id',uid);localStorage.setItem('rocy_user_nom',prof.nom||prof.full_name||'');localStorage.setItem('rocy_user_email',String(prof.email||email).toLowerCase());localStorage.setItem('rocy_user_type',typeFinal);localStorage.setItem('rocy_role',typeFinal);localStorage.setItem('rocy_user_pays',prof.pays||'Bénin');localStorage.setItem('rocy_user_ville',prof.ville||'');localStorage.setItem('rocy_user_localite',prof.localite||'');
    showMsg('✅ Bienvenue ! Redirection...',true);
    setTimeout(()=>{if(typeFinal==='admin')location.href='admin.html';else if(typeFinal==='prestataire'||typeFinal==='livreur')location.href='dashboard-prestataire.html';else location.href='dashboard-client.html';},800);
  }catch(e){showMsg('Erreur : '+e.message,false);btn.disabled=false;btn.textContent='Se connecter →';}
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')connecter();});
if(window.rocyAppliquerTraduction)window.rocyAppliquerTraduction();
</script></body></html>
