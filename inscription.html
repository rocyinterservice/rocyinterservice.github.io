<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inscription - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.top{max-width:480px;margin:0 auto;padding:16px}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:24px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:14px;margin-bottom:16px;line-height:1.5}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);display:grid;gap:12px}
label{font-size:12px;font-weight:700;color:#475569;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff}
input.err{border-color:#ef4444;background:#fef2f2}
textarea{min-height:70px;resize:vertical}
.choix{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.choix button{padding:14px 6px;border:2px solid #e2e8f0;background:#fff;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px}
.choix button.active{border-color:#f59e0b;background:#fffbeb}
#blocPrestataire{display:none;gap:12px}
#blocPrestataire.show{display:grid}
.btn{background:#f59e0b;color:#000;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;width:100%}
.btn:disabled{opacity:.6}
.msg{text-align:center;font-size:13px;padding:8px;border-radius:10px;display:none}
.msg.ok{display:block;background:#dcfce7;color:#166534}
.msg.err{display:block;background:#fee2e2;color:#991b1b}
small{color:#94a3b8;font-size:12px;text-align:center;display:block;margin-top:10px}
.errTxt{color:#ef4444;font-size:12px;display:none}
.errTxt.show{display:block}
.telRow{display:grid;grid-template-columns:130px 1fr;gap:8px}
.photoBox{border:2px dashed #e2e8f0;border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.photoBox img{width:90px;height:90px;object-fit:cover;border-radius:50%;display:none;margin:0 auto 8px}
.photoBox.hasImg img{display:block}
.pwdWrap{position:relative}
.pwdWrap input{padding-right:46px}
.eyeBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;cursor:pointer;font-size:19px;line-height:1;border-radius:8px}
</style></head>
<body><div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>Créez votre compte <span>Rocyinter</span></h1>
<p class="sub">Client, Fournisseur ou Livreur ? En 1 minute, sans faux profil.</p>
<div class="card">
<div><label>VOUS ÊTES ?</label><div class="choix">
<button type="button" id="btnClient" class="active" onclick="setType('client')">🙋‍♂️ Client</button>
<button type="button" id="btnPresta" onclick="setType('prestataire')">💼 Fournisseur</button>
<button type="button" id="btnLivreur" onclick="setType('livreur')">🛵 Livreur</button>
</div></div>
<div><label>NOM COMPLET *</label><input id="nom" placeholder="Ex: Jean Kouassi"></div>
<div><label>WHATSAPP *</label>
<div class="telRow">
<select id="indicatif" onchange="majIndicatif()"><option value="+229" selected>🇧🇯 +229 Bénin</option><option value="+228">🇹🇬 +228 Togo</option><option value="+225">🇨🇮 +225 Côte d'Ivoire</option><option value="+221">🇸🇳 +221 Sénégal</option><option value="+223">🇲🇱 +223 Mali</option><option value="+227">🇳🇪 +227 Niger</option><option value="+226">🇧🇫 +226 Burkina Faso</option><option value="+237">🇨🇲 +237 Cameroun</option><option value="+233">🇬🇭 +233 Ghana</option><option value="+234">🇳🇬 +234 Nigeria</option><option value="+33">🇫🇷 +33 France</option><option value="+1">🇺🇸 +1 USA</option><option value="+44">🇬🇧 +44 Royaume-Uni</option><option value="+32">🇧🇪 +32 Belgique</option></select>
<input id="whatsappNum" placeholder="01 97 00 00 00" inputmode="numeric" oninput="verifTel(this)">
</div>
<div id="errTel" class="errTxt"></div>
<p id="telAide" style="font-size:11px;color:#64748b;margin-top:4px">Bénin : 10 chiffres, commence par 01.</p>
</div>
<div><label>MOT DE PASSE *</label><div class="pwdWrap"><input id="password" type="password" placeholder="Min 6 caractères" oninput="verifMdp()"><button type="button" class="eyeBtn" onclick="togglePwd('password', this)">👁️</button></div></div>
<div><label>CONFIRME TON MOT DE PASSE *</label><div class="pwdWrap"><input id="password2" type="password" placeholder="Retape le même" oninput="verifMdp()"><button type="button" class="eyeBtn" onclick="togglePwd('password2', this)">👁️</button></div><div id="errMdp" class="errTxt">❌ Les 2 mots de passe ne sont pas identiques</div></div>
<div><label>EMAIL *</label><input id="email" type="email" placeholder="Ex: jean@gmail.com"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div><label>PAYS *</label><select id="pays" onchange="syncPaysVersIndicatif()"><option value="Bénin" selected>🇧🇯 Bénin</option><option value="Togo">🇹🇬 Togo</option><option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option><option value="Sénégal">🇸🇳 Sénégal</option><option value="France">🇫🇷 France</option><option value="Cameroun">🇨🇲 Cameroun</option></select></div>
<div><label>VILLE *</label><input id="ville" placeholder="Ex: Abomey-Calavi"></div>
</div>
<div><label>LOCALITÉ / QUARTIER *</label><input id="localite" placeholder="Ex: Godomey"></div>
<div id="blocPrestataire">
<div><label>CATÉGORIE DE SERVICE *</label><select id="categorie" onchange="checkAutreInscription()">
<option value="">Choisir...</option>
<optgroup label="🍽️ Se nourrir"><option value="Traiteur">Traiteur</option><option value="Restaurant">Restaurant / Maquis</option><option value="Livraison repas">Livraison repas</option><option value="Pâtisserie">Pâtisserie</option></optgroup>
<optgroup label="🏠 Domicile"><option value="Nettoyage / Ménage">Nettoyage / Ménage</option><option value="Plomberie">Plomberie</option><option value="Électricité">Électricité</option><option value="Climatisation">Climatisation</option><option value="Menuiserie">Menuiserie</option><option value="Peinture">Peinture</option><option value="Jardinage">Jardinage</option><option value="Mécanique">Mécanique</option><option value="Déménagement">Déménagement</option></optgroup>
<optgroup label="💼 Pro"><option value="Design">Design / Graphisme</option><option value="Développement">Développement Web</option><option value="Marketing">Marketing</option><option value="Comptabilité">Comptabilité</option><option value="Traduction">Traduction</option><option value="Cours">Cours / Coaching</option></optgroup>
<optgroup label="✈️ Séjour"><option value="Hôtel">Hôtel / Appartement</option><option value="Location voiture">Location voiture</option><option value="Guide touristique">Guide touristique</option><option value="Transport">Transport / Moto</option></optgroup>
<optgroup label="🏘️ Immobilier"><option value="Location maison / Appartement">Location maison / Appartement</option><option value="Vente maison / Terrain">Vente maison / Terrain</option><option value="Location chambre / Studio">Location chambre / Studio</option></optgroup>
<optgroup label="➕ Autre"><option value="__AUTRE__">➕ Autre - Écrire ma catégorie...</option></optgroup>
</select></div>
<div id="blocAutreInscription" style="display:none"><label>ÉCRIS TA CATÉGORIE *</label><input id="autreCategorie" placeholder="Ex: Nettoyage, Désinfection..."></div>
<div><label>DÉCRIVEZ VOTRE SERVICE *</label><textarea id="description" placeholder="Ex: Je suis plombier à Calavi depuis 5 ans..."></textarea></div>
</div>
<div id="msg" class="msg"></div>
<button class="btn" id="btnInscrire" type="button" onclick="inscrire()">Créer mon compte →</button>
<small>Déjà inscrit ? <a href="connexion.html">Connectez-vous</a></small>
</div></div>
<script>
const ADMIN_EMAIL='rocyinter@gmail.com';
let typeCompte='client'; let photoBase64='';
const supabase = window.supabase.createClient("https://gdwgjsloivrpxxvggxyz.supabase.co","sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF");
function setType(t){typeCompte=t;document.getElementById('btnClient').classList.toggle('active',t==='client');document.getElementById('btnPresta').classList.toggle('active',t==='prestataire');document.getElementById('btnLivreur').classList.toggle('active',t==='livreur');document.getElementById('blocPrestataire').classList.toggle('show',t==='prestataire');}
function checkAutreInscription(){document.getElementById('blocAutreInscription').style.display=document.getElementById('categorie').value==='__AUTRE__'?'block':'none';}
function showMsg(txt,ok){const m=document.getElementById('msg');m.textContent=txt;m.className='msg '+(ok?'ok':'err');m.style.display='block';}
function togglePwd(id,btn){const i=document.getElementById(id);const s=i.type==='password';i.type=s?'text':'password';btn.textContent=s?'🙈':'👁️';}
function universPourCategorie(cat){const manger=['Traiteur','Restaurant','Restaurant / Maquis','Livraison repas','Pâtisserie'];const domicile=['Nettoyage / Ménage','Plomberie','Électricité','Climatisation','Menuiserie','Peinture','Jardinage','Mécanique','Déménagement'];const pro=['Design','Design / Graphisme','Développement','Développement Web','Marketing','Comptabilité','Traduction','Cours','Cours / Coaching'];const sejour=['Hôtel','Hôtel / Appartement','Location voiture','Guide touristique','Transport','Transport / Moto'];const immo=['Location maison / Appartement','Vente maison / Terrain','Location chambre / Studio'];if(manger.includes(cat))return'manger';if(domicile.includes(cat))return'domicile';if(pro.includes(cat))return'pro';if(sejour.includes(cat))return'sejour';if(immo.includes(cat))return'immobilier';return'domicile';}
// Longueur par pays, Bénin seul = 10 avec 01
const LONGUEUR_PAR_PAYS={'Bénin':[10],'Togo':[8],"Côte d'Ivoire":[10],'Sénégal':[9],'Mali':[8],'Niger':[8],'Burkina Faso':[8],'Ghana':[10],'Nigeria':[10],'Cameroun':[9],'France':[9],'USA':[10],'Royaume-Uni':[10],'Belgique':[9]};
const MAP_PAYS_CODE={'Bénin':'+229','Togo':'+228',"Côte d'Ivoire":'+225','Sénégal':'+221','Mali':'+223','Niger':'+227','Burkina Faso':'+226','Cameroun':'+237','Ghana':'+233','Nigeria':'+234','France':'+33','USA':'+1','Royaume-Uni':'+44','Belgique':'+32'};
function paysDepuisIndicatif(indic){const p=document.getElementById('pays').value;if(MAP_PAYS_CODE[p]===indic)return p;for(let k in MAP_PAYS_CODE){if(MAP_PAYS_CODE[k]===indic)return k;}return p;}
function texteLongueur(pays){const lens=LONGUEUR_PAR_PAYS[pays]||[7,8,9,10,11];if(pays==='Bénin')return'Bénin : 10 chiffres, commence par 01. Ex : 01 97 00 00 00';return pays+' : '+lens.join(' ou ')+' chiffres.';}
function majAideTel(){const indic=document.getElementById('indicatif').value;const pays=paysDepuisIndicatif(indic);document.getElementById('telAide').textContent=texteLongueur(pays);}
function majIndicatif(){verifTel(document.getElementById('whatsappNum'));const code=document.getElementById('indicatif').value;for(let p in MAP_PAYS_CODE){if(MAP_PAYS_CODE[p]===code){document.getElementById('pays').value=p;break;}}majAideTel();}
function syncPaysVersIndicatif(){const pays=document.getElementById('pays').value;if(MAP_PAYS_CODE[pays])document.getElementById('indicatif').value=MAP_PAYS_CODE[pays];verifTel(document.getElementById('whatsappNum'));majAideTel();}
function normaliseNumero(indic,numBrut){let num=numBrut.replace(/[^0-9]/g,'');if(indic==='+229'){if(num.length===13&&num.startsWith('229'))num=num.slice(3);if(num.length===11&&num.startsWith('229'))num=num.slice(3);if(num.length===8)num='01'+num;}else{const c=indic.replace('+','');if(num.startsWith(c)&&num.length>8)num=num.slice(c.length);if(num.startsWith('0'))num=num.slice(1);}return num;}
function verifTel(el){const indic=document.getElementById('indicatif').value;const pays=paysDepuisIndicatif(indic);const lens=LONGUEUR_PAR_PAYS[pays]||[7,8,9,10,11];const brut=el.value.replace(/[^0-9]/g,'');const num=normaliseNumero(indic,brut);let ok=pays==='Bénin'?(num.length===10&&num.startsWith('01'))||brut.length===8:lens.includes(num.length);document.getElementById('errTel').textContent='❌ '+texteLongueur(pays);document.getElementById('errTel').classList.toggle('show',brut.length>0&&!ok);el.classList.toggle('err',brut.length>0&&!ok);majAideTel();return ok;}
function verifMdp(){const a=document.getElementById('password').value;const b=document.getElementById('password2').value;const bad=b.length>0&&a!==b;document.getElementById('errMdp').classList.toggle('show',bad);return !bad;}
async function inscrire(){
  const nom=document.getElementById('nom').value.trim();
  const indic=document.getElementById('indicatif').value;
  const num=normaliseNumero(indic,document.getElementById('whatsappNum').value);
  const whatsapp=indic+' '+num;
  const password=document.getElementById('password').value;
  const password2=document.getElementById('password2').value;
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pays=document.getElementById('pays').value;
  const ville=document.getElementById('ville').value.trim();
  const localite=document.getElementById('localite').value.trim();
  let categorie=document.getElementById('categorie').value;
  const description=document.getElementById('description').value.trim();
  const btn=document.getElementById('btnInscrire');
  if(!nom||!num||!ville||!localite){showMsg('Remplis Nom + WhatsApp + Ville + Localité',false);return;}
  if(!verifTel(document.getElementById('whatsappNum'))){showMsg('❌ Numéro incorrect. '+texteLongueur(paysDepuisIndicatif(indic)),false);return;}
  if(!password||password.length<6){showMsg('Mot de passe : min 6 caractères',false);return;}
  if(password!==password2){showMsg('❌ Les 2 mots de passe ne sont pas identiques',false);return;}
  if(!email||!email.includes('@')){showMsg('Email obligatoire (sécurité mondiale)',false);return;}
  let typeFinal=typeCompte;
  if(email===ADMIN_EMAIL) typeFinal='admin';
  if(typeFinal==='prestataire'){
    if(categorie==='__AUTRE__'){const a=document.getElementById('autreCategorie').value.trim();if(!a){showMsg('Écris ta catégorie',false);return;}categorie=a;}
    if(!categorie||!description){showMsg('Prestataire : catégorie + description',false);return;}
  }
  btn.disabled=true;btn.textContent='Création...';
  try{
    // 1. SÉCURITÉ : création Auth, mot de passe haché par Supabase, jamais en clair
    const {data:authData,error:authErr}=await supabase.auth.signUp({email,password});
    if(authErr){showMsg(authErr.message.includes('already')?'Ce email existe déjà, connecte-toi.':authErr.message,false);btn.disabled=false;btn.textContent='Créer mon compte →';return;}
    const userId=authData.user?.id;
    if(!userId){showMsg('Vérifie ton email pour valider ton compte, puis connecte-toi.',true);btn.disabled=false;btn.textContent='Créer mon compte →';return;}
    // 2. Profil, id = id Auth, SANS password
    const payload={id:userId,nom,full_name:nom,whatsapp,phone:whatsapp,email,password:undefined,type:typeFinal,type_compte:typeFinal,role:typeFinal,pays,country:pays,ville,city:ville,localite,description:description||null,description_profil:description||null,categorie:typeFinal==='prestataire'?categorie:null,categorie_prestataire:typeFinal==='prestataire'?categorie:null,univers:typeFinal==='prestataire'?universPourCategorie(categorie):null,statut_validation:typeFinal==='admin'?'valide':(typeFinal==='prestataire'?'en_attente':'valide'),status_prestataire:typeFinal==='prestataire'?'en_attente':'valide'};
    delete payload.password;
    const {error}=await supabase.from('profiles').insert([payload]);
    if(error){showMsg('Erreur profil : '+error.message,false);btn.disabled=false;btn.textContent='Créer mon compte →';return;}
    // 3. Session déjà créée, on ne stocke que l'affichage, jamais la preuve
    localStorage.setItem('rocy_user_id',userId);localStorage.setItem('rocy_user_nom',nom);localStorage.setItem('rocy_user_type',typeFinal);localStorage.setItem('rocy_user_email',email);localStorage.setItem('rocy_user_pays',pays);localStorage.setItem('rocy_user_ville',ville);localStorage.setItem('rocy_user_localite',localite);
    showMsg('✅ Compte créé ! Redirection...',true);
    setTimeout(()=>{if(typeFinal==='admin')location.href='admin.html';else if(typeFinal==='prestataire')location.href='creer-annonce.html';else if(typeFinal==='livreur')location.href='dashboard-prestataire.html';else location.href='index.html';},1000);
  }catch(e){showMsg('Erreur : '+e.message,false);btn.disabled=false;btn.textContent='Créer mon compte →';}
}
document.addEventListener('DOMContentLoaded',()=>{majAideTel();if(window.rocyAppliquerTraduction)window.rocyAppliquerTraduction();});
</script>
</body></html>
