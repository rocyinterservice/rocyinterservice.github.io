<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="chatTitre">Chat - Rocyinter service</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;display:flex;flex-direction:column;height:100vh}
header{background:#0f172a;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header .back{cursor:pointer;font-size:18px}
header b{font-size:16px} header small{display:block;opacity:.7;font-size:11px;font-weight:400}
.annonce-bar{background:#fffbeb;border-bottom:1px solid #fde68a;padding:10px 16px;font-size:13px}
.annonce-bar b{display:block}
.annonce-bar small{color:#92400e}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.4;overflow-wrap:break-word}
.msg.moi{background:#0f172a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.autre{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.msg small{display:block;font-size:10px;opacity:.6;margin-top:4px}
.msg.sys{background:#fef3c7;color:#92400e;align-self:center;text-align:center;font-size:12px;border-radius:999px}
.msg.prop{background:#e0f2fe;border:2px solid #38bdf8;align-self:center;text-align:center;width:100%;max-width:100%}
.msg.prop button{margin:6px 4px 0;padding:8px 14px;border:none;border-radius:999px;font-weight:700;cursor:pointer}
.input-bar{background:#fff;padding:12px;display:flex;gap:8px;border-top:1px solid #e2e8f0}
.input-bar input{flex:1;padding:12px;border:1px solid #e2e8f0;border-radius:999px;font-size:14px}
.input-bar button{background:#f59e0b;border:none;padding:12px 18px;border-radius:999px;font-weight:800;cursor:pointer}
.input-bar button:disabled{opacity:.5}
.actions{display:flex;gap:8px;padding:10px 16px;background:#fff;border-top:1px solid #e2e8f0}
.actions button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:13px}
.btn-cmd{background:#16a34a;color:#fff}
.btn-prop{background:#f59e0b}
.btn-voir{background:#f1f5f9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;display:grid;gap:12px}
.modal-box h3{font-size:18px}
.modal-box label{font-size:12px;font-weight:700;color:#475569}
.modal-box input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px}
</style>
</head>
<body>
<header>
  <div class="back" onclick="location.href='index.html'">←</div>
  <div><b id="nomAutre">Discussion</b><small id="infoAutre">Chargement...</small></div>
</header>
<div class="annonce-bar" id="annonceBar">Chargement de l'annonce...</div>
<div id="messages"></div>
<div class="actions" id="actionsBar">
  <button class="btn-voir" onclick="location.href='index.html'" data-i18n="voirAnnonces">Voir annonces</button>
  <button class="btn-prop" id="btnProp" onclick="ouvrirProposition()" style="display:none">💰 <span data-i18n="proposerPrix">Proposer un prix</span></button>
  <button class="btn-cmd" id="btnCmd" onclick="ouvrirCommande()" style="display:none">✅ <span data-i18n="creerCommande">Créer la commande</span></button>
</div>
<div class="input-bar">
  <input id="inputMsg" data-i18n-ph="ecrisMessage" placeholder="Écris ton message... Prix, date, lieu..." onkeypress="if(event.key==='Enter') envoyer()">
  <button id="btnEnvoyer" onclick="envoyer()" data-i18n="envoyer">Envoyer</button>
</div>
<div class="modal" id="modalProp">
  <div class="modal-box">
    <h3>💰 <span data-i18n="proposerPrix">Proposer un prix</span></h3>
    <p style="font-size:13px;color:#64748b" data-i18n="propAide">Le client verra ta proposition et pourra l'accepter ou la refuser. Pas de paiement tant qu'il n'a pas accepté.</p>
    <div><label data-i18n="montantPropose">MONTANT PROPOSÉ (FCFA)</label><input id="propMontant" type="number" placeholder="Ex: 20000"></div>
    <div><label data-i18n="detail">DÉTAIL (optionnel)</label><input id="propDetail" placeholder="Ex: Matériel inclus, 2h de travail..."></div>
    <button style="background:#f59e0b;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer" onclick="envoyerProposition()" data-i18n="envoyerProp">Envoyer la proposition →</button>
    <button style="background:#f1f5f9;border:none;padding:12px;border-radius:12px;cursor:pointer" onclick="fermerProposition()" data-i18n="annuler">Annuler</button>
  </div>
</div>
<div class="modal" id="modalCmd">
  <div class="modal-box">
    <h3>✅ <span data-i18n="creerCommande">Créer la commande</span></h3>
    <p style="font-size:13px;color:#64748b" id="texteCommission">Vous êtes d'accord sur le prix ? Créez la commande.</p>
    <div><label data-i18n="titreCommande">TITRE DE LA COMMANDE</label><input id="cmdTitre" placeholder="Ex: Réparation fuite cuisine"></div>
    <div><label data-i18n="montantConvenu">MONTANT TOTAL CONVENU (FCFA)</label><input id="cmdMontant" type="number" placeholder="Ex: 20000"></div>
    <button style="background:#16a34a;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer" onclick="creerCommande()" data-i18n="creerCommandeBtn">Créer la commande →</button>
    <button style="background:#f1f5f9;border:none;padding:12px;border-radius:12px;cursor:pointer" onclick="fermerCommande()" data-i18n="annuler">Annuler</button>
  </div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = sb;
let moiId = ''; let monRole = '';
const prestataireId = localStorage.getItem('chat_prestataire');
const annonceId = localStorage.getItem('chat_annonce');
const convIdDirect = localStorage.getItem('chat_conversation_id');
let conversationId = convIdDirect || null; let annonceData = null; let clientIdFinal = null;

async function notifier(destinataire, titre, message, type, lien){
  try{
    if(!destinataire || String(destinataire)===String(moiId)) return;
    await sb.rpc('creer_notification', { p_user_id: destinataire, p_titre: titre, p_message: String(message||'').slice(0,120), p_type: type||'info', p_lien: lien||'chat.html' });
  }catch(e){ console.log('Notif échouée (pas grave):', e); }
}
function estValideAnnonce(a){
  const s = String(a.status || '').toLowerCase().trim();
  if(!s) return true;
  return s==='valide' || s==='valid' || s==='publie' || s==='publié' || s==='publiee' || s==='actif' || s==='active';
}
function calculerCommission(univers, montant, annonce){
  if(univers==='domicile') return Math.round(montant * 0.08);
  if(univers==='pro') return 5000;
  if(univers==='manger' || univers==='sejour') return Math.round(montant * 0.12);
  if(univers==='immobilier'){
    const cat = String(annonce?.categorie||'').toLowerCase();
    if(cat.includes('parcelle') || cat.includes('vente') || cat.includes('terrain')) return Math.min(200000, 10000 + Math.round(montant * 0.02));
    return Math.round(montant * 0.50);
  }
  if(univers==='livreur') return Math.round(montant * 0.20);
  return Math.round(montant * 0.12);
}
function texteCommission(univers, annonce){
  if(univers==='domicile') return 'Commission Rocyinter : 8% - prélevée à la libération, pas avant.';
  if(univers==='pro') return 'Commission Rocyinter : 5 000 FCFA pour débloquer le contact.';
  if(univers==='manger') return 'Commission Rocyinter : 12%. Espèces à la livraison : + 500 FCFA.';
  if(univers==='sejour') return 'Commission Rocyinter : 12% par nuit réservée.';
  if(univers==='livreur') return 'Livreur 80% / Rocyinter 20%. Prix à discuter dans le chat.';
  if(univers==='immobilier'){
    const cat = String(annonce?.categorie||'').toLowerCase();
    if(cat.includes('parcelle') || cat.includes('vente')) return 'Parcelle : Réservation 10 000 FCFA + 2% plafonné 200 000 FCFA. Reste devant notaire.';
    return "Location : 50% d'un mois en escrow pour bloquer. Payé par le propriétaire, une fois.";
  }
  return 'Commission Rocyinter prélevée à la libération.';
}
function bloquerChat(msg){
  document.getElementById('messages').innerHTML = '';
  const d = document.createElement('div'); d.className='msg sys'; d.textContent = msg;
  document.getElementById('messages').appendChild(d);
  document.getElementById('inputMsg').disabled = true;
  document.getElementById('btnEnvoyer').disabled = true;
}
async function init(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ location.href='connexion.html'; return; }
  moiId = user.id;
  const {data:profMoi} = await sb.from('profiles').select('type_compte, type_fournisseur').eq('id', moiId).maybeSingle();
  monRole = String(profMoi?.type_compte || profMoi?.type_fournisseur || '').toLowerCase();
  if(monRole==='admin'){ alert('Admin : tu ne peux pas chatter, tu gères dans Admin.'); location.href='admin.html'; return; }
  if(conversationId){
    const {data: conv} = await sb.from('conversations').select('*').eq('id', conversationId).maybeSingle();
    if(conv){
      clientIdFinal = conv.client_id;
      const {data: ann2} = await sb.from('annonces').select('id, titre, categorie, univers, prix_fixe, prix_indicatif, devise, localite, ville, pays, status, prestataire_id').eq('id', conv.annonce_id).maybeSingle();
      if(ann2){ annonceData = ann2; }
      localStorage.setItem('chat_prestataire', conv.prestataire_id);
      if(conv.annonce_id) localStorage.setItem('chat_annonce', conv.annonce_id);
      return await initAvecAnnonce(conv.annonce_id, conv.prestataire_id, conv);
    }
  }
  if(!prestataireId || !annonceId){ location.href='index.html'; return; }
  return await initAvecAnnonce(annonceId, prestataireId, null);
}
async function initAvecAnnonce(annId, prestaId, convExistante){
  const {data: ann} = await sb.from('annonces').select('id, titre, categorie, univers, prix_fixe, prix_indicatif, devise, localite, ville, pays, status, prestataire_id').eq('id', annId).maybeSingle();
  if(!ann){ document.getElementById('annonceBar').textContent = 'Annonce introuvable.'; document.getElementById('inputMsg').disabled = true; return; }
  const vraiPresta = ann.prestataire_id || '';
  if(String(vraiPresta) !== String(prestaId)){ document.getElementById('annonceBar').textContent = 'Annonce / prestataire incohérent.'; document.getElementById('inputMsg').disabled = true; return; }
  if(!estValideAnnonce(ann)){
    document.getElementById('annonceBar').textContent = ann.titre + ' - Annonce en cours de vérification. Chat bloqué.';
    bloquerChat("⏳ Cette annonce n'est pas encore validée. Tu ne peux pas chatter dessus.");
    return;
  }
  annonceData = ann;
  const {data: prof} = await sb.from('profiles').select('nom, nom_entreprise, quartier').eq('id', prestaId).maybeSingle();
  let nomPresta = prof?.nom_entreprise || prof?.nom || 'Prestataire';
  let badgeQ = prof?.quartier ? ` 📍 ${prof.quartier}` : '';
  const bar = document.getElementById('annonceBar'); bar.innerHTML='';
  const b = document.createElement('b'); b.textContent = ann.titre; bar.appendChild(b);
  const s = document.createElement('small'); s.textContent = `📍 ${ann.localite||''} - ${ann.ville||''} • 👤 ${nomPresta}${badgeQ} • ${ann.prix_fixe ? Number(ann.prix_indicatif||0).toLocaleString()+' '+(ann.devise||'FCFA') : 'Prix à discuter'} - ${texteCommission(ann.univers, ann)}`; bar.appendChild(s);
  document.getElementById('nomAutre').textContent = nomPresta + badgeQ;
  document.getElementById('infoAutre').textContent = `${ann.categorie||''} • ${ann.ville||''} - ${ann.localite||''}`;
  document.getElementById('cmdTitre').value = ann.titre;
  document.getElementById('cmdMontant').value = ann.prix_indicatif || '';
  document.getElementById('texteCommission').textContent = texteCommission(ann.univers, ann);
  const jeSuisPresta = (String(moiId)===String(prestaId));
  if(jeSuisPresta) document.getElementById('btnProp').style.display = 'block';
  else document.getElementById('btnCmd').style.display = 'block';
  if(convExistante){ conversationId = convExistante.id; clientIdFinal = convExistante.client_id; }
  else {
    const {data: convs} = await sb.from('conversations').select('*').eq('annonce_id', annId);
    const bonne = (convs||[]).find(c => (String(c.client_id)===String(moiId) && String(c.prestataire_id)===String(prestaId)) || (String(c.prestataire_id)===String(moiId) && String(c.client_id)===String(prestaId)));
    let cible = bonne;
    if(!cible && jeSuisPresta){
      const mesConvs = (convs||[]).filter(c => String(c.prestataire_id)===String(moiId) && c.client_id && String(c.client_id)!==String(c.prestataire_id));
      if(mesConvs.length===1) cible = mesConvs[0];
      else if(mesConvs.length>1){
        cible = mesConvs.sort((a,b)=> new Date(b.created_at)-new Date(a.created_at))[0];
      }
    }
    if(cible){ conversationId = cible.id; clientIdFinal = cible.client_id; }
    else if(!jeSuisPresta){
      clientIdFinal = moiId;
      const {data: nv, error} = await sb.from('conversations').insert([{client_id: moiId, prestataire_id: prestaId, annonce_id: annId}]).select().single();
      if(error){ alert('Erreur conversation : '+error.message); return; }
      if(nv) conversationId = nv.id;
    } else { bloquerChat("⏳ En attente qu'un client te parle sur cette annonce."); document.getElementById('btnProp').style.display='none'; return; }
  }
  if(!jeSuisPresta) clientIdFinal = moiId;
  chargerMessages();
  setInterval(chargerMessages, 3000);
}
async function chargerMessages(){
  if(!conversationId) return;
  const {data} = await sb.from('messages').select('*').eq('conversation_id', conversationId).order('created_at',{ascending:true});
  const box = document.getElementById('messages'); box.innerHTML='';
  if(!data || data.length===0){
    const d=document.createElement('div'); d.className='msg sys'; d.textContent='👋 Dis bonjour ! Demande le prix, la date, le lieu. Ne paie jamais en dehors de Rocyinter.'; box.appendChild(d); return;
  }
  data.forEach(m=>{
    const isMoi = String(m.sender_id)===String(moiId);
    const heure = new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    if(m.type === 'proposition'){
      const statut = m.proposition_statut || 'en_attente';
      const div = document.createElement('div'); div.className='msg prop';
      const titre = document.createElement('b'); titre.textContent = `💰 Proposition de prix : ${Number(m.proposition_prix||0).toLocaleString()} FCFA`; div.appendChild(titre);
      const c = document.createElement('div'); c.textContent = m.contenu||''; div.appendChild(c);
      const sm = document.createElement('small'); sm.textContent = heure; div.appendChild(sm);
      const jeSuisClient = (String(moiId)!==String(prestataireId || annonceData?.prestataire_id));
      if(statut==='en_attente' && jeSuisClient){
        const ok=document.createElement('button'); ok.style.cssText='background:#16a34a;color:#fff'; ok.textContent='✅ Accepter'; ok.onclick=()=>repondreProposition(m.id,'accepte'); div.appendChild(ok);
        const no=document.createElement('button'); no.style.cssText='background:#fee2e2'; no.textContent='❌ Refuser'; no.onclick=()=>repondreProposition(m.id,'refuse'); div.appendChild(no);
      } else if(statut==='accepte'){ const bb=document.createElement('b'); bb.style.color='#16a34a'; bb.textContent='✅ Proposition acceptée - Tu peux créer la commande'; div.appendChild(document.createElement('br')); div.appendChild(bb); }
      else if(statut==='refuse'){ const bb=document.createElement('b'); bb.style.color='#E53935'; bb.textContent='❌ Proposition refusée'; div.appendChild(document.createElement('br')); div.appendChild(bb); }
      box.appendChild(div); return;
    }
    const div=document.createElement('div'); div.className='msg '+(isMoi?'moi':'autre');
    const txt=document.createElement('div'); txt.textContent=m.contenu||''; div.appendChild(txt);
    const sm=document.createElement('small'); sm.textContent=(isMoi?'Vous':'Autre')+' • '+heure; div.appendChild(sm);
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}
async function envoyer(){
  const inp = document.getElementById('inputMsg'); const txt = inp.value.trim();
  if(!txt || !conversationId) return;
  if(txt.length>2000){ alert('Message trop long (max 2000).'); return; }
  inp.value = '';
  const {error} = await sb.from('messages').insert([{conversation_id: conversationId, sender_id: moiId, contenu: txt, type: 'texte'}]);
  if(error){ alert('Erreur : '+error.message); return; }
  const prestaActuel = localStorage.getItem('chat_prestataire') || prestataireId;
  const autreId = String(moiId)===String(prestaActuel) ? clientIdFinal : prestaActuel;
  await notifier(autreId, 'Nouveau message', txt, 'message', 'chat.html');
  chargerMessages();
}
function ouvrirProposition(){ const prestaActuel = localStorage.getItem('chat_prestataire') || prestataireId; if(String(moiId)!==String(prestaActuel)){ alert('Seul le prestataire propose un prix.'); return; } document.getElementById('modalProp').classList.add('show'); }
function fermerProposition(){ document.getElementById('modalProp').classList.remove('show'); }
function ouvrirCommande(){ const prestaActuel = localStorage.getItem('chat_prestataire') || prestataireId; if(String(moiId)===String(prestaActuel)){ alert('Seul le client crée la commande.'); return; } document.getElementById('modalCmd').classList.add('show'); }
function fermerCommande(){ document.getElementById('modalCmd').classList.remove('show'); }
async function envoyerProposition(){
  const prestaActuel = localStorage.getItem('chat_prestataire') || prestataireId;
  if(String(moiId)!==String(prestaActuel)){ alert('Seul le prestataire propose un prix.'); return; }
  const montant = Number(document.getElementById('propMontant').value);
  const detail = document.getElementById('propDetail').value.trim();
  if(!montant || montant<=0){ alert('Mets un montant > 0'); return; }
  const {error} = await sb.from('messages').insert([{conversation_id: conversationId, sender_id: moiId, contenu: detail || 'Proposition de prix pour ce service.', type: 'proposition', proposition_prix: montant, proposition_statut: 'en_attente'}]);
  if(error){ alert('Erreur : '+error.message); return; }
  await notifier(clientIdFinal, 'Nouvelle proposition de prix', `Proposition : ${montant.toLocaleString()} FCFA - ${detail}`, 'paiement', 'chat.html');
  fermerProposition(); document.getElementById('propMontant').value = ''; chargerMessages();
}
async function repondreProposition(msgId, rep){
  const prestaActuel = localStorage.getItem('chat_prestataire') || prestataireId;
  if(String(moiId)===String(prestaActuel)){ alert('Seul le client accepte / refuse.'); return; }
  const {error} = await sb.from('messages').update({proposition_statut: rep}).eq('id', msgId).eq('conversation_id', conversationId);
  if(error){ alert('Erreur : '+error.message); return; }
  await notifier(prestaActuel, rep==='accepte' ? 'Proposition acceptée ✅' : 'Proposition refusée ❌', rep==='accepte' ? 'Le client a accepté ta proposition. Il peut créer la commande.' : 'Le client a refusé ta proposition.', rep==='accepte' ? 'validation' : 'info', 'chat.html');
  if(rep==='accepte'){
    const {data: msg} = await sb.from('messages').select('*').eq('id', msgId).single();
    if(msg){
      document.getElementById('cmdMontant').value = msg.proposition_prix;
      await sb.from('messages').insert([{conversation_id: conversationId, sender_id: moiId, contenu: `✅ Proposition de ${Number(msg.proposition_prix).toLocaleString()} FCFA acceptée. Tu peux créer la commande.`, type: 'texte'}]);
      document.getElementById('btnCmd').style.display = 'block';
    }
  }
  chargerMessages();
}
async function creerCommande(){
  const prestaActuel = localStorage.getItem('chat_prestataire') || prestataireId;
  if(String(moiId)===String(prestaActuel)){ alert('Seul le client crée la commande.'); return; }
  const titre = document.getElementById('cmdTitre').value.trim();
  const montant = Number(document.getElementById('cmdMontant').value);
  if(!titre || !montant || montant<=0){ alert('Mets un titre + un montant > 0'); return; }
  if(!clientIdFinal){ alert('Erreur : client introuvable. Recharge la page.'); return; }
  if(String(clientIdFinal)===String(prestaActuel)){ alert('Erreur : client = prestataire. Impossible.'); return; }
  const univers = annonceData?.univers || 'domicile';
  const commission = calculerCommission(univers, montant, annonceData);
  const montantPresta = montant - commission;
  if(montantPresta < 0){ alert('Erreur commission > montant.'); return; }
  const {error} = await sb.from('commandes').insert([{client_id: clientIdFinal, prestataire_id: prestaActuel, annonce_id: annonceId || annonceData?.id, conversation_id: conversationId, univers: univers, titre, montant: montant, devise: 'FCFA', montant_total: montant, commission, montant_prestataire: montantPresta, status: 'en_attente', ville: annonceData?.ville, localite: annonceData?.localite}]).select().single();
  if(error){ alert('Erreur : ' + error.message); return; }
  await notifier(prestaActuel, 'Nouvelle commande 🛒', `${titre} - ${montant.toLocaleString()} FCFA. En attente de paiement.`, 'commande', 'dashboard-prestataire.html');
  await sb.from('messages').insert([{conversation_id: conversationId, sender_id: moiId, contenu: `✅ COMMANDE CRÉÉE : ${titre} - ${montant.toLocaleString()} FCFA (Commission ${commission.toLocaleString()} FCFA). En attente de paiement sécurisé en escrow.`, type: 'texte'}]);
  fermerCommande(); alert('✅ Commande créée ! Elle est dans ton dashboard. Va payer dans Paiement.'); chargerMessages();
}
init();
if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
</script>
</body>
</html>
