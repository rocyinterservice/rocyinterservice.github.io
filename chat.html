<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;display:flex;flex-direction:column;height:100vh}
header{background:#0f172a;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header .back{cursor:pointer;font-size:18px}
header b{font-size:16px} header small{display:block;opacity:.7;font-size:11px;font-weight:400}
.annonce-bar{background:#fffbeb;border-bottom:1px solid #fde68a;padding:10px 16px;font-size:13px}
.annonce-bar b{display:block}
.annonce-bar small{color:#92400e}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.4}
.msg.moi{background:#0f172a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.autre{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.msg small{display:block;font-size:10px;opacity:.6;margin-top:4px}
.msg.sys{background:#fef3c7;color:#92400e;align-self:center;text-align:center;font-size:12px;border-radius:999px}
.input-bar{background:#fff;padding:12px;display:flex;gap:8px;border-top:1px solid #e2e8f0}
.input-bar input{flex:1;padding:12px;border:1px solid #e2e8f0;border-radius:999px;font-size:14px}
.input-bar button{background:#f59e0b;border:none;padding:12px 18px;border-radius:999px;font-weight:800;cursor:pointer}
.actions{display:flex;gap:8px;padding:10px 16px;background:#fff;border-top:1px solid #e2e8f0}
.actions button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:13px}
.btn-cmd{background:#16a34a;color:#fff}
.btn-voir{background:#f1f5f9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;display:grid;gap:12px}
.modal-box h3{font-size:18px}
.modal-box label{font-size:12px;font-weight:700;color:#475569}
.modal-box input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px}
</style>
</head>
<body>

<header>
  <div class="back" onclick="location.href='index.html'">←</div>
  <div><b id="nomAutre">Discussion</b><small id="infoAutre">Chargement...</small></div>
</header>

<div class="annonce-bar" id="annonceBar">Chargement de l'annonce...</div>

<div id="messages"></div>

<div class="actions">
  <button class="btn-voir" onclick="location.href='index.html'">Voir annonces</button>
  <button class="btn-cmd" onclick="ouvrirCommande()">✅ Créer la commande</button>
</div>

<div class="input-bar">
  <input id="inputMsg" placeholder="Écris ton message... Prix, date, lieu..." onkeypress="if(event.key==='Enter') envoyer()">
  <button onclick="envoyer()">Envoyer</button>
</div>

<div class="modal" id="modalCmd">
  <div class="modal-box">
    <h3>✅ Créer la commande</h3>
    <p style="font-size:13px;color:#64748b">Vous êtes d'accord sur le prix ? Créez la commande. Le client paiera, l'argent sera bloqué jusqu'à la fin du service.</p>
    <div><label>TITRE DE LA COMMANDE</label><input id="cmdTitre" placeholder="Ex: Réparation fuite cuisine"></div>
    <div><label>MONTANT TOTAL CONVENU (FCFA)</label><input id="cmdMontant" type="number" placeholder="Ex: 20000"></div>
    <div><label>ACOMPTE (FCFA - optionnel)</label><input id="cmdAcompte" type="number" placeholder="Ex: 6000"></div>
    <button style="background:#16a34a;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer" onclick="creerCommande()">Créer la commande →</button>
    <button style="background:#f1f5f9;border:none;padding:12px;border-radius:12px;cursor:pointer" onclick="fermerCommande()">Annuler</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const moiId = localStorage.getItem('rocy_user_id');
const moiNom = localStorage.getItem('rocy_user_nom') || 'Moi';
const prestataireId = localStorage.getItem('chat_prestataire');
const annonceId = localStorage.getItem('chat_annonce');
let conversationId = null;
let annonceData = null;

if(!moiId){ alert('Connecte-toi d’abord pour discuter.'); location.href='connexion.html'; }
if(!prestataireId){ alert('Choisis une annonce pour discuter.'); location.href='index.html'; }

async function init(){
  // 1. Charger annonce
  const {data: ann} = await supabase.from('annonces').select('*, profiles(nom, whatsapp, ville, localite)').eq('id', annonceId).single();
  if(ann){
    annonceData = ann;
    document.getElementById('annonceBar').innerHTML = `<b>${ann.titre}</b><small>📍 ${ann.localite} - ${ann.ville} • 👤 ${ann.profiles?.nom} • ${ann.prix_fixe ? Number(ann.prix_indicatif).toLocaleString()+' FCFA' : 'Prix à discuter'}</small>`;
    document.getElementById('nomAutre').textContent = ann.profiles?.nom || 'Prestataire';
    document.getElementById('infoAutre').textContent = `${ann.categorie} • ${ann.ville} - ${ann.localite}`;
    document.getElementById('cmdTitre').value = ann.titre;
    document.getElementById('cmdMontant').value = ann.prix_indicatif || '';
  }

  // 2. Trouver ou créer conversation
  const clientId = moiId === prestataireId ? prestataireId : moiId;
  // On cherche conversation existante entre moi et prestataire pour cette annonce
  const {data: convs} = await supabase.from('conversations').select('*').eq('annonce_id', annonceId).or(`client_id.eq.${moiId},prestataire_id.eq.${moiId}`);
  if(convs && convs.length>0){
    conversationId = convs[0].id;
  } else {
    const isMoiPresta = moiId === prestataireId;
    const {data: nv, error} = await supabase.from('conversations').insert([{
      client_id: isMoiPresta ? null : moiId,
      prestataire_id: prestataireId,
      annonce_id: annonceId,
      status: 'active'
    }]).select().single();
    if(nv) conversationId = nv.id;
    else {
      // Si déjà créé par l'autre, on le récupère
      const {data: c2} = await supabase.from('conversations').select('*').eq('annonce_id', annonceId).limit(1).single();
      if(c2) conversationId = c2.id;
    }
  }

  chargerMessages();
  // Refresh auto toutes les 3 sec
  setInterval(chargerMessages, 3000);
}

async function chargerMessages(){
  if(!conversationId) return;
  const {data} = await supabase.from('messages').select('*').eq('conversation_id', conversationId).order('created_at',{ascending:true});
  const box = document.getElementById('messages');
  if(!data || data.length===0){
    box.innerHTML = `<div class="msg sys">👋 Dis bonjour ! Demande le prix, la date, le lieu. Ne paie jamais en dehors de Rocyinter.</div>`;
    return;
  }
  box.innerHTML = data.map(m=>{
    const isMoi = m.sender_id === moiId;
    const heure = new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return `<div class="msg ${isMoi?'moi':'autre'}">${m.contenu}<small>${isMoi?'Vous':'Autre'} • ${heure}</small></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function envoyer(){
  const inp = document.getElementById('inputMsg');
  const txt = inp.value.trim();
  if(!txt || !conversationId) return;
  inp.value = '';
  await supabase.from('messages').insert([{conversation_id: conversationId, sender_id: moiId, contenu: txt}]);
  chargerMessages();
}

function ouvrirCommande(){ document.getElementById('modalCmd').classList.add('show'); }
function fermerCommande(){ document.getElementById('modalCmd').classList.remove('show'); }

async function creerCommande(){
  const titre = document.getElementById('cmdTitre').value.trim();
  const montant = Number(document.getElementById('cmdMontant').value);
  const acompte = Number(document.getElementById('cmdAcompte').value || 0);
  if(!titre || !montant || montant<=0){ alert('Mets un titre + un montant > 0'); return; }

  const commission = Math.round(montant * 0.12); // 12% Rocyinter
  const montantPresta = montant - commission;

  const {data, error} = await supabase.from('commandes').insert([{
    client_id: moiId === prestataireId ? null : moiId,
    prestataire_id: prestataireId,
    annonce_id: annonceId,
    conversation_id: conversationId,
    univers: annonceData?.univers || null,
    titre,
    montant_total: montant,
    commission,
    montant_prestataire: montantPresta,
    acompte,
    status: 'en_attente',
    pays: annonceData?.pays,
    ville: annonceData?.ville,
    localite: annonceData?.localite
  }]).select().single();

  if(error){ alert('Erreur : ' + error.message); return; }

  await supabase.from('messages').insert([{conversation_id: conversationId, sender_id: moiId, contenu: `✅ COMMANDE CRÉÉE : ${titre} - ${montant.toLocaleString()} FCFA (Commission 12% : ${commission.toLocaleString()} FCFA). En attente de paiement sécurisé.`}]);

  fermerCommande();
  alert('✅ Commande créée ! Elle est dans ton dashboard.');
  chargerMessages();
}

init();
</script>
</body>
</html>
