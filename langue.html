<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Langue - Rocyinter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:420px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 12px} h1 span{color:#f59e0b}
.btn{width:100%;background:#fff;border:1px solid #e2e8f0;padding:14px;border-radius:12px;cursor:pointer;margin-bottom:8px;text-align:left;font-size:15px;font-weight:700}
.btn.active{background:#0f172a;color:#fff}
.info{background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}
</style></head>
<body><div class="top">
<div class="back" onclick="history.back()">← Retour</div>
<h1>🌍 <span>Langue</span></h1>
<div id="liste"></div>
<div class="info" style="margin-top:12px">Pour l'instant, le site est en Français. Les autres langues arrivent. Ton choix est enregistré et sera utilisé quand les traductions seront activées.</div>
</div>
<script>
const langues = [['fr','🇫🇷 Français'],['en','🇬🇧 English'],['es','🇪🇸 Español'],['pt','🇵🇹 Português'],['ar','🇸🇦 العربية'],['fon','🇧🇯 Fon'],['yo','🇳🇬 Yoruba']];
const cur = localStorage.getItem('rocy_langue')||'fr';
document.getElementById('liste').innerHTML = langues.map(l=>`<button class="btn ${l[0]===cur?'active':''}" onclick="choisir('${l[0]}')">${l[1]} ${l[0]===cur?'✅':''}</button>`).join('');
function choisir(l){localStorage.setItem('rocy_langue',l); alert('Langue enregistrée : '+l+' - Le site reste en Français pour l’instant, traduction en cours.'); history.back();}
</script></body></html>
