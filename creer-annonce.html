<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="creerTitre">Créer une annonce - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.top{max-width:520px;margin:0 auto;padding:16px}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:14px;margin-bottom:16px;line-height:1.5}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);display:grid;gap:12px}
label{font-size:12px;font-weight:700;color:#475569;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff}
textarea{min-height:90px;resize:vertical}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;padding:12px;border:2px solid #e2e8f0;background:#fff;border-radius:10px;cursor:pointer;font-weight:700}
.toggle button.active{border-color:#0f172a;background:#0f172a;color:#fff}
.info-commission{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;color:#92400e;display:none}
.info-univers{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px;font-size:13px;line-height:1.5;color:#1e40af}
.bandeau-abo{padding:12px;border-radius:12px;font-size:13px;line-height:1.5;font-weight:600;text-align:center;margin-bottom:12px}
.abo-ok{background:#dcfce7;color:#166534}
.abo-offert{background:#dbeafe;color:#1e40af}
.abo-expire{background:#fee2e2;color:#991b1b}
.btn{background:#f59e0b;color:#000;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-dark{background:#0f172a;color:#fff}
.msg{text-align:center;font-size:13px;padding:10px;border-radius:10px;display:none}
.msg.ok{display:block;background:#dcfce7;color:#166534}
.msg.err{display:block;background:#fee2e2;color:#991b1b}
small{color:#94a3b8;font-size:12px;text-align:center;display:block;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="location.href='index.html'">← <span data-i18n="accueil">Accueil</span></div>
<h1><span data-i18n="creerTitre">Publiez votre</span> <span data-i18n="vraiService">vrai service</span></h1>
<p class="sub" data-i18n="creerSous">Tu ne peux publier que sur tes activités + avec un abonnement à jour.</p>

<div id="bandeauAbo"></div>

<div class="card">
  <div>
    <label data-i18n="categorie">CATÉGORIE * - TES ACTIVITÉS SEULEMENT</label>
    <select id="categorie" onchange="onCategorieChange()"><option value="">Chargement de tes activités...</option></select>
  </div>
  <div id="blocAutreCategorie" style="display:none">
    <label>+ AJOUTER UNE AUTRE ACTIVITÉ *</label>
    <input id="autreCategorie" placeholder="Ex: Nettoyage, Désinfection...">
  </div>
  <div id="blocUnivers" class="info-univers" style="display:none"></div>
  <div id="infoCommission" class="info-commission"></div>
  <div><label data-i18n="titreAnnonce">TITRE DE VOTRE ANNONCE *</label><input id="titre" placeholder="Ex: Plombier rapide à Calavi" maxlength="80"></div>
  <div><label data-i18n="description">DESCRIPTION DÉTAILLÉE *</label><textarea id="description" placeholder="Ex: Je suis plombier à Godomey depuis 5 ans..." maxlength="2000"></textarea></div>
  <div><label data-i18n="typePrix">TYPE DE PRIX *</label>
    <div class="toggle"><button type="button" id="btnFixe" onclick="setPrixType(true)">💰 Prix fixe</button><button type="button" id="btnDiscuter" class="active" onclick="setPrixType(false)">💬 À discuter</button></div>
  </div>
  <div id="blocPrix" style="display:none"><label>PRIX INDICATIF (FCFA)</label><input id="prix" type="number" placeholder="Ex: 15000" min="0" max="10000000"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div><label data-i18n="pays">PAYS *</label><select id="pays"></select></div>
    <div><label data-i18n="ville">VILLE *</label><input id="ville" placeholder="Ex: Calavi" maxlength="60"></div>
  </div>
  <div><label data-i18n="localite">LOCALITÉ / QUARTIER *</label><input id="localite" placeholder="Ex: Godomey" maxlength="80"></div>
  <div><label>PHOTO (lien - optionnel)</label><input id="photo" placeholder="Collez un lien photo https://..." maxlength="500"></div>
  <div id="msg" class="msg"></div>
  <button class="btn" id="btnPublier" onclick="publier()">Publier mon annonce →</button>
  <small>⚠️ Annonce en attente de validation. Abonnement à jour obligatoire pour publier. Commissions dues dès la 1ère mission.</small>
</div>
</div>
<script>
const SUPABASE_URL="https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY="sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let prixFixe=false, mesActivites=[], universChoisi="", abonnementAJour=false, profilFournisseur=null, uidActuel=null;

const infosCommission={manger:"🍽️ <b>Manger : 12%</b>",domicile:"🏠 <b>Domicile : 8%</b> - Tu reçois 92%",pro:"💼 <b>Pro : 5 000 FCFA fixe</b>",sejour:"✈️ <b>Séjour : 12% par nuit</b>",immobilier:"🏘️ <b>Immobilier :</b> Parcelle/Vente 10 000 FCFA/30j + 2% plafonné 200 000 FCFA. Location 50% d'un mois.",livreur:"🛵 <b>Livreur 80% / Rocyinter 20%</b>"};
function universPourCategorie(cat){
  const manger=['Traiteur','Restaurant','Restaurant / Maquis','Livraison repas','Pâtisserie','Jus / Boissons'];
  const domicile=['Nettoyage / Ménage','Ménage / Repassage','Plomberie','Électricité','Climatisation','Menuiserie','Peinture','Jardinage','Mécanique','Serrurerie','Déménagement','Nettoyage','Désinfection'];
  const pro=['Design','Design / Graphisme','Développement','Développement Web','Marketing','Marketing / Réseaux sociaux','Comptabilité','Traduction','Cours','Cours / Coaching','Montage vidéo','Rédaction / CV'];
  const sejour=['Hôtel','Hôtel / Appartement','Location voiture','Guide touristique','Transport','Transport / Moto','Location salle','Excursion / Visite'];
  const immo=['Location maison / Appartement','Maison à louer','Chambre à louer','Appartement à louer','Parcelle à vendre','Terrain à vendre','Maison à vendre','Vente maison / Terrain','Location chambre / Studio','Gestion locative','Visite / Courtage'];
  if(manger.includes(cat)) return 'manger';
  if(domicile.includes(cat)) return 'domicile';
  if(pro.includes(cat)) return 'pro';
  if(sejour.includes(cat)) return 'sejour';
  if(immo.includes(cat)) return 'immobilier';
  if(cat.toLowerCase().includes('livraison')||cat.toLowerCase().includes('livreur')) return 'livreur';
  return 'domicile';
}
function verifierAbonnement(profil){
  const auj = new Date();
  const fin = profil.abonnement_fin ? new Date(profil.abonnement_fin) : null;
  const actif = profil.abonnement_actif === true || profil.abonnement_statut === 'actif';
  const offert = profil.abonnement_offert === true || profil.premier_mois_offert === true;
  if(fin && fin >= auj) return {ok:true, type:'paye', fin};
  if(!fin && (actif || offert)) return {ok:true, type:'offert', fin:null};
  if(actif && !fin) return {ok:true, type:'offert', fin:null};
  return {ok:false, type:'expire', fin};
}
function afficherBandeauAbo(res){
  const box=document.getElementById('bandeauAbo');
  const btn=document.getElementById('btnPublier');
  if(res.ok && res.type==='offert'){
    box.innerHTML=`<div class="bandeau-abo abo-offert">🎁 1er mois offert - Tu peux publier. Commissions dues dès la 1ère mission.</div>`;
    btn.disabled=false;
  } else if(res.ok){
    const dateFin = res.fin ? res.fin.toLocaleDateString('fr-FR') : '';
    box.innerHTML=`<div class="bandeau-abo abo-ok">✅ Abonnement à jour ${dateFin ? 'jusqu\'au '+dateFin : ''} - Tu peux publier.</div>`;
    btn.disabled=false;
  } else {
    box.innerHTML=`<div class="bandeau-abo abo-expire">⛔ Ton abonnement est expiré. Renouvelle pour publier une nouvelle annonce.<br><br><button class="btn btn-dark" onclick="location.href='abonnement.html'">Renouveler mon abonnement →</button></div>`;
    btn.disabled=true; btn.textContent='⛔ Abonnement expiré - Publier bloqué';
  }
}
function onCategorieChange(){
  const sel=document.getElementById('categorie');
  const isAutre=sel.value==='__AJOUTER__';
  document.getElementById('blocAutreCategorie').style.display=isAutre?'block':'none';
  if(isAutre||!sel.value) return;
  universChoisi=universPourCategorie(sel.value);
  const bloc=document.getElementById('blocUnivers'); bloc.style.display='block'; bloc.textContent='🌍 Univers automatique : '+universChoisi+' - activité '+sel.value;
  const info=document.getElementById('infoCommission'); info.innerHTML=infosCommission[universChoisi]||''; info.style.display='block';
  if(universChoisi==='livreur') setPrixType(false);
}
function setPrixType(fixe){prixFixe=fixe;document.getElementById('btnFixe').classList.toggle('active',fixe);document.getElementById('btnDiscuter').classList.toggle('active',!fixe);document.getElementById('blocPrix').style.display=fixe?'block':'none';}
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.style.display='block';}
function remplirPays(paysDefaut){
  const sel=document.getElementById('pays');
  if(window.ROCY_PAYS&&window.ROCY_PAYS.length){sel.innerHTML=window.ROCY_PAYS.map(p=>`<option value="${p.nom}">${p.drapeau} ${p.nom}</option>`).join('');}
  else{sel.innerHTML=`<option value="Bénin">🇧🇯 Bénin</option>`;}
  sel.value=paysDefaut||'Bénin';
}
// SÉCURISÉ : on ne lit JAMAIS localStorage pour l'identité. On demande à Supabase qui est connecté.
async function getUtilisateurSecurise(){
  const {data:{user}, error} = await supabase.auth.getUser();
  if(error || !user) return null;
  return user;
}
async function init(){
  // 1. Qui est connecté ? Si personne -> connexion
  const user = await getUtilisateurSecurise();
  if(!user){ location.href='connexion.html'; return; }
  uidActuel = user.id;

  // 2. Profil depuis Supabase, colonnes utiles seulement, jamais select(*)
  // RLS doit autoriser : user ne lit que SON profil
  const {data: profil, error: errProfil} = await supabase.from('profiles')
    .select('id, type_compte, role, activites, categorie, ville, localite, pays, abonnement_actif, abonnement_statut, abonnement_fin, abonnement_offert, premier_mois_offert')
    .eq('id', uidActuel).single();
  if(errProfil || !profil){ showMsg('Profil introuvable. Reconnecte-toi.', false); await supabase.auth.signOut(); setTimeout(()=> location.href='connexion.html', 1200); return; }
  profilFournisseur = profil;

  // 3. Rôle depuis la BASE, jamais depuis localStorage
  const roleReel = (profil.type_compte || profil.role || '').toLowerCase();
  if(roleReel === 'client'){ showMsg('Client : crée un compte Prestataire pour publier.', false); setTimeout(()=> location.href='inscription.html?type=prestataire', 1500); return; }
  if(roleReel === 'admin'){ location.href='admin.html'; return; }
  if(roleReel !== 'prestataire' && roleReel !== 'livreur' && roleReel !== 'fournisseur'){
    showMsg('Compte non autorisé à publier.', false); return;
  }

  remplirPays(profil.pays);
  document.getElementById('ville').value = profil.ville || '';
  document.getElementById('localite').value = profil.localite || '';

  // 4. Abonnement depuis la BASE
  const res = verifierAbonnement(profil);
  abonnementAJour = res.ok;
  afficherBandeauAbo(res);

  let acts = profil.activites || [];
  if(typeof acts === 'string'){ try{ acts = JSON.parse(acts); }catch(e){ acts = [acts]; } }
  if(!acts.length && profil.categorie) acts = [profil.categorie];
  if(roleReel === 'livreur' && !acts.length) acts = ['Livraison moto'];
  mesActivites = acts;
  const sel = document.getElementById('categorie');
  if(!mesActivites.length){
    sel.innerHTML = `<option value="">Aucune activité</option><option value="__AJOUTER__">➕ + Ajouter une autre activité</option>`;
    document.getElementById('blocAutreCategorie').style.display = 'block';
  } else {
    // On échappe les noms pour éviter XSS si une activité contient du HTML
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    sel.innerHTML = `<option value="">Choisir parmi tes activités...</option>` + mesActivites.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('') + `<option value="__AJOUTER__">➕ + Ajouter une autre activité</option>`;
  }
}
async function publier(){
  if(!abonnementAJour){ showMsg('⛔ Abonnement expiré. Renouvelle pour publier.', false); setTimeout(()=> location.href='abonnement.html', 1200); return; }
  // Re-vérifie l'identité au moment de publier, pas au chargement seulement
  const user = await getUtilisateurSecurise();
  if(!user){ location.href='connexion.html'; return; }
  const uid = user.id;

  const titre = document.getElementById('titre').value.trim();
  const description = document.getElementById('description').value.trim();
  let categorie = document.getElementById('categorie').value;
  const pays = document.getElementById('pays').value;
  const ville = document.getElementById('ville').value.trim();
  const localite = document.getElementById('localite').value.trim();
  let photo = document.getElementById('photo').value.trim();
  const prix = document.getElementById('prix').value;
  const btn = document.getElementById('btnPublier');

  // Photo : seulement https://, sinon on rejette (évite javascript: ou data: malveillant)
  if(photo && !/^https:\/\//i.test(photo)){ showMsg('Photo : colle un lien https:// valide', false); return; }

  if(categorie === '__AJOUTER__'){
    const autre = document.getElementById('autreCategorie').value.trim();
    if(!autre){ showMsg('Écris ta nouvelle activité', false); return; }
    if(autre.length > 60){ showMsg('Activité trop longue', false); return; }
    categorie = autre;
    universChoisi = universPourCategorie(categorie);
    if(!mesActivites.includes(categorie)){
      const n = [...mesActivites, categorie];
      // RLS : on ne peut mettre à jour que SON profil, avec son propre id = auth.uid()
      const {error: errUp} = await supabase.from('profiles').update({activites: n}).eq('id', uid);
      if(errUp){ showMsg('Erreur ajout activité : ' + errUp.message, false); return; }
      mesActivites = n;
    }
  } else {
    if(!categorie || !mesActivites.includes(categorie)){ showMsg('Choisis une activité parmi TES activités.', false); return; }
    universChoisi = universPourCategorie(categorie);
  }
  if(!universChoisi || !categorie || !titre || !description || !ville || !localite){ showMsg('Remplis Catégorie + Titre + Description + Ville + Localité', false); return; }
  if(titre.length < 5){ showMsg('Titre trop court, min 5 caractères', false); return; }
  if(description.length < 20){ showMsg('Description trop courte, min 20 caractères', false); return; }
  if(prixFixe && (!prix || Number(prix) <= 0)){ showMsg('Mets un prix fixe > 0', false); return; }
  btn.disabled = true; btn.textContent = 'Publication...';
  // prestataire_id = uid de la SESSION, jamais de localStorage. RLS doit vérifier prestataire_id = auth.uid()
  const {error} = await supabase.from('annonces').insert([{
    prestataire_id: uid,
    univers: universChoisi,
    categorie, titre, description,
    prix_fixe: prixFixe,
    prix_indicatif: prixFixe ? Number(prix) : (prix ? Number(prix) : null),
    pays, ville, localite,
    photo_url: photo || null,
    status: 'en_attente'
  }]).select('id').single();
  if(error){ showMsg('Erreur : ' + error.message, false); btn.disabled = false; btn.textContent = 'Publier mon annonce →'; return; }
  showMsg('✅ Annonce envoyée ! En attente de validation.', true);
  setTimeout(()=> location.href='dashboard-prestataire.html', 1500);
}
init();
</script>
</body>
</html>
