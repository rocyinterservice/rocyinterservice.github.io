<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer une annonce - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:520px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:14px;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);display:grid;gap:12px}
label{font-size:12px;font-weight:700;color:#475569;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff}
textarea{min-height:90px;resize:vertical}
.univers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.univers button{padding:12px;border:2px solid #e2e8f0;background:#fff;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px}
.univers button.active{border-color:#f59e0b;background:#fffbeb}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;padding:12px;border:2px solid #e2e8f0;background:#fff;border-radius:10px;cursor:pointer;font-weight:700}
.toggle button.active{border-color:#0f172a;background:#0f172a;color:#fff}
.btn{background:#f59e0b;color:#000;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;width:100%}
.btn:disabled{opacity:.6}
.msg{text-align:center;font-size:13px;padding:10px;border-radius:10px;display:none}
.msg.ok{display:block;background:#dcfce7;color:#166534}
.msg.err{display:block;background:#fee2e2;color:#991b1b}
small{color:#94a3b8;font-size:12px;text-align:center;display:block;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="location.href='index.html'">← Retour</div>
<h1>Publiez votre <span>vrai service</span></h1>
<p class="sub">Décrivez ce que vous savez vraiment faire. Pas de faux service, les clients vont vous noter.</p>

<div class="card">
  <div>
    <label>UNIVERS *</label>
    <div class="univers">
      <button type="button" id="u-manger" onclick="setUnivers('manger')">🍽️ Se nourrir</button>
      <button type="button" id="u-domicile" onclick="setUnivers('domicile')">🏠 Domicile</button>
      <button type="button" id="u-pro" onclick="setUnivers('pro')">💼 Pro</button>
      <button type="button" id="u-sejour" onclick="setUnivers('sejour')">✈️ Séjour</button>
    </div>
  </div>

  <div>
    <label>CATÉGORIE *</label>
    <select id="categorie">
      <option value="">D'abord choisis l'univers...</option>
    </select>
  </div>

  <div>
    <label>TITRE DE VOTRE ANNONCE *</label>
    <input id="titre" placeholder="Ex: Plombier rapide à Calavi - Fuites, robinets, installation">
  </div>

  <div>
    <label>DESCRIPTION DÉTAILLÉE *</label>
    <textarea id="description" placeholder="Ex: Je suis plombier à Godomey depuis 5 ans. Je répare fuites, je change robinets, j'installe douche et WC. Je me déplace chez vous. Devis gratuit dans le chat..."></textarea>
  </div>

  <div>
    <label>TYPE DE PRIX *</label>
    <div class="toggle">
      <button type="button" id="btnFixe" onclick="setPrixType(true)">💰 Prix fixe</button>
      <button type="button" id="btnDiscuter" class="active" onclick="setPrixType(false)">💬 À discuter</button>
    </div>
  </div>

  <div id="blocPrix" style="display:none">
    <label>PRIX INDICATIF (FCFA)</label>
    <input id="prix" type="number" placeholder="Ex: 15000">
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div>
      <label>PAYS *</label>
      <select id="pays">
        <option value="Bénin">🇧🇯 Bénin</option>
        <option value="Togo">🇹🇬 Togo</option>
        <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
        <option value="Sénégal">🇸🇳 Sénégal</option>
        <option value="Cameroun">🇨🇲 Cameroun</option>
        <option value="Nigeria">🇳🇬 Nigeria</option>
        <option value="Ghana">🇬🇭 Ghana</option>
        <option value="France">🇫🇷 France</option>
        <option value="Canada">🇨🇦 Canada</option>
      </select>
    </div>
    <div>
      <label>VILLE *</label>
      <input id="ville" placeholder="Ex: Calavi">
    </div>
  </div>

  <div>
    <label>LOCALITÉ / QUARTIER *</label>
    <input id="localite" placeholder="Ex: Godomey, Cococodji...">
  </div>

  <div>
    <label>PHOTO DE VOTRE TRAVAIL (lien - optionnel)</label>
    <input id="photo" placeholder="Collez un lien photo de votre travail">
  </div>

  <div id="msg" class="msg"></div>
  <button class="btn" id="btnPublier" onclick="publier()">Publier mon annonce →</button>
  <small>⚠️ Votre annonce sera en attente de validation.<br>Elle apparaîtra sur l'accueil après validation. Pas de faux service = pas de bannissement.</small>
</div>
</div>

<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let universChoisi = "";
let prixFixe = false;

const categories = {
  manger: ["Traiteur","Restaurant / Maquis","Livraison repas","Pâtisserie","Jus / Boissons"],
  domicile: ["Ménage / Repassage","Plomberie","Électricité","Climatisation","Menuiserie","Peinture","Jardinage","Mécanique"],
  pro: ["Design / Graphisme","Développement Web","Marketing / Réseaux sociaux","Comptabilité","Traduction","Cours / Coaching","Montage vidéo"],
  sejour: ["Hôtel / Appartement","Location voiture","Guide touristique","Transport / Moto","Location salle"]
};

function setUnivers(u){
  universChoisi = u;
  ['manger','domicile','pro','sejour'].forEach(k=>{
    document.getElementById('u-'+k).classList.toggle('active', k===u);
  });
  const sel = document.getElementById('categorie');
  sel.innerHTML = '<option value="">Choisir une catégorie...</option>' + categories[u].map(c=>`<option value="${c}">${c}</option>`).join('');
}

function setPrixType(fixe){
  prixFixe = fixe;
  document.getElementById('btnFixe').classList.toggle('active', fixe);
  document.getElementById('btnDiscuter').classList.toggle('active', !fixe);
  document.getElementById('blocPrix').style.display = fixe ? 'block' : 'none';
}

function showMsg(txt, ok){
  const m = document.getElementById('msg');
  m.textContent = txt;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}

// Pré-remplir avec le profil
const uid = localStorage.getItem('rocy_user_id');
if(!uid){ showMsg('Connecte-toi d’abord pour publier une annonce.', false); setTimeout(()=>location.href='connexion.html',1500); }
else {
  document.getElementById('pays').value = localStorage.getItem('rocy_user_pays') || 'Bénin';
  document.getElementById('ville').value = localStorage.getItem('rocy_user_ville') || '';
  document.getElementById('localite').value = localStorage.getItem('rocy_user_localite') || '';
}

async function publier(){
  const titre = document.getElementById('titre').value.trim();
  const description = document.getElementById('description').value.trim();
  const categorie = document.getElementById('categorie').value;
  const pays = document.getElementById('pays').value;
  const ville = document.getElementById('ville').value.trim();
  const localite = document.getElementById('localite').value.trim();
  const photo = document.getElementById('photo').value.trim();
  const prix = document.getElementById('prix').value;
  const btn = document.getElementById('btnPublier');

  if(!universChoisi || !categorie || !titre || !description || !ville || !localite){ showMsg('Remplis Univers + Catégorie + Titre + Description + Ville + Localité', false); return; }
  if(prixFixe && (!prix || Number(prix)<=0)){ showMsg('Mets un prix fixe supérieur à 0', false); return; }

  btn.disabled = true; btn.textContent = 'Publication...';

  const {data, error} = await supabase.from('annonces').insert([{
    prestataire_id: uid,
    univers: universChoisi,
    categorie, titre, description,
    prix_fixe: prixFixe,
    prix_indicatif: prixFixe ? Number(prix) : (prix ? Number(prix) : 0),
    pays, ville, localite,
    photo_url: photo || null,
    status: 'en_attente'
  }]).select().single();

  if(error){ showMsg('Erreur : ' + error.message, false); btn.disabled=false; btn.textContent='Publier mon annonce →'; return; }

  showMsg('✅ Annonce envoyée ! En attente de validation. Tu seras notifié.', true);
  setTimeout(()=> location.href='dashboard-prestataire.html', 1500);
}
</script>
</body>
</html>
