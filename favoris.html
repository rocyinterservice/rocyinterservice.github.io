<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Favoris - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:520px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 12px} h1 span{color:#f59e0b}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0}
.btn{width:100%;background:#f59e0b;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
</style></head>
<body><div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>❤️ Mes <span>Favoris</span></h1>
<div id="liste">Chargement...</div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function charger(){
  const uid = localStorage.getItem('rocy_user_id');
  if(!uid){location.href='connexion.html';return;}
  const favs = JSON.parse(localStorage.getItem('rocy_favoris')||'[]');
  if(!favs.length){document.getElementById('liste').innerHTML='<p style="text-align:center;color:#64748b;padding:20px;background:#fff;border-radius:16px">Aucun favori pour l’instant.<br><br><button class="btn" onclick="location.href=\'index.html\'">Découvrir</button></p>';return;}
  const {data} = await supabase.from('annonces').select('*, profiles(nom)').in('id', favs);
  document.getElementById('liste').innerHTML = (data||[]).map(a=>`<div class="card"><h3>${a.titre}</h3><p>👤 ${a.profiles?.nom} • ${a.categorie}<br>📍 ${a.localite} - ${a.ville}<br>${a.prix_indicatif>0?Number(a.prix_indicatif).toLocaleString()+' FCFA':'💬 Prix à discuter'}</p><button class="btn" onclick="voir('${a.id}','${a.univers}')">Voir</button><button class="btn btn-dark" onclick="retirer('${a.id}')">Retirer des favoris</button></div>`).join('');
}
function voir(id,univers){ if(univers==='immobilier'){localStorage.setItem('fiche_parcelle_id',id); location.href='fiche-parcelle.html';} else {localStorage.setItem('fiche_prestataire_id',id); location.href='fiche-prestataire.html';} }
function retirer(id){let f=JSON.parse(localStorage.getItem('rocy_favoris')||'[]'); f=f.filter(x=>x!==id); localStorage.setItem('rocy_favoris',JSON.stringify(f)); charger();}
charger();
</script></body></html>
