<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes commandes - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px} header b span{color:#f59e0b}
header button{background:#fff;border:1px solid #e2e8f0;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:12px}
h1{font-size:22px;margin:16px 0 4px}
p.sub{color:#64748b;font-size:13px;margin-bottom:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px}
.card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.badge.attente{background:#fef3c7;color:#92400e}
.badge.paye{background:#dbeafe;color:#1e40af}
.badge.cours{background:#e0e7ff;color:#3730a3}
.badge.valide{background:#dcfce7;color:#166534}
.badge.litige{background:#fee2e2;color:#991b1b}
.btn{width:100%;background:#f59e0b;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#fee2e2;color:#991b1b}
.section h2{font-size:17px;margin:18px 0 10px}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:20px;text-align:center;color:#64748b;font-size:13px}
.steps{display:flex;gap:4px;margin:10px 0}
.step{flex:1;text-align:center;font-size:10px;padding:6px 2px;border-radius:8px;background:#f1f5f9;color:#94a3b8}
.step.active{background:#0f172a;color:#fff}
.step.done{background:#dcfce7;color:#166534}
</style>
</head>
<body>
<div class="top">
<header>
  <b>Rocy<span>inter</span></b>
  <div style="display:flex;gap:6px">
    <button onclick="location.href='index.html'">Accueil</button>
    <button onclick="deconnecter()">Déconnexion</button>
  </div>
</header>

<h1>Bonjour <span id="nomUser">Client</span> 👋</h1>
<p class="sub">Suivez vos commandes en temps réel. Votre argent est en sécurité jusqu'à la fin du service.</p>

<button class="btn" onclick="location.href='index.html'">🔍 Trouver un service</button>

<div class="section">
  <h2>📦 Mes commandes</h2>
  <div id="listeCommandes"></div>
</div>

<div class="section">
  <h2>💬 Mes conversations</h2>
  <div id="listeConvs"></div>
</div>
</div>

<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const uid = localStorage.getItem('rocy_user_id');
const nom = localStorage.getItem('rocy_user_nom') || 'Client';
if(!uid){ alert('Connecte-toi d’abord.'); location.href='connexion.html'; }
document.getElementById('nomUser').textContent = nom;

function deconnecter(){ localStorage.clear(); location.href='index.html'; }

function badgeStatus(s){
  if(s==='en_attente') return '<span class="badge attente">⏳ En attente</span>';
  if(s==='paye') return '<span class="badge paye">💳 Payé - Bloqué</span>';
  if(s==='en_cours') return '<span class="badge cours">🔧 En cours</span>';
  if(s==='valide') return '<span class="badge valide">✅ Validé</span>';
  if(s==='libere') return '<span class="badge valide">💰 Libéré</span>';
  if(s==='litige') return '<span class="badge litige">⚠️ Litige</span>';
  return `<span class="badge attente">${s}</span>`;
}
function stepsHtml(s){
  const order = ['en_attente','paye','en_cours','valide','libere'];
  const idx = order.indexOf(s);
  const labels = ['Créée','Payée','En cours','Validée','Libérée'];
  return `<div class="steps">${labels.map((l,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'active':''}">${l}</div>`).join('')}</div>`;
}

async function charger(){
  const {data: cmds} = await supabase.from('commandes').select('*, annonces(titre)').eq('client_id', uid).order('created_at',{ascending:false});
  const box = document.getElementById('listeCommandes');
  if(!cmds || cmds.length===0){
    box.innerHTML = `<div class="empty">Aucune commande pour l'instant.<br>Trouvez un service, discutez, créez une commande.</div>`;
  } else {
    box.innerHTML = cmds.map(c=>`
    <div class="card">
      ${badgeStatus(c.status)}
      <h3 style="margin-top:8px">${c.titre}</h3>
      <p>📍 ${c.localite || ''} - ${c.ville || ''}<br>
      Total : <b>${Number(c.montant_total).toLocaleString()} FCFA</b> • Acompte : ${Number(c.acompte||0).toLocaleString()} FCFA<br>
      Prestataire reçoit : ${Number(c.montant_prestataire).toLocaleString()} FCFA (après commission 12%)</p>
      ${stepsHtml(c.status)}
      ${c.status==='en_attente' ? `<button class="btn btn-green" onclick="payer('${c.id}')">💳 Payer maintenant (Simulé)</button>` : ''}
      ${c.status==='en_cours' ? `<button class="btn btn-green" onclick="valider('${c.id}')">✅ Valider le service terminé</button>` : ''}
      ${c.status==='paye' ? `<button class="btn btn-dark" onclick="demarrer('${c.id}')">🔧 Confirmer le début du service</button>` : ''}
      <button class="btn btn-dark" onclick="voirConversation('${c.conversation_id}','${c.annonce_id}')">Ouvrir le chat</button>
      ${c.status==='valide' ? `<button class="btn" onclick="noter('${c.id}','${c.prestataire_id}')">⭐ Noter le prestataire</button>` : ''}
    </div>`).join('');
  }

  const {data: convs} = await supabase.from('conversations').select('*, annonces(titre)').eq('client_id', uid).order('created_at',{ascending:false});
  const boxV = document.getElementById('listeConvs');
  if(!convs || convs.length===0){
    boxV.innerHTML = `<div class="empty">Aucune conversation pour l'instant.</div>`;
  } else {
    boxV.innerHTML = convs.map(cv=>`<div class="card"><b>${cv.annonces?.titre || 'Discussion'}</b><p>${new Date(cv.created_at).toLocaleDateString('fr-FR')}</p><button class="btn btn-dark" onclick="voirConversation('${cv.id}','${cv.annonce_id}')">Ouvrir le chat</button></div>`).join('');
  }
}

async function payer(id){
  if(!confirm('Simuler le paiement ? En vrai, ici ce sera Mobile Money / Carte.')) return;
  await supabase.from('commandes').update({status:'paye'}).eq('id', id);
  alert('✅ Paiement simulé ! Argent bloqué en escrow.');
  charger();
}
async function demarrer(id){
  await supabase.from('commandes').update({status:'en_cours'}).eq('id', id);
  charger();
}
async function valider(id){
  if(!confirm('Le service est bien terminé ?')) return;
  await supabase.from('commandes').update({status:'valide'}).eq('id', id);
  alert('✅ Service validé ! Le prestataire sera payé. Tu peux le noter.');
  charger();
}
function noter(cmdId, prestaId){
  const note = prompt('Note de 1 à 5 pour ce prestataire :', '5');
  if(!note) return;
  const com = prompt('Ton commentaire :', 'Très bon service, merci !');
  supabase.from('avis').insert([{commande_id: cmdId, client_id: uid, prestataire_id: prestaId, note: parseInt(note), commentaire: com}]).then(()=>{
    alert('⭐ Merci pour ton avis !');
    charger();
  });
}
function voirConversation(convId, annonceId){
  // On a besoin du prestataire_id, on le récupère via la commande ou la conversation
  supabase.from('conversations').select('*').eq('id', convId).single().then(({data})=>{
    if(data) localStorage.setItem('chat_prestataire', data.prestataire_id);
    localStorage.setItem('chat_annonce', annonceId);
    location.href='chat.html';
  });
}

charger();
</script>
</body>
</html>
