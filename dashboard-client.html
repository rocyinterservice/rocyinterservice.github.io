<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="dashboardClientTitre">Mes commandes - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.top{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:16px 0 4px}
p.sub{color:#64748b;font-size:13px;margin-bottom:14px;line-height:1.5}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px}
.card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.badge.attente{background:#fef3c7;color:#92400e}
.badge.paye{background:#dbeafe;color:#1e40af}
.badge.cours{background:#e0e7ff;color:#3730a3}
.badge.valide{background:#dcfce7;color:#166534}
.badge.litige{background:#fee2e2;color:#991b1b}
.btn{width:100%;background:#f59e0b;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#fee2e2;color:#991b1b}
.btn-gris{background:#f1f5f9;color:#111}
.section h2{font-size:17px;margin:18px 0 10px}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:20px;text-align:center;color:#64748b;font-size:13px}
.steps{display:flex;gap:4px;margin:10px 0}
.step{flex:1;text-align:center;font-size:10px;padding:6px 2px;border-radius:8px;background:#f1f5f9;color:#94a3b8}
.step.active{background:#0f172a;color:#fff}
.step.done{background:#dcfce7;color:#166534}
.profilBox{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;gap:12px;align-items:center}
.profilBox img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#f1f5f9}
.profilBox .info{flex:1}
.profilBox .info b{font-size:15px}
.profilBox .info span{font-size:12px;color:#64748b;display:block;margin-top:2px}
</style>
</head>
<body>
<div class="top">
<h1><span data-i18n="bonjour">Bonjour</span> <span id="nomUser">Client</span> 👋</h1>
<p class="sub" data-i18n="dashboardClientSous">Suivez vos commandes en temps réel. Votre argent est en sécurité jusqu'à la fin du service.</p>

<!-- PROFIL + QUARTIER -->
<div class="profilBox" id="profilBox">
  <img id="photoProfil" src="" alt="" onerror="this.style.display='none'">
  <div class="info">
    <b id="profilNom">Mon Profil</b>
    <span id="profilQuartier">📍 Quartier : ...</span>
    <span id="profilBadge">⏳ Vérification...</span>
  </div>
</div>
<button class="btn btn-dark" onclick="location.href='profil.html'">👤 Mon Profil</button>
<button class="btn btn-gris" id="btnVerif" onclick="location.href='verification.html'" style="display:none">📍 Faire vérifier mon quartier</button>

<button class="btn" onclick="location.href='index.html'">🔍 <span data-i18n="trouverService">Trouver un service</span></button>
<button class="btn btn-gris" onclick="location.href='inscription.html?type=prestataire'">💼 <span data-i18n="devenirPresta">Devenir Fournisseur aussi ? Publier mes services →</span></button>
<div class="section">
  <h2>📦 <span data-i18n="mesCommandes">Mes commandes</span></h2>
  <div id="listeCommandes"></div>
</div>
<div class="section">
  <h2>💬 <span data-i18n="mesConversations">Mes conversations</span></h2>
  <div id="listeConvs"></div>
</div>
<button class="btn btn-dark" style="margin-top:16px" onclick="deconnecter()" data-i18n="deconnexion">Déconnexion</button>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = sb;
let uid = null;
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n || 0).toLocaleString('fr-FR'); }
async function getUtilisateurSecurise(){
  const {data:{user}, error} = await sb.auth.getUser();
  if(error || !user) return null;
  return user;
}
async function deconnecter(){
  await sb.auth.signOut();
  const langue = localStorage.getItem('rocy_langue');
  localStorage.clear();
  if(langue) localStorage.setItem('rocy_langue', langue);
  location.href='index.html';
}
function badgeStatus(s){
  if(s==='en_attente') return '<span class="badge attente">⏳ En attente</span>';
  if(s==='paye') return '<span class="badge paye">💳 Payé - Bloqué</span>';
  if(s==='en_cours') return '<span class="badge cours">🔧 En cours</span>';
  if(s==='valide') return '<span class="badge valide">✅ Validé</span>';
  if(s==='libere') return '<span class="badge valide">💰 Libéré</span>';
  if(s==='litige') return '<span class="badge litige">⚠️ Litige</span>';
  return `<span class="badge attente">${esc(s)}</span>`;
}
function stepsHtml(s){
  if(s==='litige') return `<p style="color:#991b1b">⚠️ Litige en cours - Argent bloqué. L'Admin va trancher.</p>`;
  const order = ['en_attente','paye','en_cours','valide','libere'];
  const idx = order.indexOf(s);
  const labels = ['Créée','Payée','En cours','Validée','Libérée'];
  return `<div class="steps">${labels.map((l,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'active':''}">${esc(l)}</div>`).join('')}</div>`;
}
function texteCommission(c){
  if(c.univers==='domicile') return `Commission 8% : ${fmt(c.commission)} FCFA`;
  if(c.univers==='pro') return `Commission 5 000 FCFA fixe`;
  if(c.univers==='manger') return `Commission 12% : ${fmt(c.commission)} FCFA`;
  if(c.univers==='sejour') return `Commission 12% : ${fmt(c.commission)} FCFA`;
  if(c.univers==='livreur') return `Commission 20% (Livreur 80%) : ${fmt(c.commission)} FCFA`;
  if(c.univers==='immobilier'){
    const t = String(c.titre||'').toLowerCase();
    if(t.includes('parcelle') || t.includes('vente') || t.includes('terrain')) return `Commission Parcelle 10 000 + 2% plafonné 200 000 : ${fmt(c.commission)} FCFA`;
    return `Commission Location 50% d'un mois : ${fmt(c.commission)} FCFA`;
  }
  return `Commission : ${fmt(c.commission)} FCFA`;
}
async function charger(){
  const user = await getUtilisateurSecurise();
  if(!user){ location.href='connexion.html'; return; }
  uid = user.id;
  const {data: profil} = await sb.from('profiles')
    .select('id, nom, full_name, nom_entreprise, type_fournisseur, type_compte, role, quartier, localite, ville, quartier_verifie, verification_quartier, photo_url, avatar_url, photo_profil_url')
    .eq('id', uid).maybeSingle();
  if(!profil){ location.href='connexion.html'; return; }
  const roleReel = String(profil.type_compte || profil.role || profil.type_fournisseur || '').toLowerCase();
  if(['prestataire','livreur','fournisseur','professionnel','entreprise','pro'].includes(roleReel)){ location.href='dashboard-prestataire.html'; return; }
  if(roleReel === 'admin'){ location.href='admin.html'; return; }
  if(roleReel !== 'client'){ location.href='connexion.html'; return; }
  document.getElementById('nomUser').textContent = profil.nom || profil.full_name || 'Client';
  // --- PROFIL / QUARTIER ---
  const quartier = profil.quartier || profil.localite || '';
  const photo = profil.photo_profil_url || profil.photo_url || profil.avatar_url || '';
  document.getElementById('profilNom').textContent = profil.nom || profil.full_name || 'Mon Profil';
  document.getElementById('profilQuartier').textContent = '📍 Quartier : ' + (quartier || 'Non rempli');
  const badgeEl = document.getElementById('profilBadge');
  const btnVerif = document.getElementById('btnVerif');
  if(profil.quartier_verifie === true || profil.verification_quartier === 'valide' || profil.verification_quartier === 'verifie'){
    badgeEl.textContent = '✅ Vérifié à ' + quartier;
    badgeEl.style.color = '#166534';
    btnVerif.style.display = 'none';
  } else if(profil.verification_quartier === 'en_attente' || profil.verification_quartier === 'demande_envoyee'){
    badgeEl.textContent = '⏳ Vérification en attente pour ' + quartier;
    badgeEl.style.color = '#1e40af';
    btnVerif.style.display = 'none';
  } else {
    badgeEl.textContent = '❌ Non vérifié - Fais vérifier ton quartier';
    badgeEl.style.color = '#991b1b';
    btnVerif.style.display = 'block';
  }
  if(photo){ const img=document.getElementById('photoProfil'); img.src=photo; img.style.display='block'; }
  const {data: cmds} = await sb.from('commandes')
    .select('id, titre, prestataire_id, conversation_id, annonce_id, status, univers, commission, montant_total, montant_prestataire, localite, ville, created_at')
    .eq('client_id', uid).order('created_at',{ascending:false});
  const box = document.getElementById('listeCommandes');
  if(!cmds || cmds.length===0){
    box.innerHTML = `<div class="empty">Aucune commande pour l'instant.<br>Trouvez un service, discutez, créez une commande.</div>`;
  } else {
    box.innerHTML = cmds.map(c=>`
    <div class="card">
      ${badgeStatus(c.status)}
      <h3 style="margin-top:8px">${esc(c.titre)}</h3>
      <p>📍 ${esc(c.localite || '')} - ${esc(c.ville || '')}<br>
      Total : <b>${fmt(c.montant_total)} FCFA</b><br>
      Prestataire reçoit : ${fmt(c.montant_prestataire)} FCFA (${esc(texteCommission(c))})<br>
      <span style="color:#16a34a;font-weight:700">🔒 Escrow : argent bloqué chez Rocyinter jusqu'à validation</span></p>
      ${stepsHtml(c.status)}
      ${c.status==='en_attente' ? `<button class="btn btn-green" onclick="payer('${esc(c.id)}')">💳 Payer en escrow sécurisé</button>` : ''}
      ${c.status==='paye' ? `<button class="btn btn-dark" onclick="demarrer('${esc(c.id)}')">🔧 Confirmer le début du service</button>` : ''}
      ${c.status==='en_cours' ? `<button class="btn btn-green" onclick="valider('${esc(c.id)}')">✅ Valider le service terminé</button>` : ''}
      ${c.status==='valide' ? `<button class="btn" onclick="noter('${esc(c.id)}','${esc(c.prestataire_id)}')">⭐ Noter le prestataire</button><p style="color:#166534">⏳ Libération dans 48h pour Services, lundi pour Manger / Hôtels.</p>` : ''}
      ${['paye','en_cours'].includes(c.status) ? `<button class="btn btn-red" onclick="signalerLitige('${esc(c.id)}')">⚠️ Signaler un litige</button>` : ''}
      <button class="btn btn-dark" onclick="voirConversation('${esc(c.conversation_id)}','${esc(c.annonce_id)}')">Ouvrir le chat</button>
    </div>`).join('');
  }
  const {data: convsBrutes} = await sb.from('conversations')
    .select('id, client_id, prestataire_id, annonce_id, created_at, annonces(titre)')
    .eq('client_id', uid).order('created_at',{ascending:false});
  const convs = (convsBrutes||[]).filter(cv => String(cv.client_id)!==String(cv.prestataire_id));
  const boxV = document.getElementById('listeConvs');
  if(!convs || convs.length===0){
    boxV.innerHTML = `<div class="empty">Aucune conversation pour l'instant.</div>`;
  } else {
    boxV.innerHTML = convs.map(cv=>`<div class="card"><b>${esc(cv.annonces?.titre || 'Discussion')}</b><p>${esc(new Date(cv.created_at).toLocaleDateString('fr-FR'))}</p><button class="btn btn-dark" onclick="voirConversation('${esc(cv.id)}','${esc(cv.annonce_id)}')">Ouvrir le chat</button></div>`).join('');
  }
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
function payer(id){ location.href = 'paiement.html?commande=' + encodeURIComponent(id); }
async function demarrer(id){
  const user = await getUtilisateurSecurise();
  if(!user) return;
  const {error} = await sb.from('commandes').update({status:'en_cours'}).eq('id', id).eq('client_id', user.id).eq('status','paye');
  if(error) alert('Erreur : ' + error.message);
  charger();
}
async function valider(id){
  if(!confirm('Le service est bien terminé ? Après validation, l’argent sera libéré au prestataire.')) return;
  const user = await getUtilisateurSecurise();
  if(!user) return;
  const {error} = await sb.from('commandes').update({status:'valide'}).eq('id', id).eq('client_id', user.id).eq('status','en_cours');
  if(error){ alert('Erreur : ' + error.message); return; }
  alert('✅ Service validé ! Le prestataire sera payé. Tu peux le noter.');
  charger();
}
async function signalerLitige(id){
  const raison = prompt('Décris le problème :', 'Prestataire non venu / travail non terminé...');
  if(!raison || !raison.trim()){ alert('Décris le problème pour ouvrir un litige.'); return; }
  if(raison.trim().length > 500){ alert('Raison trop longue, max 500 caractères.'); return; }
  const user = await getUtilisateurSecurise();
  if(!user) return;
  const {error} = await sb.from('commandes').update({status:'litige', litige_raison: raison.trim()}).eq('id', id).eq('client_id', user.id).in('status',['paye','en_cours']);
  if(error){ alert('Erreur : ' + error.message); return; }
  alert('⚠️ Litige signalé. Argent bloqué. L’Admin va trancher dans la Page Litiges.');
  charger();
}
async function noter(cmdId, prestaId){
  const user = await getUtilisateurSecurise();
  if(!user) return;
  const noteStr = prompt('Note de 1 à 5 pour ce prestataire :', '5');
  const note = parseInt(noteStr);
  if(!note || note<1 || note>5){ alert('Note invalide. Mets un chiffre entre 1 et 5.'); return; }
  const com = prompt('Ton commentaire :', 'Très bon service, merci !') || '';
  if(com.length > 500){ alert('Commentaire trop long, max 500 caractères.'); return; }
  const {data: cmd} = await sb.from('commandes').select('id, status').eq('id', cmdId).eq('client_id', user.id).single();
  if(!cmd || cmd.status !== 'valide'){ alert('Tu ne peux noter que les commandes validées.'); return; }
  const {data: exist} = await sb.from('avis').select('id').eq('commande_id', cmdId).eq('client_id', user.id).maybeSingle();
  if(exist){ alert('Tu as déjà noté cette commande.'); return; }
  const {error} = await sb.from('avis').insert([{commande_id: cmdId, client_id: user.id, prestataire_id: prestaId, note, commentaire: com}]);
  if(error){ alert('Erreur : ' + error.message); return; }
  alert('⭐ Merci pour ton avis !');
  charger();
}
async function voirConversation(convId, annonceId){
  if(!convId || convId==='null' || convId==='undefined'){ alert('Conversation introuvable.'); return; }
  const user = await getUtilisateurSecurise();
  if(!user) return;
  const {data} = await sb.from('conversations').select('id, client_id, prestataire_id').eq('id', convId).eq('client_id', user.id).single();
  if(!data){ alert('Conversation introuvable.'); return; }
  if(String(data.client_id)===String(data.prestataire_id)){ alert('Conversation invalide.'); return; }
  location.href = 'chat.html?conversation=' + encodeURIComponent(convId) + '&annonce=' + encodeURIComponent(annonceId || '');
}
charger();
</script>
</body>
</html>
