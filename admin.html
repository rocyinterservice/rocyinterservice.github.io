<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0f172a;color:#fff;padding:16px}
.top{max-width:700px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px} header b span{color:#f59e0b}
header button{background:#fff;color:#000;border:none;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:12px}
.login{max-width:400px;margin:60px auto;background:#fff;color:#111;border-radius:16px;padding:20px;display:grid;gap:12px}
.login a.btn{background:#f59e0b;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;text-align:center;color:#000;text-decoration:none;display:block}
.login button{padding:12px;border-radius:10px;border:1px solid #e2e8f0;background:#f1f5f9;cursor:pointer;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin:16px 0}
.stat{background:#1e293b;border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:18px;display:block} .stat small{opacity:.6;font-size:11px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#1e293b;color:#fff;border:none;padding:10px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.tabs button.active{background:#f59e0b;color:#000;font-weight:800}
.card{background:#fff;color:#111;border-radius:16px;padding:14px;margin-bottom:12px}
.card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.badge.attente{background:#fef3c7;color:#92400e}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions button{flex:1;padding:10px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;min-width:120px}
.btn-val{background:#16a34a;color:#fff} .btn-rej{background:#fee2e2;color:#991b1b}
.empty{background:#1e293b;border-radius:14px;padding:20px;text-align:center;opacity:.7;font-size:13px}
#main{display:none}
</style></head>
<body><div class="top">
<header><b>Rocy<span>inter</span> Admin</b><button type="button" onclick="window.location.href='index.html'">Voir le site</button></header>
<div class="login" id="loginBox">
<h2 style="text-align:center">🔐 Admin Rocyinter</h2>
<p style="text-align:center;color:#64748b;font-size:13px">Accès réservé à <b>rocyinter@gmail.com</b>.</p>
<p id="adminErreur" style="text-align:center;color:#991b1b;font-size:13px;display:none">⛔ Accès refusé. Ce compte n'est pas Admin.</p>
<a class="btn" href="connexion.html">Se connecter comme Admin →</a>
<button type="button" onclick="window.location.href='index.html'">Retour au site</button>
</div>
<div id="main">
<div style="background:#dcfce7;color:#166534;padding:10px;border-radius:10px;font-size:13px;margin:14px 0;text-align:center">✅ Connecté Admin : <b id="adminEmailAffiche">rocyinter@gmail.com</b> <button type="button" onclick="deconnecterAdmin()" style="background:#fff;border:none;padding:4px 8px;border-radius:999px;cursor:pointer;font-size:11px">Déconnexion</button></div>
<div class="stats"><div class="stat"><b id="sAnnonces">0</b><small>Annonces</small></div><div class="stat"><b id="sCommandes">0</b><small>Commandes</small></div><div class="stat"><b id="sUsers">0</b><small>Utilisateurs</small></div><div class="stat"><b id="sCommission">0 F</b><small>Commissions</small></div></div>
<div class="tabs">
<button type="button" id="tab-annonces" class="active" onclick="setTab('annonces')">📋 Annonces</button>
<button type="button" id="tab-prestataires" onclick="setTab('prestataires')">👷 Prestataires</button>
<button type="button" id="tab-commandes" onclick="setTab('commandes')">💰 Commandes</button>
<button type="button" id="tab-users" onclick="setTab('users')">👥 Utilisateurs</button>
</div>
<div id="contenu"></div>
</div></div>
<script>
const ADMIN_EMAIL='rocyinter@gmail.com';
const supabase=window.supabase.createClient("https://gdwgjsloivrpxxvggxyz.supabase.co","sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF");
let tabActuel='annonces';
async function deconnecterAdmin(){await supabase.auth.signOut();localStorage.clear();window.location.href='connexion.html';}
function afficherLogin(refuse){document.getElementById('loginBox').style.display='grid';document.getElementById('main').style.display='none';if(refuse)document.getElementById('adminErreur').style.display='block';}
function afficherMain(email){document.getElementById('loginBox').style.display='none';document.getElementById('main').style.display='block';document.getElementById('adminEmailAffiche').textContent=email;}
// SÉCURITÉ : la preuve = token Supabase, jamais localStorage
async function verifierAdmin(){
  const {data:{user},error}=await supabase.auth.getUser();
  if(error||!user){afficherLogin(false);return false;}
  const {data:prof,error:perr}=await supabase.from('profiles').select('email,type_compte,role').eq('id',user.id).single();
  if(perr||!prof){afficherLogin(true);return false;}
  const email=String(prof.email||'').toLowerCase().trim();
  const isAdmin=email===ADMIN_EMAIL||prof.type_compte==='admin'||prof.role==='admin';
  if(!isAdmin){afficherLogin(true);return false;}
  localStorage.setItem('rocy_user_id',user.id);localStorage.setItem('rocy_user_email',email);localStorage.setItem('rocy_user_type','admin');localStorage.setItem('rocy_role','admin');
  afficherMain(email);
  return true;
}
async function initAdmin(){try{const ok=await verifierAdmin();if(ok)chargerTout();}catch(e){afficherLogin(false);}}
function setTab(t){tabActuel=t;['annonces','prestataires','commandes','users'].forEach(k=>{document.getElementById('tab-'+k).classList.toggle('active',k===t);});chargerTout();}
async function chargerTout(){
  try{
    const {data:ann}=await supabase.from('annonces').select('*');
    const {data:cmd}=await supabase.from('commandes').select('*');
    const {data:users}=await supabase.from('profiles').select('id,nom,whatsapp,type_compte,statut_validation,categorie_prestataire,localite,ville,pays');
    let comm=0;(cmd||[]).forEach(c=>{if(['paye','en_cours','valide','libere'].includes(c.status))comm+=Number(c.commission||0);});
    document.getElementById('sAnnonces').textContent=ann?.length||0;document.getElementById('sCommandes').textContent=cmd?.length||0;document.getElementById('sUsers').textContent=users?.length||0;document.getElementById('sCommission').textContent=comm.toLocaleString()+' F';
    const box=document.getElementById('contenu');
    if(tabActuel==='annonces'){
      const {data}=await supabase.from('annonces').select('*, profiles(nom, whatsapp)').order('created_at',{ascending:false});
      const enAttente=(data||[]).filter(a=>String(a.status||a.statut||'').toLowerCase()==='en_attente');
      if(!enAttente.length){box.innerHTML=`<div class="empty">✅ Aucune annonce en attente.</div>`;return;}
      box.innerHTML=enAttente.map(a=>`<div class="card"><span class="badge attente">⏳ En attente</span><h3 style="margin-top:8px">${a.titre}</h3><p><b>Prestataire :</b> ${a.profiles?.nom} • ${a.profiles?.whatsapp}<br><b>Catégorie :</b> ${a.categorie} • ${a.univers}<br><b>Lieu :</b> ${a.localite} - ${a.ville} - ${a.pays}<br><b>Description :</b> ${a.description}</p><div class="actions"><button type="button" class="btn-val" onclick="validerAnnonce('${a.id}')">✅ Valider</button><button type="button" class="btn-rej" onclick="rejeterAnnonce('${a.id}')">❌ Rejeter</button></div></div>`).join('');
    }
    if(tabActuel==='prestataires'){
      const {data}=await supabase.from('profiles').select('*').eq('type_compte','prestataire').order('created_at',{ascending:false});
      const enAttente=(data||[]).filter(u=>String(u.statut_validation||u.status_prestataire||'en_attente').toLowerCase()==='en_attente');
      if(!enAttente.length){box.innerHTML=`<div class="empty">✅ Aucun prestataire en attente.</div>`;return;}
      box.innerHTML=enAttente.map(u=>`<div class="card"><h3>${u.nom}</h3><p>WhatsApp : ${u.whatsapp} • 📍 ${u.localite} - ${u.ville} - ${u.pays}<br><b>Catégorie :</b> ${u.categorie_prestataire||'-'}</p><div class="actions"><button type="button" class="btn-val" onclick="validerPrestataire('${u.id}')">✅ Valider</button><button type="button" class="btn-rej" onclick="rejeterPrestataire('${u.id}')">❌ Refuser</button></div></div>`).join('');
    }
    if(tabActuel==='commandes'){
      const {data}=await supabase.from('commandes').select('*').order('created_at',{ascending:false}).limit(50);
      if(!data?.length){box.innerHTML=`<div class="empty">Aucune commande.</div>`;return;}
      box.innerHTML=data.map(c=>`<div class="card"><b>${c.titre}</b> • ${c.status}<p>Total : ${Number(c.montant_total||0).toLocaleString()} FCFA • Commission : ${Number(c.commission||0).toLocaleString()} FCFA<br>📍 ${c.localite} - ${c.ville}</p></div>`).join('');
    }
    if(tabActuel==='users'){
      const {data}=await supabase.from('profiles').select('*').order('created_at',{ascending:false}).limit(100);
      if(!data?.length){box.innerHTML=`<div class="empty">Aucun utilisateur.</div>`;return;}
      box.innerHTML=data.map(u=>`<div class="card"><b>${u.nom}</b> • ${u.type_compte}<p>WhatsApp : ${u.whatsapp} • 📍 ${u.localite} - ${u.ville} - ${u.pays}</p></div>`).join('');
    }
  }catch(e){document.getElementById('contenu').innerHTML=`<div class="empty">Erreur : ${e.message}</div>`;}
}
async function validerAnnonce(id){const {error}=await supabase.from('annonces').update({status:'valide',statut:'valide'}).eq('id',id);if(error)alert(error.message);else{alert('✅ Annonce validée');chargerTout();}}
async function rejeterAnnonce(id){if(!confirm('Rejeter ?'))return;await supabase.from('annonces').update({status:'rejete',statut:'rejete'}).eq('id',id);chargerTout();}
async function validerPrestataire(id){await supabase.from('profiles').update({statut_validation:'valide',status_prestataire:'valide'}).eq('id',id);alert('✅ Prestataire validé');chargerTout();}
async function rejeterPrestataire(id){if(!confirm('Refuser ?'))return;await supabase.from('profiles').update({statut_validation:'rejete',status_prestataire:'rejete'}).eq('id',id);chargerTout();}
document.addEventListener('DOMContentLoaded',initAdmin);
if(document.readyState!=='loading')initAdmin();
</script></body></html>
