<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Se nourrir - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:560px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:13px;margin-bottom:12px}
.filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.filtres button{white-space:nowrap;background:#fff;border:1px solid #e2e8f0;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.filtres button.active{background:#0f172a;color:#fff}
input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:10px 0}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.btn{width:100%;background:#f59e0b;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>🍽️ Se <span>nourrir</span></h1>
<p class="sub">Vrais traiteurs, restos, livraison repas validés par Rocyinter. Commission 12% - Espèces à la livraison + 500 FCFA possible.</p>
<div class="filtres" id="filtres">
  <button class="active" data-cat="" onclick="setCat('')">Tous</button>
</div>
<input id="search" placeholder="🔍 Chercher : Calavi, Godomey, Traiteur..." oninput="charger()">
<div id="liste">Chargement...</div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let catActuelle = '';
let toutesAnnonces = [];

function setCat(c){
  catActuelle = c;
  document.querySelectorAll('.filtres button').forEach(b=> b.classList.toggle('active', b.dataset.cat === c));
  afficher();
}

// CORRECTION V3 : On construit les filtres à partir des catégories qui existent vraiment
// Si un prestataire a écrit "Grillades", le bouton "Grillades" apparaît tout seul
function construireFiltres(){
  const cats = [...new Set(toutesAnnonces.map(a=>a.categorie).filter(Boolean))].sort();
  const box = document.getElementById('filtres');
  box.innerHTML = `<button class="active" data-cat="" onclick="setCat('')">Tous</button>` + cats.map(c=>`<button data-cat="${c}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('');
  // Remet le bon bouton actif
  document.querySelectorAll('.filtres button').forEach(b=> b.classList.toggle('active', b.dataset.cat === catActuelle));
}

function afficher(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const box = document.getElementById('liste');
  let list = toutesAnnonces;
  if(catActuelle) list = list.filter(a=> a.categorie === catActuelle);
  if(q) list = list.filter(a=>(a.titre+' '+a.ville+' '+a.localite+' '+a.categorie+' '+(a.description||'')).toLowerCase().includes(q));
  if(!list.length){ box.innerHTML=`<p style="text-align:center;color:#64748b;padding:20px">Aucun service pour l'instant dans cet univers.<br><button class="btn" onclick="location.href='creer-annonce.html'">Devenir prestataire</button></p>`; return; }
  box.innerHTML = list.map(a=>`<div class="card"><h3>${a.titre}</h3><p>👤 ${a.profiles?.nom} • ${a.categorie}<br>📍 ${a.localite} - ${a.ville}<br>${a.prix_fixe ? Number(a.prix_indicatif).toLocaleString()+' FCFA' : (a.prix_indicatif>0 ? 'À partir de '+Number(a.prix_indicatif).toLocaleString()+' FCFA' : 'Prix à discuter')}</p><button class="btn" onclick="voirPresta('${a.prestataire_id}')">Voir le prestataire</button><button class="btn btn-dark" onclick="discuter('${a.prestataire_id}','${a.id}')">💬 Discuter</button></div>`).join('');
}

async function charger(){
  const {data} = await supabase.from('annonces').select('*, profiles(nom, whatsapp)').eq('univers','manger').eq('status','valide').order('created_at',{ascending:false});
  toutesAnnonces = data || [];
  construireFiltres();
  afficher();
}
function voirPresta(id){ localStorage.setItem('fiche_prestataire_id', id); location.href='fiche-prestataire.html'; }
function discuter(prestaId, annonceId){ 
  if(!localStorage.getItem('rocy_user_id')){ location.href='connexion.html'; return; }
  localStorage.setItem('chat_prestataire', prestaId); localStorage.setItem('chat_annonce', annonceId); location.href='chat.html'; 
}
charger();
</script>
</body>
</html>
