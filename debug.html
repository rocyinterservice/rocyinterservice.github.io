<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head>
<body style="font-family:sans-serif;padding:16px">
<h3>DEBUG CONNEXION</h3>
<input id="em" type="email" value="rocyinter@gmail.com" style="width:100%;padding:12px;margin-bottom:8px">
<input id="pw" type="password" placeholder="Mot de passe" style="width:100%;padding:12px;margin-bottom:8px">
<button onclick="test()" style="width:100%;padding:14px;background:#f59e0b;border:none;font-weight:800">TESTER</button>
<pre id="res" style="white-space:pre-wrap;background:#f1f5f9;padding:12px;margin-top:12px;border-radius:10px"></pre>
<script>
const sb = window.supabase.createClient("https://gdwgjsloivrpxxvggxyz.supabase.co","sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF");
async function test(){
  const res=document.getElementById('res');
  res.textContent='Test en cours...';
  const email=document.getElementById('em').value.trim().toLowerCase();
  const password=document.getElementById('pw').value;
  const {data:login,error:errLogin}=await sb.auth.signInWithPassword({email,password});
  if(errLogin||!login?.user){ res.textContent='LOGIN ERREUR:\n'+JSON.stringify(errLogin,null,2); return; }
  res.textContent='LOGIN OK, id='+login.user.id+'\nTest profil...';
  const {data:prof,error:perr}=await sb.from('profiles').select('id,nom,email,whatsapp,phone,type_compte,type_fournisseur,pays,ville,quartier').eq('id',login.user.id).single();
  res.textContent='LOGIN OK id='+login.user.id+'\n\nPROF:\n'+JSON.stringify(prof,null,2)+'\n\nERREUR PROF:\n'+JSON.stringify(perr,null,2);
}
</script></body></html>
