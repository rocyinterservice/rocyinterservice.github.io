<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="ficheBienTitre">Bien - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:520px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-top:14px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card img{width:100%;height:220px;object-fit:cover;background:#e2e8f0}
.body{padding:16px} .body p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.6}
.btn{width:100%;background:#f59e0b;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;margin-top:10px}
.btn-dark{background:#0f172a;color:#fff}
.btn-mine{background:#e2e8f0;color:#64748b;cursor:not-allowed}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#dcfce7;color:#166534}
.info{background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;margin-top:12px;line-height:1.6}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:24px;text-align:center;color:#64748b;margin-top:14px}
.info-escrow{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;color:#92400e;margin-top:12px}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="history.back()">← <span data-i18n="retour">Retour</span></div>
<div id="contenu">Chargement...</div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = sb;
const annonceId = localStorage.getItem('fiche_parcelle_id');
let moiId = '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function estValide(a){
  const s = String(a.status || a.statut || '').toLowerCase().trim();
  if(!s) return true;
  return s==='valide' || s==='valid' || s==='publie' || s==='publié' || s==='publiee' || s==='actif' || s==='active';
}
async function charger(){
  const {data:{user}} = await sb.auth.getUser();
  moiId = user?.id || '';
  if(!annonceId){document.getElementById('contenu').innerHTML='<div class="empty">Bien introuvable.<br><br><button class="btn btn-dark" onclick="location.href=\'immobilier.html\'">Voir Immobilier</button></div>';return;}
  const {data:a} = await sb.from('annonces').select('id, titre, categorie, univers, description, prix_indicatif, prix, montant, photo_url, image_url, photo, localite, ville, pays, status, statut, prestataire_id, user_id, profiles_id, profiles(nom, whatsapp)').eq('id',annonceId).maybeSingle();
  if(!a){document.getElementById('contenu').innerHTML='<div class="empty">Bien introuvable.<br><br><button class="btn btn-dark" onclick="location.href=\'immobilier.html\'">Voir Immobilier</button></div>';return;}
  if(!estValide(a)){
    document.getElementById('contenu').innerHTML = `<div class="empty"><b>Bien en cours de vérification</b><br>Ce bien n'est pas encore validé par Rocyinter.<br><br><button class="btn btn-dark" onclick="location.href='immobilier.html'">Voir d'autres biens</button></div>`;
    return;
  }
  const img = a.photo_url || a.image_url || a.photo || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800&q=80';
  const estParcelle = (a.categorie||'').toLowerCase().includes('parcelle');
  const prestaId = a.prestataire_id || a.user_id || a.profiles_id || '';
  const nomPresta = a.profiles?.nom || 'Prestataire';
  const lieu = [a.localite, a.ville, a.pays].filter(Boolean).join(' - ');
  const prixTxt = (a.prix_indicatif||a.prix||a.montant||0)>0 ? Number(a.prix_indicatif||a.prix||a.montant).toLocaleString()+' FCFA' : '💬 Prix à discuter';
  const cestMoi = prestaId && moiId && String(prestaId)===String(moiId);
  const btnChat = cestMoi
    ? `<button class="btn btn-mine" disabled>C'est ton annonce</button>`
    : `<button class="btn" onclick="discuter()">💬 Discuter avec ${esc(nomPresta)}</button>`;
  document.getElementById('contenu').innerHTML = `
  <div class="card"><img src="${esc(img)}" onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800&q=80'"><div class="body">
  <span class="badge">✅ Vérifié</span> <span style="font-size:11px;color:#94a3b8">${esc(a.categorie)} • ${esc(a.univers)}</span>
  <h1 style="font-size:20px;margin:8px 0">${esc(a.titre)}</h1>
  <p>👤 ${esc(nomPresta)}<br>📍 ${esc(lieu)}<br><b style="color:#111;font-size:16px">${esc(prixTxt)}</b></p>
  <p>${esc(a.description)}</p>
  <div class="info">${estParcelle ? '📜 <b>Vente Parcelle :</b> Réservation 10 000 FCFA pour 30 jours. Reste devant notaire, pas en escrow. Commission 2% plafonnée à 200 000 FCFA.<br>⚠️ Demande toujours le titre foncier / document avant de payer.' : '🏠 <b>Location :</b> 50% d\'un mois en escrow pour bloquer. Libération après visite et signature. Payé par le propriétaire, une fois.'}</div>
  ${btnChat}
  <button class="btn btn-dark" onclick="voirPresta()">Voir le prestataire</button>
  <div class="info-escrow">🔒 Ne paie jamais en dehors de Rocyinter. Discute ici, paie via Escrow.</div>
  </div></div>`;
  window._a = a;
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
async function discuter(){
  const {data:{user}} = await sb.auth.getUser();
  const uid = user?.id;
  const t = window.rocyT || (k=>k);
  if(!uid){ alert(t('connectePourCommander')); location.href='connexion.html'; return; }
  const {data: profil} = await sb.from('profiles').select('type_compte, role').eq('id', uid).maybeSingle();
  const type = String(profil?.type_compte || profil?.role || '').toLowerCase();
  if(type==='admin'){ alert('Admin : tu ne peux pas chatter, tu gères dans Admin.'); return; }
  const a = window._a; if(!a) return;
  const prestaId = a.prestataire_id || a.user_id || a.profiles_id || '';
  if(!prestaId){ alert('Annonce sans prestataire.'); return; }
  if(String(prestaId)===String(uid)){ alert("C'est ton annonce. Tu ne peux pas te parler à toi-même."); return; }
  localStorage.setItem('chat_prestataire',prestaId); localStorage.setItem('chat_annonce',a.id); location.href='chat.html';
}
function voirPresta(){
  const a = window._a; if(!a) return;
  const prestaId = a.prestataire_id || a.user_id || a.profiles_id || '';
  if(!prestaId) return;
  localStorage.setItem('fiche_prestataire_id',prestaId); location.href='fiche-prestataire.html';
}
charger();
</script>
</body>
</html>
