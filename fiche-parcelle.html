<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bien - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:520px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-top:14px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card img{width:100%;height:220px;object-fit:cover;background:#e2e8f0}
.body{padding:16px} .body p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.6}
.btn{width:100%;background:#f59e0b;border:none;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;margin-top:10px}
.btn-dark{background:#0f172a;color:#fff}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#dcfce7;color:#166534}
.info{background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="history.back()">← Retour</div>
<div id="contenu">Chargement...</div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const annonceId = localStorage.getItem('fiche_parcelle_id');
async function charger(){
  if(!annonceId){document.getElementById('contenu').innerHTML='Bien introuvable.';return;}
  const {data:a} = await supabase.from('annonces').select('*, profiles(nom, whatsapp)').eq('id',annonceId).single();
  if(!a){document.getElementById('contenu').innerHTML='Bien introuvable.';return;}
  const img = a.photo_url || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800&q=80';
  const estParcelle = (a.categorie||'').toLowerCase().includes('parcelle');
  document.getElementById('contenu').innerHTML = `
  <div class="card"><img src="${img}"><div class="body">
  <span class="badge">✅ Vérifié</span> <span style="font-size:11px;color:#94a3b8">${a.categorie} • ${a.univers}</span>
  <h1 style="font-size:20px;margin:8px 0">${a.titre}</h1>
  <p>👤 ${a.profiles?.nom}<br>📍 ${a.localite} - ${a.ville} • ${a.pays}<br><b style="color:#111;font-size:16px">${a.prix_indicatif>0?Number(a.prix_indicatif).toLocaleString()+' FCFA':'💬 Prix à discuter'}</b></p>
  <p>${a.description||''}</p>
  <div class="info">${estParcelle ? '📜 <b>Vente Parcelle :</b> Réservation 10 000 FCFA pour 30 jours. Reste devant notaire, pas en escrow. Commission 2% plafonnée à 200 000 FCFA.<br>⚠️ Demande toujours le titre foncier / document avant de payer.' : '🏠 <b>Location :</b> 50% d\'un mois en escrow pour bloquer. Libération après visite et signature. Payé par le propriétaire, une fois.'}</div>
  <button class="btn" onclick="discuter()">💬 Discuter avec ${a.profiles?.nom}</button>
  <button class="btn btn-dark" onclick="voirPresta()">Voir le prestataire</button>
  </div></div>`;
  window._a = a;
}
function discuter(){const uid=localStorage.getItem('rocy_user_id'); if(!uid){location.href='connexion.html';return;} localStorage.setItem('chat_prestataire',window._a.prestataire_id); localStorage.setItem('chat_annonce',window._a.id); location.href='chat.html';}
function voirPresta(){localStorage.setItem('fiche_prestataire_id',window._a.prestataire_id); location.href='fiche-prestataire.html';}
charger();
</script>
</body>
</html>
