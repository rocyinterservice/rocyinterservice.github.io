<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catégorie - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.btn{background:#f59e0b;color:#000;border:none;padding:9px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px}
.hero{background:#0f172a;color:#fff;padding:26px 16px 20px;text-align:center}
.hero h1{font-size:24px;line-height:1.2} .hero h1 span{color:#f59e0b} .hero p{opacity:.8;margin-top:8px;font-size:14px}
.back{color:#fff;opacity:.7;font-size:13px;cursor:pointer;text-align:left}
.filters{background:#fff;margin:-10px 16px 16px;padding:14px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);display:grid;gap:10px}
.filters label{font-size:12px;font-weight:700;color:#475569}
.filters select,.filters input{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff}
.section{padding:0 16px 20px} .section h2{font-size:18px;margin-bottom:10px}
.grid{display:grid;gap:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card img{width:100%;height:170px;object-fit:cover;background:#e2e8f0}
.card-body{padding:12px} .card-body h3{font-size:15px} .card-body p{font-size:13px;color:#64748b;margin:6px 0}
.badge{display:inline-block;background:#fef3c7;color:#92400e;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.price{font-weight:800;margin-top:8px}
.card-actions{display:flex;gap:8px;margin-top:10px} .card-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-chat{background:#0f172a;color:#fff} .btn-voir{background:#f1f5f9}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:24px;text-align:center;color:#64748b} .empty b{color:#111;display:block;margin-bottom:6px}
.autres{padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.autres button{background:#fff;border:1px solid #e2e8f0;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;font-size:13px}
.autres button.active{border-color:#f59e0b;background:#fffbeb}
</style>
</head>
<body>
<div class="hero">
  <div class="back" onclick="location.href='index.html'">← Retour à l'accueil</div>
  <h1 id="titrePage">Catégorie</h1>
  <p id="sousTitrePage"></p>
</div>
<div class="filters">
  <div><label data-i18n="pays">PAYS</label><select id="filtrePays" onchange="chargerAnnonces()">
    <option value="">Tous les pays</option><option value="Bénin">🇧🇯 Bénin</option><option value="Togo">🇹🇬 Togo</option><option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option><option value="Sénégal">🇸🇳 Sénégal</option><option value="Cameroun">🇨🇲 Cameroun</option><option value="Nigeria">🇳🇬 Nigeria</option><option value="Ghana">🇬🇭 Ghana</option><option value="France">🇫🇷 France</option><option value="Canada">🇨🇦 Canada</option><option value="Mali">🇲🇱 Mali</option><option value="Burkina Faso">🇧🇫 Burkina Faso</option><option value="Niger">🇳🇪 Niger</option><option value="Guinée">🇬🇳 Guinée</option><option value="Maroc">🇲🇦 Maroc</option><option value="Algérie">🇩🇿 Algérie</option><option value="Tunisie">🇹🇳 Tunisie</option><option value="USA">🇺🇸 USA</option>
  </select></div>
  <div><label data-i18n="ville">VILLE / LOCALITÉ</label><input id="filtreLocalite" data-i18n-ph="villePh" placeholder="Ex: Calavi, Cotonou..." oninput="chargerAnnonces()"></div>
  <div><label data-i18n="rechercher">RECHERCHER UN SERVICE</label><input id="filtreSearch" data-i18n-ph="searchPh" placeholder="Ex: Plombier, Traiteur..." oninput="chargerAnnonces()"></div>
</div>
<div class="autres">
  <button type="button" id="btn-tous" onclick="allerCategorie('')">🌍 Tous</button>
  <button type="button" id="btn-manger" onclick="allerCategorie('manger')">🍽️ Se nourrir</button>
  <button type="button" id="btn-domicile" onclick="allerCategorie('domicile')">🏠 Domicile</button>
  <button type="button" id="btn-pro" onclick="allerCategorie('pro')">💼 Services professionnels</button>
  <button type="button" id="btn-sejour" onclick="allerCategorie('sejour')">✈️ Séjour</button>
  <button type="button" id="btn-immobilier" onclick="allerCategorie('immobilier')">🏘️ Immobilier</button>
</div>
<div class="section">
  <h2 id="titreSection">Annonces</h2>
  <div id="listeAnnonces" class="grid"></div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
let sb = null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); window.supabaseClient = sb; }catch(e){}
const params = new URLSearchParams(location.search);
const universActif = params.get('univers') || '';
const INFOS = {
  '': { ico:'🌍', titre:'Tous les services', sous:'Tous les services réels, près de chez vous.' },
  'manger': { ico:'🍽️', titre:'Se nourrir', sous:'Traiteur, Restaurant, Livraison de repas.' },
  'domicile': { ico:'🏠', titre:'Domicile', sous:'Nettoyage, Ménage, Plomberie, Électricité, Réparation.' },
  'pro': { ico:'💼', titre:'Services professionnels', sous:'Design, Développement, Marketing, Comptabilité.' },
  'sejour': { ico:'✈️', titre:'Séjour', sous:'Hôtel, Location, Guide, Transport.' },
  'immobilier': { ico:'🏘️', titre:'Immobilier', sous:'Location, Vente, Chambre, Visite.' }
};
function allerCategorie(u){ location.href = 'categorie.html?univers=' + u; }
function appliquerInfos(){
  const info = INFOS[universActif] || INFOS[''];
  document.getElementById('titrePage').textContent = info.ico + ' ' + info.titre;
  document.getElementById('sousTitrePage').textContent = info.sous;
  document.getElementById('titreSection').textContent = info.ico + ' ' + info.titre + ' - Annonces';
  document.title = info.titre + ' - Rocyinter';
  const map = {'':'btn-tous','manger':'btn-manger','domicile':'btn-domicile','pro':'btn-pro','sejour':'btn-sejour','immobilier':'btn-immobilier'};
  const b = document.getElementById(map[universActif]||'btn-tous'); if(b) b.classList.add('active');
}
async function chargerAnnonces(){
  const box = document.getElementById('listeAnnonces');
  if(!box) return;
  try{
    const pays = document.getElementById('filtrePays').value;
    const loc = document.getElementById('filtreLocalite').value.trim().toLowerCase();
    const search = document.getElementById('filtreSearch').value.trim().toLowerCase();
    if(!sb){ box.innerHTML = `<div class="empty"><b>Pas de connexion</b><br><button type="button" class="btn" onclick="chargerAnnonces()">Réessayer</button></div>`; return; }
    let q = sb.from('annonces').select('*, profiles(nom, whatsapp, ville, localite)').eq('status','valide').order('created_at',{ascending:false});
    if(universActif) q = q.eq('univers', universActif);
    if(pays) q = q.eq('pays', pays);
    const {data, error} = await q;
    if(error) throw error;
    let filtres = data || [];
    if(loc) filtres = filtres.filter(a => (a.localite||'').toLowerCase().includes(loc) || (a.ville||'').toLowerCase().includes(loc));
    if(search) filtres = filtres.filter(a => (a.titre||'').toLowerCase().includes(search) || (a.categorie||'').toLowerCase().includes(search) || (a.description||'').toLowerCase().includes(search));
    if(filtres.length===0){
      const t = window.rocyT || (k=>k);
      box.innerHTML = `<div class="empty"><b>${t('aucuneTitre')}</b>${t('aucuneSous')}<br><br><button type="button" class="btn" onclick="rocyProposerService()">${t('proposerTitre')}</button></div>`;
      return;
    }
    box.innerHTML = filtres.map(a=>{
      const img = a.photo_url || 'https://images.unsplash.com/photo-1521791136064-7986c2920216?w=800&q=80';
      const nom = a.profiles?.nom || 'Prestataire';
      const lieu = [a.localite, a.ville, a.pays].filter(Boolean).join(' - ');
      const t = window.rocyT || (k=>k);
      const prixTxt = a.prix_fixe ? `${window.rocyFormatPrix ? window.rocyFormatPrix(a.prix_indicatif) : a.prix_indicatif+' FCFA'} - ${t('prixFixe')}` : (a.prix_indicatif>0 ? `${t('aPartir')} ${window.rocyFormatPrix ? window.rocyFormatPrix(a.prix_indicatif) : a.prix_indicatif+' FCFA'}` : t('prixDiscuter'));
      return `<div class="card">
        <img src="${img}" onerror="this.src='https://images.unsplash.com/photo-1521791136064-7986c2920216?w=800&q=80'">
        <div class="card-body">
          <span class="badge">${a.univers||''} • ${a.categorie||''}</span>
          <h3 style="margin-top:8px">${a.titre||''}</h3>
          <p>📍 ${lieu} • 👤 ${nom}</p>
          <p>${(a.description||'').slice(0,90)}...</p>
          <div class="price">${prixTxt}</div>
          <div class="card-actions">
            <button type="button" class="btn-chat" onclick="allerChat('${a.prestataire_id}','${a.id}')">${t('discuter')}</button>
            <button type="button" class="btn-voir" onclick="voirProfil('${a.prestataire_id}')">${t('voirProfil')}</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    box.innerHTML = `<div class="empty"><b>Erreur de connexion</b><br><button type="button" class="btn" onclick="chargerAnnonces()">Réessayer</button></div>`;
  }
}
function allerChat(prestataireId, annonceId){
  const uid = localStorage.getItem('rocy_user_id');
  if(!uid){ location.href='connexion.html'; return; }
  localStorage.setItem('chat_prestataire', prestataireId);
  localStorage.setItem('chat_annonce', annonceId);
  location.href = 'chat.html';
}
function voirProfil(prestataireId){
  localStorage.setItem('fiche_prestataire_id', prestataireId);
  location.href = 'fiche-prestataire.html';
}
appliquerInfos();
chargerAnnonces();
</script>
</body>
</html>
