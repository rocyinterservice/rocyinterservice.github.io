<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="livreursTitre">Livreurs - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pays.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111}
.top{max-width:560px;margin:0 auto;padding:16px}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:13px;margin-bottom:12px;line-height:1.5}
.filters{background:#fff;padding:14px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);display:grid;gap:10px;margin-bottom:12px}
.filters label{font-size:12px;font-weight:700;color:#475569}
.filters select,.filters input{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.btn{width:100%;background:#f59e0b;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.btn-gris{background:#f1f5f9;color:#111}
.info{background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:12px}
.bandeau-role{padding:12px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;line-height:1.5;margin-bottom:12px}
.bandeau-visiteur{background:#fef3c7;color:#92400e}
.bandeau-client{background:#dcfce7;color:#166534}
.bandeau-presta{background:#dbeafe;color:#1e40af}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:24px;text-align:center;color:#64748b}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="location.href='index.html'">← <span data-i18n="accueil">Accueil</span></div>
<h1>🛵 <span data-i18n="livreursTitre">Livreurs</span></h1>
<p class="sub" data-i18n="livreursSous">Choisis un livreur si tu veux déléguer ta livraison. Ce n'est pas obligatoire.</p>
<div class="info">💡 <span data-i18n="livreursInfo">Le restaurant / prestataire peut aussi livrer lui-même. Le livreur, c'est juste si tu veux déléguer. Prix à discuter dans le chat.</span></div>
<div id="bandeauRole"></div>
<div class="filters">
  <div><label data-i18n="pays">PAYS</label><select id="filtrePays" onchange="charger()"><option value="">Tous les pays</option></select></div>
  <div><label data-i18n="ville">VILLE / LOCALITÉ</label><input id="search" placeholder="Ex: Calavi, Godomey, Cotonou..." oninput="afficher()"></div>
</div>
<div id="liste"><span data-i18n="chargement">Chargement...</span></div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
let sb = null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); window.supabaseClient = sb; }catch(e){}
let tous=[]; let moiId=''; let monRole='';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function remplirPays(){
  const sel=document.getElementById('filtrePays');
  if(window.ROCY_PAYS&&window.ROCY_PAYS.length){ sel.innerHTML='<option value="">Tous les pays</option>'+window.ROCY_PAYS.map(p=>`<option value="${esc(p.nom)}">${esc(p.drapeau)} ${esc(p.nom)}</option>`).join(''); }
}
async function afficherBandeauRole(){
  const box = document.getElementById('bandeauRole'); if(!box) return;
  const {data:{user}} = await sb.auth.getUser();
  moiId = user?.id || '';
  if(user){ const {data:p}=await sb.from('profiles').select('type_compte, role').eq('id',user.id).maybeSingle(); monRole=String(p?.type_compte||p?.role||'').toLowerCase(); }
  const t = window.rocyT || (k=>k);
  if(!moiId) box.innerHTML = `<div class="bandeau-role bandeau-visiteur">👁️ ${esc(t('bandeauVisiteur'))}</div>`;
  else if(monRole==='prestataire' || monRole==='livreur') box.innerHTML = `<div class="bandeau-role bandeau-presta">🛠️ ${esc(t('bandeauPresta'))}</div>`;
  else if(monRole==='admin') box.innerHTML = `<div class="bandeau-role bandeau-presta">🛡️ ${esc(t('bandeauAdmin'))}</div>`;
  else box.innerHTML = `<div class="bandeau-role bandeau-client">🛒 ${esc(t('bandeauClient'))}</div>`;
}
function afficher(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  const pays=document.getElementById('filtrePays')?document.getElementById('filtrePays').value:'';
  const box=document.getElementById('liste'); const t = window.rocyT || (k=>k);
  let list=tous;
  if(pays) list=list.filter(l=>(l.pays||'')===pays);
  if(q) list=list.filter(l=>((l.nom||'')+' '+(l.ville||'')+' '+(l.localite||'')+' '+(l.description||'')).toLowerCase().includes(q));
  if(!list.length){box.innerHTML=`<div class="empty"><b>${esc(t('aucuneTitre'))}</b><br>${esc(t('aucuneSous'))}<br><br><button class="btn" onclick="location.href='inscription.html'">${esc(t('devenirLivreur'))}</button></div>`;return;}
  box.innerHTML=list.map(l=>{
    const lieu=[l.localite,l.ville,l.pays].filter(Boolean).join(' - ');
    const cestMoi = moiId && String(l.id)===String(moiId);
    const btnChat = cestMoi ? `<button class="btn btn-gris" disabled>C'est toi</button>` : `<button class="btn btn-dark" onclick="discuter('${esc(l.id)}')">💬 ${esc(t('confierLivraison'))}</button>`;
    return `<div class="card"><span class="badge">✅ ${esc(t('verifie'))}</span><h3 style="margin-top:8px">🛵 ${esc(l.nom)}</h3><p>📍 ${esc(lieu)}<br>${esc(l.description||t('livreurDesc'))}<br><b>💬 ${esc(t('prixDiscuter'))}</b> - ${esc(t('pasPrixFixe'))}</p><button class="btn btn-gris" onclick="voirPresta('${esc(l.id)}')">${esc(t('voirLivreur'))}</button>${btnChat}</div>`;
  }).join('');
  if(window.rocyAppliquerTraduction) window.rocyAppliquerTraduction();
}
async function charger(){
  const box=document.getElementById('liste'); const t = window.rocyT || (k=>k);
  if(!sb){box.innerHTML=`<div class="empty"><b>${esc(t('pasConnexion'))}</b><br><button class="btn" onclick="charger()">${esc(t('reessayer'))}</button></div>`;return;}
  try{
    const {data,error}=await sb.from('profiles').select('id, nom, ville, localite, pays, description, photo_url, avatar_url').or('role.eq.livreur,type_compte.eq.livreur').eq('statut_validation','valide').order('created_at',{ascending:false});
    if(error) throw error;
    tous=data||[]; afficher();
  }catch(e){ console.log('ROCY livreurs erreur:',e); box.innerHTML=`<div class="empty"><b>${esc(t('erreurConnexion'))}</b><br><button class="btn" onclick="charger()">${esc(t('reessayer'))}</button></div>`; }
}
function voirPresta(id){localStorage.setItem('fiche_prestataire_id',id); location.href='fiche-prestataire.html';}
async function discuter(id){
  const t = window.rocyT || (k=>k);
  const {data:{user}} = await sb.auth.getUser();
  if(!user){alert(t('connectePourCommander')); location.href='connexion.html'; return;}
  if(String(id)===String(user.id)){ alert("C'est toi."); return; }
  if(monRole==='admin'){ alert('Admin : tu ne peux pas chatter.'); return; }
  localStorage.setItem('chat_prestataire',id); localStorage.removeItem('chat_annonce'); location.href='chat.html';
}
remplirPays();
afficherBandeauRole();
charger();
</script>
</body>
</html>
