<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livreurs - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:560px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 4px} h1 span{color:#f59e0b}
p.sub{color:#64748b;font-size:13px;margin-bottom:12px}
input,select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;background:#fff}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0;line-height:1.5}
.btn{width:100%;background:#f59e0b;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.info{background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:12px}
</style>
</head>
<body>
<div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>🛵 <span>Livreurs</span></h1>
<p class="sub">Livraison = choix, pas obligatoire. Tu cherches un livreur, tu discutes, vous vous mettez d'accord sur le prix dans le chat. Livreur garde 80%, Rocyinter 20%.</p>
<div class="info">💡 Le restaurant / prestataire peut aussi livrer lui-même. Le livreur, c'est juste si tu veux déléguer.</div>
<select id="filtrePays" onchange="charger()"><option value="">Tous les pays</option><option value="Bénin">🇧🇯 Bénin</option><option value="Togo">🇹🇬 Togo</option><option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option><option value="Sénégal">🇸🇳 Sénégal</option><option value="Cameroun">🇨🇲 Cameroun</option><option value="Nigeria">🇳🇬 Nigeria</option><option value="Ghana">🇬🇭 Ghana</option><option value="France">🇫🇷 France</option><option value="Canada">🇨🇦 Canada</option></select>
<input id="search" placeholder="🔍 Localité : Calavi, Godomey, Cotonou..." oninput="afficher()">
<div id="liste">Chargement...</div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let tous=[];
function afficher(){const q=document.getElementById('search').value.trim().toLowerCase(); const box=document.getElementById('liste'); let list=tous; if(q) list=list.filter(l=>(l.nom+' '+l.ville+' '+l.localite+' '+(l.description||'')).toLowerCase().includes(q)); if(!list.length){box.innerHTML=`<p style="text-align:center;color:#64748b;padding:20px;background:#fff;border-radius:16px">Aucun livreur validé pour cette zone.<br><br><button class="btn" onclick="location.href='inscription.html'">Devenir livreur</button></p>`;return;} box.innerHTML=list.map(l=>`<div class="card"><h3>🛵 ${l.nom}</h3><p>📍 ${l.localite} - ${l.ville} • ${l.pays}<br>${l.description||'Livreur vérifié - Moto'}<br><b>💬 Prix à discuter dans le chat</b> - Pas de prix fixe</p><button class="btn" onclick="voirPresta('${l.id}')">Voir le livreur</button><button class="btn btn-dark" onclick="discuter('${l.id}')">💬 Confier une livraison</button></div>`).join('');}
async function charger(){const pays=document.getElementById('filtrePays').value; let query=supabase.from('profiles').select('*').eq('role','livreur').eq('statut_validation','valide').order('created_at',{ascending:false}); if(pays) query=query.eq('pays',pays); const {data}=await query; tous=data||[]; afficher();}
function voirPresta(id){localStorage.setItem('fiche_prestataire_id',id); location.href='fiche-prestataire.html';}
function discuter(id){const uid=localStorage.getItem('rocy_user_id'); if(!uid){location.href='connexion.html';return;} localStorage.setItem('chat_prestataire',id); localStorage.removeItem('chat_annonce'); location.href='chat.html';}
charger();
</script>
</body>
</html>
