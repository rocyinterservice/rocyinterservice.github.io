<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panier - Rocyinter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="rocy-layout.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f7f9;color:#111;padding:16px}
.top{max-width:520px;margin:0 auto}
.back{color:#64748b;font-size:13px;cursor:pointer}
h1{font-size:22px;margin:14px 0 12px} h1 span{color:#f59e0b}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px} .card p{font-size:13px;color:#64748b;margin:6px 0}
.btn{width:100%;background:#f59e0b;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-dark{background:#0f172a;color:#fff}
.btn-gris{background:#f1f5f9;color:#111}
.info{background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}
</style></head>
<body><div class="top">
<div class="back" onclick="location.href='index.html'">← Accueil</div>
<h1>🛒 Mon <span>Panier</span></h1>
<div class="info">Ton panier, c'est tes propositions acceptées en attente de paiement en Escrow. Tu paies à Rocyinter, pas au prestataire.</div>
<div id="liste" style="margin-top:12px">Chargement...</div>
</div>
<script>
const SUPABASE_URL = "https://gdwgjsloivrpxxvggxyz.supabase.co";
const SUPABASE_KEY = "sb_publishable_toAIjzrpbo2mNqPqLKlI9Q_sqzcR6dF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = sb;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let panier = []; let uid='';
async function charger(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ location.href='connexion.html'; return; }
  uid = user.id;
  const {data, error} = await sb.from('commandes').select('id, titre, montant_total, commission, montant_prestataire, univers, localite, ville, prestataire_id, conversation_id, profiles:prestataire_id(nom)').eq('client_id', uid).eq('status','en_attente').order('created_at',{ascending:false});
  if(error){ document.getElementById('liste').innerHTML = `<p style="text-align:center;color:#991b1b;padding:20px;background:#fff;border-radius:16px">Erreur : ${esc(error.message)}</p>`; return; }
  panier = data || [];
  if(!panier.length){
    document.getElementById('liste').innerHTML = '<p style="text-align:center;color:#64748b;padding:20px;background:#fff;border-radius:16px">Panier vide.<br>Discute avec un prestataire, accepte sa proposition, elle apparaîtra ici.</p>';
    return;
  }
  document.getElementById('liste').innerHTML = panier.map((p,i)=>`<div class="card">
    <h3>${esc(p.titre)}</h3>
    <p>Montant : <b>${Number(p.montant_total||0).toLocaleString()} FCFA</b><br>Prestataire : ${esc(p.profiles?.nom || 'Prestataire')}<br>${esc(p.localite||'')} - ${esc(p.ville||'')}</p>
    <button class="btn" onclick="payer(${i})">Payer en Escrow</button>
    <button class="btn btn-gris" onclick="voirChat(${i})">Voir la discussion</button>
    <button class="btn btn-dark" onclick="retirer(${i})">Annuler</button>
  </div>`).join('');
}
function payer(i){
  const p = panier[i]; if(!p) return;
  localStorage.setItem('paiement_commande_id', p.id);
  location.href='paiement.html';
}
function voirChat(i){
  const p = panier[i]; if(!p) return;
  if(p.prestataire_id) localStorage.setItem('chat_prestataire', p.prestataire_id);
  if(p.conversation_id) localStorage.setItem('chat_conversation_id', p.conversation_id);
  location.href='chat.html';
}
async function retirer(i){
  const p = panier[i]; if(!p) return;
  if(!confirm('Annuler cette commande ? Le prestataire sera prévenu.')) return;
  const {error} = await sb.from('commandes').update({status:'annule'}).eq('id', p.id).eq('client_id', uid).eq('status','en_attente');
  if(error){ alert('Erreur : '+error.message); return; }
  // 🔔 Notif au prestataire
  if(p.prestataire_id){
    await sb.rpc('creer_notification', { p_user_id: p.prestataire_id, p_titre: '❌ Commande annulée', p_message: `Le client a annulé la commande "${p.titre}".`, p_type: 'commande', p_lien: 'dashboard-prestataire.html' });
  }
  charger();
}
charger();
</script></body></html>
